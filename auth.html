<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - الدكتور</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-logo">
            <i class="fa-solid fa-heart-pulse"></i>
        </div>
        <h2 class="auth-title">أهلاً بك يا دكتور</h2>
        <p class="auth-subtitle">اضغط على الزر أدناه للدخول إلى المنصة</p>

        <div id="errorBox" class="error-msg"></div>
 
        <button id="loginBtn" class="auth-btn" onclick="anonymousLogin()">
            <i class="fa-solid fa-right-to-bracket"></i> دخول كزائر (Anonymous)
        </button>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyD092yeOowtCLW0fDcIzaEXrnxvrN4X5T8", authDomain: "abqarieno.firebaseapp.com", databaseURL: "https://abqarieno-default-rtdb.firebaseio.com", projectId: "abqarieno", storageBucket: "abqarieno.firebasestorage.app", messagingSenderId: "790682500839", appId: "1:790682500839:web:cd50b8e01729f821e06c42" };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // تفعيل الحفظ المحلي للجلسة
        setPersistence(auth, browserLocalPersistence).catch(console.error);

        // التحقق مما إذا كان المستخدم مسجلاً بالفعل
        onAuthStateChanged(auth, (user) => {
            if (user) {
                checkUserRole(user.uid);
            }
        });

        window.anonymousLogin = function() {
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الدخول...';
            
            signInAnonymously(auth)
            .then(() => {
                // سيتم التوجيه تلقائياً عبر onAuthStateChanged
            })
            .catch((error) => {
                console.error(error);
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> دخول كزائر (Anonymous)';
                errorBox.style.display = 'block';
                // رسالة خطأ واضحة إذا لم يتم تفعيل الخاصية في فايربيز
                if(error.code === 'auth/admin-restricted-operation') {
                    errorBox.innerText = "عذراً، يجب تفعيل خيار Anonymous في لوحة تحكم Firebase أولاً.";
                } else {
                    errorBox.innerText = "حدث خطأ: " + error.message;
                }
            });
        }

        async function checkUserRole(uid) {
            const snapshot = await get(ref(db, 'users/' + uid));
            if (snapshot.exists()) {
                const userData = snapshot.val();
                if (userData.banned) {
                    alert("تم حظر حسابك من قبل الإدارة.");
                    return;
                }
                if (userData.role === 'admin') window.location.href = "admin.html";
                else window.location.href = "index.html";
            } else {
                window.location.href = "index.html";
            }
        }
    </script>
</body>
</html>
