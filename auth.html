<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - الدكتور</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <!-- تحضير الصفحة القادمة لسرعة الانتقال -->
    <link rel="prefetch" href="complete-profile.html">
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-red: #ff003c;
            --glass-bg: rgba(10, 10, 15, 0.96); /* تعتيم الخلفية لزيادة الفخامة والقوة */
        }
 
        body {
            background: #050505;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden; position: relative;
        }

        /* Background orbs for premium feel */
        .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.3; z-index: 0; }
        .orb-1 { width: 400px; height: 400px; background: var(--neon-red); top: -10%; left: -10%; }
        .orb-2 { width: 350px; height: 350px; background: var(--neon-green); bottom: -10%; right: -10%; }

        .auth-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12); /* حدود أوضح وأقوى */
            border-radius: 28px;
            padding: clamp(35px, 8vw, 55px) clamp(20px, 5vw, 45px);
            width: 92%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            position: relative; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            transition: transform 0.3s ease;
        }

        /* التأكد من عدم وجود أي تأثيرات ضوئية موروثة */
        .auth-container::before, .auth-container::after { display: none !important; }

        .auth-logo i {
            font-size: clamp(3.5rem, 12vw, 4.5rem); 
            color: var(--neon-red);
            filter: drop-shadow(0 0 20px rgba(255, 0, 60, 0.4));
            margin-bottom: 20px; animation: heartBeat 2s infinite;
        }

        .auth-title { font-size: clamp(1.8rem, 6vw, 2.2rem); font-weight: 900; color: #fff; margin-bottom: 10px; }
        .auth-subtitle { color: #888; font-size: clamp(0.9rem, 2.5vw, 1rem); margin-bottom: 40px; line-height: 1.5; }

        .auth-btn {
            width: 100%; height: 56px; border-radius: 16px;
            background: var(--neon-green); color: #000;
            border: none; font-weight: 900; font-size: 1.1rem;
            cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 255, 65, 0.3);
            display: flex; align-items: center; justify-content: center; gap: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-btn:hover {
            transform: translateY(-3px);
            background: #fff; box-shadow: 0 15px 40px rgba(0, 255, 65, 0.4);
        }

        .auth-btn:active { transform: translateY(0) scale(0.98); }

        .error-msg {
            background: rgba(255, 0, 60, 0.1); border: 1px solid var(--neon-red);
            color: var(--neon-red); padding: 12px; border-radius: 12px;
            margin-bottom: 20px; font-size: 0.9rem; display: none;
        }

        @keyframes heartBeat {
            0%, 28%, 70%, 100% { transform: scale(1); }
            14%, 42% { transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="auth-container">
        <div class="auth-logo">
            <i class="fa-solid fa-heart-pulse"></i>
        </div>
        <h2 class="auth-title">منصة الدكتور</h2>
        <p class="auth-subtitle">بوابتك لعالم الأحياء بمنظور مختلف</p>

        <div id="errorBox" class="error-msg"></div> 
 
        <button id="loginBtn" class="auth-btn" onclick="anonymousLogin()">
            <i class="fa-solid fa-bolt"></i> دخول سريع للمنصة
        </button>

        <p style="margin-top: 25px; color: #555; font-size: 0.8rem;">
            <i class="fa-solid fa-shield-halved"></i> نظام دخول آمن ومستقر
        </p>
    </div>

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, setPersistence, browserLocalPersistence, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
        const auth = getAuth(app);
        const db = getDatabase(app);
        const errorBox = document.getElementById('errorBox');

        // تفعيل الحفظ المحلي للجلسة
        setPersistence(auth, browserLocalPersistence).catch(console.error);

        window.anonymousLogin = function() {
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-bolt fa-spin"></i> جاري التحليق للمنصة...';
            
            signInAnonymously(auth)
            .then(() => {
                // سيتم التوجيه تلقائياً عبر onAuthStateChanged
            })
            .catch((error) => {
                console.error(error);
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-bolt"></i> دخول سريع للمنصة';
                errorBox.style.display = 'block';
                // رسالة خطأ واضحة إذا لم يتم تفعيل الخاصية في فايربيز
                if(error.code === 'auth/admin-restricted-operation') {
                    errorBox.innerText = "عذراً، يجب تفعيل خيار Anonymous في لوحة تحكم Firebase أولاً.";
                } else {
                    errorBox.innerText = "حدث خطأ: " + error.message;
                }
            });
        }

        // مراقب الحالة: توجيه فوري بدون تأخير
        onAuthStateChanged(auth, (user) => {
            if (user) {
                checkUserRole(user.uid);
            }
        });

        async function checkUserRole(uid) {
            const snapshot = await get(ref(db, 'users/' + uid));
            if (snapshot.exists()) {
                const userData = snapshot.val();
                if (userData.banned) {
                    alert("تم حظر حسابك من قبل الإدارة.");
                    signOut(auth);
                    return;
                }
                
                // منطق الربط الذكي: إذا لم يكمل البيانات يذهب فوراً لصفحة الإكمال
                if (userData.role === 'admin') window.location.href = "admin.html";
                else if (!userData.username) window.location.href = "complete-profile.html";
                else window.location.href = "index.html";
            } else {
                // مستخدم جديد تماماً -> لصفحة الإكمال فوراً
                window.location.href = "complete-profile.html";
            }
        }
    </script>
</body>
</html>
