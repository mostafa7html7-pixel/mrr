<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية - الدكتور</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- Admin Dashboard V2 Styles --- */
        :root {
            --admin-bg: #020205;
            --admin-surface: #0a0c12;
            --admin-surface-light: #1c2128;
            --admin-border: #30363d; 
            --admin-text-primary: #f0f6fc;  
            --admin-text-secondary: #9ca3af;
            --admin-accent: #00ff88;
            --admin-neon-blue: #00d2ff;
            --admin-royal-red: #990000;
        }  
  
        body.light-mode { 
            --admin-bg: #f0f2f5;
            --admin-surface: #ffffff;
            --admin-surface-light: #f8f9fa;
            --admin-border: #ddd;
            --admin-text-primary: #333;
            --admin-text-secondary: #666;
        }

        body.sepia-mode {
            --admin-bg: #f5e6d3;
            --admin-surface: #fffdf5;
            --admin-surface-light: #efe3d0;
            --admin-border: #dccfb6;
            --admin-text-primary: #433422;
            --admin-text-secondary: #7c6f5c;
            --admin-accent: #2e8b57;
        }

        body {
            background-color: var(--admin-bg);
            color: var(--admin-text-primary);
        }

        .admin-container {
            display: block;
            min-height: 100vh;
        }

        .admin-content {
            flex: 1;
            margin-right: 0;
            padding: 40px 5%;
            background: var(--admin-bg);
        }

        /* شريط الإحصائيات المدمج والاحترافي */
        .admin-stats-bar {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.08), rgba(0, 210, 255, 0.05));
            border: 1px solid var(--admin-border);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        .stat-item-compact {
            text-align: center;
            position: relative;
            flex: 1;
        }
        .stat-item-compact:not(:last-child)::after {
            content: ''; position: absolute; left: 0; top: 20%; height: 60%; width: 1px; background: rgba(255,255,255,0.1);
        }
        .stat-item-compact h4 { font-size: 0.75rem; color: var(--admin-text-secondary); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .stat-item-compact h4 i { color: var(--admin-accent); font-size: 0.9rem; }
        .stat-item-compact .val { font-size: 1.8rem; font-weight: 900; color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .stat-item-compact.red h4 i { color: var(--neon-red); }
        .stat-item-compact.red .val { color: var(--neon-red); text-shadow: 0 0 15px rgba(255, 0, 0, 0.2); }

        .panel-section { 
            background: var(--admin-surface); 
            border: 1px solid var(--admin-border); 
            border-radius: 12px; 
            padding: 20px; 
        }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        /* تصغير وتحسين العنوان */
        .panel-title { 
            font-size: 0.95rem; 
            font-weight: 700; 
            color: var(--admin-text-secondary); 
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .panel-title::before {
            content: ''; width: 4px; height: 18px; background: var(--admin-royal-red); border-radius: 10px;
        }

        .search-box { position: relative; max-width: 400px; }
        .search-box input { 
            width: 100%; 
            background: var(--admin-bg); 
            border: 1px solid var(--admin-border); 
            padding: 12px 40px 12px 15px; 
            border-radius: 8px; 
            color: #fff; 
            outline: none; 
            transition: 0.3s; 
        }
        .search-box input:focus { border-color: var(--admin-accent); background: rgba(0,0,0,0.4); }
        .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #666; }

        .admin-users-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .admin-user-card {
            background: var(--admin-surface-light); 
            border: 1px solid var(--admin-border); 
            border-radius: 12px;
            content-visibility: auto; /* تسريع فتح الصفحة عبر عدم معالجة الكروت خارج الشاشة */
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
            transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden;
        }
        .admin-user-card:hover { transform: translateY(-3px); border-color: var(--admin-royal-red); box-shadow: 0 10px 30px rgba(153, 0, 0, 0.15); }
        .admin-user-card.banned { border-color: var(--neon-red); background: rgba(255, 0, 0, 0.05); }
        .admin-user-card.banned .user-main-info .avatar { border-color: var(--neon-red); }

        /* تحسينات إضافية لبطاقة الطالب */
        .user-grade-badge {
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.6rem;
            font-weight: bold;
            background: rgba(0, 255, 136, 0.1);
            color: var(--admin-accent);
            border: 1px solid rgba(0, 255, 136, 0.2);
            backdrop-filter: blur(5px);
            white-space: nowrap;
        }
        .admin-user-card.banned .user-grade-badge {
            background: rgba(255, 0, 60, 0.1);
            color: var(--neon-red);
            border-color: rgba(255, 0, 60, 0.2);
        }

        .user-main-info { display: flex; align-items: center; gap: 15px; padding-bottom: 15px; border-bottom: 1px solid #30363d; position: relative; }
        .user-main-info .avatar { width: 55px; height: 55px; border-radius: 12px; object-fit: cover; border: 2px solid var(--admin-royal-red); cursor: zoom-in; transition: 0.3s; background: #111; flex-shrink: 0; }
        .user-main-info .avatar:hover { transform: scale(1.1); border-color: #fff; }
        .user-main-info h3 { margin: 0; font-size: 1rem; overflow: hidden; text-shadow: none; color: #fff; }
        .user-main-info p { margin: 0; color: var(--admin-text-secondary); font-size: 0.85rem; }

        /* تمييز حالة الاتصال */
        .last-seen-label {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
        }

        .user-details { display: flex; flex-direction: column; gap: 10px; font-size: 0.9rem; padding: 5px 0; }
        .user-details span { display: flex; align-items: center; gap: 8px; color: var(--admin-text-secondary); }
        .user-details span i { color: var(--admin-accent); width: 20px; text-align: center; }
        .user-details span strong { color: var(--admin-text-primary); font-weight: normal; }

        .card-actions { display: flex; gap: 10px; margin-top: auto; }
        .card-actions .btn-action { 
            flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid transparent; 
            cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: 0.3s; 
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .card-actions .ban { background: transparent; color: #ff7b72; border-color: #ff7b72; }
        .card-actions .ban:hover { background: rgba(255, 123, 114, 0.1); }
        .card-actions .unban { background: transparent; color: var(--admin-accent); border-color: var(--admin-accent); }
        .card-actions .unban:hover { background: rgba(0, 255, 136, 0.1); }
        .card-actions .delete { background: transparent; color: #8b949e; border-color: #8b949e; }
        .card-actions .delete:hover { background: rgba(139, 148, 158, 0.1); color: #c9d1d9; }

        /* تحسينات المودال للموبايل */
        .schedule-modal-content {
            max-width: 800px;
            margin: 5vh auto;
            background: var(--admin-surface);
            border: 1px solid var(--admin-accent);
            padding: 30px;
            border-radius: 20px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            width: 95%;
            animation: fadeInUp 0.4s ease;
        }

        /* تحسينات المودال للمستر */
        .schedule-modal-content {
            max-width: 800px;
            margin: 5vh auto;
            background: var(--admin-surface);
            border: 1px solid var(--admin-accent);
            padding: 0;
            border-radius: 20px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            width: 95%;
            animation: fadeInUp 0.4s ease;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .modal-header-pro {
            padding: 20px 25px;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-body-pro { padding: 25px; }

        .group-edit-row {
            display: grid;
            grid-template-columns: 1fr 1fr 120px;
            gap: 10px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--admin-border);
            transition: 0.3s;
        }
        .group-edit-row:hover { border-color: var(--admin-accent); background: rgba(0,255,136,0.03); }

        .sch-in {
            background: #000;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            outline: none;
            font-size: 0.9rem;
            font-family: inherit;
        }
        .sch-in:focus { border-color: var(--admin-accent); }

        @media (max-width: 768px) {
            .admin-content { padding: 20px 15px; }
            .stat-grid { grid-template-columns: 1fr; }
            .panel-header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .search-box { max-width: 100%; }
            .stat-card .number { font-size: 2.2rem; }
            .admin-users-grid { grid-template-columns: 1fr; } /* Single column for user cards */
        }

        /* --- تحسينات الهيدر الخاص بالأدمن (Admin Header Professionalism) --- */
        .navbar.admin-nav {
            border-bottom: 1px solid rgba(0, 255, 136, 0.15);
            background: rgba(15, 17, 21, 0.98);
            backdrop-filter: blur(15px);
            padding: 10px 5%;
        }
        .admin-nav .logo-text span {
            color: var(--admin-accent);
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }
        .admin-nav .nav-links a {
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.3s;
        }
        .admin-nav .nav-links a.logout-link {
            color: var(--neon-red) !important;
            border: 1px solid rgba(255, 0, 60, 0.3);
            padding: 6px 15px !important;
            border-radius: 10px;
            margin-right: 10px;
        }
        .admin-nav .nav-links a.logout-link:hover {
            background: rgba(255, 0, 60, 0.1);
            border-color: var(--neon-red);
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.3);
        }
    </style>
</head>
<body>
    <!-- Gatekeeper Overlay (Hidden by Default) -->
    <div id="loadingOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:radial-gradient(circle at center, #0a0a0f 0%, #020204 100%); z-index:99999; display:flex; align-items:center; justify-content:center; backdrop-filter: blur(20px); transition: 0.5s;">
        <div class="auth-card-mini" id="authCard" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 30px; text-align: center; width: 90%; max-width: 380px; box-shadow: 0 25px 50px rgba(0,0,0,0.5);">
            <i id="lockIcon" class="fa-solid fa-spinner fa-spin main-lock" style="font-size: 3.5rem; color: var(--neon-green); margin-bottom: 20px; filter: drop-shadow(0 0 15px rgba(0, 255, 65, 0.4));"></i>
            <h2 id="lockText" style="font-family: 'Reem Kufi', sans-serif; margin-bottom: 10px; color: #fff;">مرحباً بك يا دكتور</h2>
            <p id="lockSubText" style="color: #888; font-size: 0.9rem; margin-bottom: 25px;">جاري فحص تصريح الدخول...</p>
            
            <div id="passwordArea" style="display: none; animation: fadeInUp 0.4s ease;">
                <div class="secret-input-wrapper" style="position: relative; margin-bottom: 20px;">
                    <input type="password" id="secretCode" placeholder="••••" style="width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #333; background: #000; color: #fff; text-align: center; font-size: 1.2rem; letter-spacing: 5px; outline: none;">
                </div>
                <button class="btn-unlock" onclick="activateMaster()" style="width: 100%; padding: 15px; border-radius: 15px; border: none; background: var(--neon-green); color: #000; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s;">
                    <i class="fa-solid fa-bolt"></i> فتح لوحة التحكم
                </button>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox-overlay" class="lightbox-overlay">
        <span class="close-lightbox">&times;</span>
        <div class="lightbox-content" id="lightbox-content"></div>
    </div>

    <nav class="navbar admin-nav">
        <div class="logo">
            <i class="fa-solid fa-heart-pulse"></i>
            <div class="logo-text"><span>الدكتور</span><small>ADMIN DASHBOARD</small></div>
        </div>
        <ul class="nav-links">
            <li><a href="admin.html" class="active">الطلاب</a></li>
            <li><a href="admin-quizzes.html">الاختبارات</a></li>
            <li><a href="admin-scores.html">النتائج</a></li>
            <li><a href="admin-payments.html">المدفوعات</a></li>
            <li><a href="index.html" style="color: var(--admin-accent);"><i class="fa-solid fa-eye"></i> الموقع</a></li>
            <li><a href="javascript:void(0)" onclick="logout()" class="logout-link"><i class="fa-solid fa-power-off"></i> خروج</a></li>
        </ul>
        <div style="display:flex; align-items:center; gap:5px;">
            <button id="themeToggle" class="theme-toggle" title="تبديل الوضع"><i class="fa-solid fa-moon"></i></button>
            <!-- تمت إضافة زر التثبيت المخفي للحفاظ على تماثل التخطيط -->
            <button id="installAppBtn" class="btn-nav-install" style="display: none;" title="تثبيت التطبيق"><i class="fa-solid fa-download"></i></button>
            <div class="menu-btn"><i class="fa-solid fa-bars"></i></div>
        </div>
    </nav>

    <!-- Schedule Editor Modal -->
    <div id="scheduleModal" class="modal" style="display: none;">
        <div class="modal-content schedule-modal-content">
            <div class="modal-header-pro">
                <h2 style="margin: 0; color: var(--admin-accent); font-family: 'Reem Kufi', sans-serif;"><i class="fa-solid fa-calendar-pen"></i> إدارة جداول المواعيد</h2>
                <span class="close-modal" onclick="closeModal('scheduleModal')" style="cursor:pointer; font-size:1.5rem; color: #888;">&times;</span>
            </div>
            <div class="modal-body-pro">
                <div id="scheduleEditorContent" style="text-align:right;">
                    <p style="text-align: center;">جاري تحميل بيانات الجدول...</p>
                </div>
            </div>
            <div class="modal-footer-btns" style="padding: 20px 25px; background: rgba(255,255,255,0.02); border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 10px;">
                <button class="auth-btn" style="flex: 2; padding:15px; border-radius:10px; cursor:pointer;" onclick="saveScheduleChanges()">حفظ المواعيد ونشر خبر</button>
                <button style="flex: 1; background:transparent; border:1px solid #444; color:#888; border-radius:10px; cursor:pointer;" onclick="closeModal('scheduleModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="app-content">
    <div class="admin-container" id="adminPanel" style="opacity:1;">
        <!-- Main Content -->
        <main class="admin-content">
            <!-- الشريط المدمج الجديد -->
            <div class="admin-stats-bar">
                <div class="stat-item-compact">
                    <h4><i class="fa-solid fa-user-graduate"></i> إجمالي الطلاب</h4>
                    <span class="val" id="totalUsersStat">0</span>
                </div>
                <div class="stat-item-compact red">
                    <h4><i class="fa-solid fa-user-lock"></i> المحظورين</h4>
                    <span class="val" id="bannedUsersStat">0</span>
                </div>
            </div>

            <!-- Users Panel -->
            <div class="panel-section">
                <div class="panel-header">
                    <h2 class="panel-title">الطلاب المنضمين حديثاً</h2>
                    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                        <button class="btn-action unban" onclick="openScheduleEditor()"><i class="fa-solid fa-calendar-days"></i> تعديل الجدول</button>
                        <div class="search-box">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="searchInput" placeholder="بحث بالاسم أو الرقم..." onkeyup="filterUsers()">
                        </div>
                    </div>
                </div>
                <div class="admin-users-grid" id="usersGridContainer">
                    <p style="color:var(--admin-text-secondary); text-align:center;">جاري تحميل بيانات الطلاب...</p>
                </div>
            </div>
        </main>
    </div>
    </div>

    <script src="main.js"></script>
    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getDatabase, ref, onValue, get, update, remove, child } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
        const db = getDatabase(app);
        const auth = getAuth(app);

        // --- نظام الدخول الصاروخي (Rocket Speed Check) ---
        const checkLocalAccess = () => {
            const overlay = document.getElementById('loadingOverlay');
            const grid = document.getElementById('usersGridContainer');
            const isVerified = localStorage.getItem('biology_user_role') === 'master';
            
            if (isVerified && overlay) overlay.style.display = 'none';

            // --- تحضير البيانات المخزنة مسبقاً للعرض الفوري ---
            const cachedTotal = localStorage.getItem('admin_cache_total');
            const cachedBanned = localStorage.getItem('admin_cache_banned');
            const cachedGrid = localStorage.getItem('admin_cache_grid');

            if (cachedTotal) document.getElementById('totalUsersStat').innerText = cachedTotal;
            if (cachedBanned) document.getElementById('bannedUsersStat').innerText = cachedBanned;
            if (cachedGrid) grid.innerHTML = cachedGrid;
        };

        // استدعاء فحص السرعة فوراً
        checkLocalAccess();

        let currentUserUid = null;

        // Helper function to calculate time ago
        function timeAgo(isoDateString) {
            if (!isoDateString) return 'غير معروف';
            const date = new Date(isoDateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);

            let interval = seconds / 31536000;
            if (interval > 1) return `منذ ${Math.floor(interval)} سنة`;
            interval = seconds / 2592000;
            if (interval > 1) return `منذ ${Math.floor(interval)} شهر`;
            interval = seconds / 86400;
            if (interval > 1) return `منذ ${Math.floor(interval)} يوم`;
            interval = seconds / 3600;
            if (interval > 1) return `منذ ${Math.floor(interval)} ساعة`;
            interval = seconds / 60;
            if (interval > 1) return `منذ ${Math.floor(interval)} دقيقة`;
            return 'الآن';
        }



        // --- Admin Logic ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserUid = user.uid;

                // التحقق من الصلاحية من قاعدة البيانات
                const snapshot = await get(ref(db, 'users/' + user.uid));
                const userData = snapshot.val();
                
                // تأمين فائق: يجب أن يكون مسجلاً وله اسم في القاعدة للدخول
                if (!userData || (!userData.name && !userData.username)) {
                    alert("عذراً يا دكتور، يجب إكمال بياناتك الشخصية كطالب أولاً قبل محاولة تفعيل لوحة التحكم.");
                    window.location.href = "complete-profile.html";
                    return;
                }

                // التحقق من حالة الأدمن في القاعدة لضمان الأمان
                if (userData && userData.role === 'admin') { 
                    localStorage.setItem('biology_user_role', 'master'); 
                    const overlay = document.getElementById('loadingOverlay');
                    if (overlay) overlay.style.display = 'none';
                    initDashboard(); // تحميل البيانات فقط إذا كان أدمن
                } else {
                    // إذا لم يكن أدمن في القاعدة، نظهر طلب الكود السري
                    if(document.getElementById('lockIcon')) document.getElementById('lockIcon').className = "fa-solid fa-lock main-lock";
                    document.getElementById('lockSubText').innerText = "يرجى إدخال كود الوصول السري لتفعيل لوحة التحكم:";
                    document.getElementById('passwordArea').style.display = 'block';
                }
                
                document.getElementById('adminPanel').style.opacity = '1';
            } else {
                // إذا سجلت خروجك، نذهب للرئيسية وليس لصفحة الدخول
                window.location.href = "index.html";
            }
        });

        // دعم الضغط على زر Enter لإرسال كلمة المرور
        document.getElementById('secretCode').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') activateMaster();
        });

        // دالة تفعيل وضع المستر بالكود السري
        window.activateMaster = function() {
            if (!currentUserUid) return alert("جاري الاتصال بالسيرفر.. انتظر لحظة");

            const code = document.getElementById('secretCode').value;
            if (!code) return;
            
            // الكود السري الثابت المطلوب للدخول
            const ADMIN_SECRET_CODE = "01234"; 
            
            if (code === ADMIN_SECRET_CODE) {
                update(ref(db, 'users/' + currentUserUid), {
                    role: 'admin'
                }).then(() => {
                    localStorage.setItem('biology_user_role', 'master');
                    location.reload();
                }).catch((error) => {
                    console.error("Error updating user role:", error);
                    alert("حدث خطأ أثناء تحديث صلاحياتك. يرجى المحاولة لاحقاً.");
                });
            } else {
                alert("Access Denied: كود غير صحيح");
            }
        }

        window.logout = function() {
            if (confirm("هل أنت متأكد من تسجيل الخروج؟")) {
                signOut(auth).then(() => {
                    localStorage.removeItem('isRegistered');
                    localStorage.removeItem('biology_user_role');
                    localStorage.removeItem('student_gender');
                    localStorage.removeItem('force_registration');
                    sessionStorage.removeItem('biology_user_role');
                    window.location.replace("index.html");
                }).catch(console.error);
            }
        }

        // دوال التحكم (Global Scope)
        window.toggleBan = function(uid, currentStatus) {
            const newStatus = !currentStatus;
            const action = newStatus ? "حظر" : "فك حظر";
            if(confirm(`هل أنت متأكد من ${action} هذا الطالب؟`)) {
                const updatesMap = {};
                updatesMap[`users/${uid}/banned`] = newStatus;
                updatesMap[`students_registry/${uid}/banned`] = newStatus;
                update(ref(db), updatesMap).catch(err => alert("خطأ في الحظر: " + err.message));
            }
        }

        window.deleteUser = function(uid) {
            if(confirm("تحذير: سيتم حذف بيانات الطالب نهائياً! هل أنت متأكد؟")) {
                const deleteMap = {};
                deleteMap[`users/${uid}`] = null;
                deleteMap[`students_registry/${uid}`] = null;
                update(ref(db), deleteMap)
                    .then(() => {
                        alert("تم حذف الطالب بنجاح");
                        localStorage.removeItem('admin_cache_grid');
                    })
                    .catch(err => alert("خطأ في الحذف: " + err.message));
            }
        }

        // --- Schedule Management Logic ---
        window.openScheduleEditor = async function() {
            document.getElementById('scheduleModal').style.display = 'block';
            const content = document.getElementById('scheduleEditorContent');
            
            const snapshot = await get(ref(db, 'schedule'));
            let data = snapshot.exists() ? snapshot.val() : {
                card1: { days: "الأحد والأربعاء", grade: "أولى ثانوي", groups: { g1: { name: "المجموعة الأولى (أ)", time: "02:00 PM", status: "متاح" }, g2: { name: "المجموعة الثانية (ب)", time: "03:30 PM", status: "متاح" }, g3: { name: "المجموعة الثالثة (ج)", time: "06:30 PM", status: "متاح" } } },
                card2: { days: "الاثنين والخميس", grade: "أولى ثانوي", groups: { g4: { name: "المجموعة الرابعة (د)", time: "02:00 PM", status: "متاح" }, g5: { name: "المجموعة الخامسة (هـ)", time: "03:30 PM", status: "متاح" }, g6: { name: "المجموعة السادسة (و)", time: "06:30 PM", status: "متاح" } } }
            };

            content.innerHTML = '';
            Object.keys(data).forEach(cardKey => {
                const card = data[cardKey];
                let groupsInputs = '';
                
                Object.keys(card.groups).forEach(gKey => {
                    const group = card.groups[gKey];
                    groupsInputs += `
                        <div class="group-edit-row">
                            <div style="position:relative;">
                                <i class="fa-solid fa-users" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); color:rgba(255,255,255,0.2); font-size:0.8rem;"></i>
                                <input type="text" class="sch-in" style="padding-right:30px;" data-card="${cardKey}" data-group="${gKey}" data-field="name" value="${group.name}" placeholder="اسم المجموعة">
                            </div>
                            <div style="position:relative;">
                                <i class="fa-solid fa-clock" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); color:rgba(255,255,255,0.2); font-size:0.8rem;"></i>
                                <input type="text" class="sch-in" style="padding-right:30px;" data-card="${cardKey}" data-group="${gKey}" data-field="time" value="${group.time}" placeholder="الوقت">
                            </div>
                            <div>
                                <select class="sch-in" data-card="${cardKey}" data-group="${gKey}" data-field="status">
                                    <option value="متاح" ${group.status === 'متاح' ? 'selected' : ''}>✅ متاح</option>
                                    <option value="مكتمل" ${group.status === 'مكتمل' ? 'selected' : ''}>❌ مكتمل</option>
                                </select>
                            </div>
                        </div>
                    `;
                });

                content.innerHTML += `
                    <div style="margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; background: rgba(255,255,255,0.01);">
                        <label style="display:block; margin-bottom:10px; font-size:0.8rem; color:#888;">أيام المجموعات:</label>
                        <input type="text" class="sch-days-in" data-card="${cardKey}" value="${card.days}" style="width:100%; background:#000; border:1px solid var(--admin-accent); color:var(--admin-accent); padding:12px; border-radius:10px; margin-bottom:20px; font-weight:bold; font-family:inherit;">
                        ${groupsInputs}
                    </div>
                `;
            });
        };

        window.saveScheduleChanges = async function() {
            const inputs = document.querySelectorAll('.sch-in');
            const snapshot = await get(ref(db, 'schedule'));
            let scheduleData = snapshot.val() || {};

            // تحديث نص الأيام أولاً
            document.querySelectorAll('.sch-days-in').forEach(dayIn => {
                const c = dayIn.dataset.card;
                if(!scheduleData[c]) scheduleData[c] = { groups: {} };
                scheduleData[c].days = dayIn.value;
            });

            inputs.forEach(input => {
                const card = input.getAttribute('data-card');
                const group = input.getAttribute('data-group');
                const field = input.getAttribute('data-field');
                
                if (!scheduleData[card]) {
                    let defaultDays = "السبت والثلاثاء";
                    if (card === 'card2') defaultDays = "الأحد والأربعاء";
                    if (card === 'card3') defaultDays = "الاثنين والخميس";
                    scheduleData[card] = { days: defaultDays, groups: {} };
                }

                if (!scheduleData[card].groups[group]) scheduleData[card].groups[group] = {};
                
                scheduleData[card].groups[group][field] = input.value;
            });

            await set(ref(db, 'schedule'), scheduleData);
            
            await push(ref(db, 'broadcasts'), {
                text: "📢 تنبيه: تم تحديث جدول المواعيد والمجموعات المتاحة. يرجى مراجعة صفحة الجدول الآن.",
                timestamp: serverTimestamp()
            });

            alert("تم حفظ التعديلات ونشر الخبر للطلاب بنجاح!");
            closeModal('scheduleModal');
        };

        window.closeModal = function(id) {
            document.getElementById(id).style.display = 'none';
        };

        function initDashboard() {
            console.log("إطلاق محرك جلب الطلاب...");
            // القراءة من سجل الطلاب المخصص لضمان السرعة والترتيب
            const studentsRef = ref(db, 'students_registry');
            onValue(studentsRef, (snapshot) => {
                const grid = document.getElementById('usersGridContainer');
                grid.innerHTML = '';
                let usersArray = [];
                let totalUsers = 0;
                let bannedUsers = 0;
                let fullGridHTML = ''; // بناء النص البرمجي بالكامل للسرعة

                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const user = childSnapshot.val();
                        // منع ظهور الطلاب "الأشباح" الذين ليس لديهم اسم أو بيانات مكتملة
                        if (!user || (!user.name && !user.username)) return;

                        const uid = childSnapshot.key;
                        const lastSeen = user.lastSeen || 0;
                        const now = Date.now();
                        const tenDaysInMs = 10 * 24 * 60 * 60 * 1000;

                        // --- منطق الحذف التلقائي للطلاب غير النشطين لمدة 10 أيام ---
                        if (lastSeen !== 0 && (now - lastSeen > tenDaysInMs)) {
                            console.log(`حذف تلقائي للطالب ${user.name} بسبب الغياب`);
                            remove(ref(db, 'users/' + uid));
                            remove(ref(db, 'students_registry/' + uid));
                            return; // تخطي إضافة هذا الطالب للواجهة
                        }

                        // ملاحظة للدكتور: إذا كنت تجرب بنفس حسابك ودخلت كود الأدمن، 
                        // فسيتم إخفاؤك من هنا لأن رتبتك أصبحت admin.
                        // جرب تسجل بطالب من متصفح خفي (Incognito) وستراه يظهر هنا فوراً.
                        if (user.role === 'admin') return; 

                        usersArray.push({ uid: uid, ...user });
                    });

                    // ترتيب الطلاب: الأحدث انضماماً يظهر أولاً
                    usersArray.sort((a, b) => new Date(b.joinedAt || 0) - new Date(a.joinedAt || 0));

                    usersArray.forEach((user) => {
                        const uid = user.uid;
                        if (!uid) return;
                        
                        const isBanned = user.banned === true;
                        if (isBanned) bannedUsers++;

                        const gradeMap = { '1': 'أولى ثانوي', '2': 'تانية ثانوي', '3': 'تالتة ثانوي' };
                        const gradeText = gradeMap[user.grade] || ''; // حذف "غير محدد"

                        totalUsers++;

                        fullGridHTML += `
                            <div class="admin-user-card ${isBanned ? 'banned' : ''}" data-name="${(user.name || user.username || '').toLowerCase()}" data-phone="${user.phone || ''}">
                                <div class="user-main-info">
                                    <img src="${user.photoURL || '212.png'}" class="avatar" alt="صورة الطالب" onerror="this.src='212.png'" onclick="window.openLightbox(this.src)">
                                    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;">
                                        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
                                            <h3 style="font-size: 0.95rem; margin: 0;">${user.name || user.username || 'طالب جديد'}</h3>
                                            ${gradeText ? `<span class="user-grade-badge" style="position: static; font-size: 0.6rem;">${gradeText}</span>` : ''}
                                        </div>
                                        <p style="font-size: 0.8rem; opacity: 0.7;">${user.email || 'لا يوجد بريد'}</p>
                                    </div>
                                </div>
                                <div class="user-details">
                                    <span><i class="fa-solid fa-phone"></i> <a href="tel:${user.phone}" style="color:var(--admin-accent); text-decoration:none;">${user.phone || 'غير مسجل'}</a></span>
                                    <span><i class="fa-solid fa-calendar-plus"></i> <strong>انضم ${timeAgo(user.joinedAt)}</strong></span>
                                    <span class="last-seen-label"><i class="fa-solid fa-eye"></i> تواجد: ${timeAgo(user.lastSeen)}</span>
                                </div>
                                <div class="card-actions">
                                    <button onclick="toggleBan('${uid}', ${isBanned})" class="btn-action ${isBanned ? 'unban' : 'ban'}"><i class="fa-solid ${isBanned ? 'fa-unlock' : 'fa-ban'}"></i> ${isBanned ? 'فك الحظر' : 'حظر'}</button>
                                    <button onclick="deleteUser('${uid}')" class="btn-action delete"><i class="fa-solid fa-trash-can"></i> حذف</button>
                                </div>
                            </div>
                        `;
                    });
                }

                grid.innerHTML = fullGridHTML; // تحديث الواجهة مرة واحدة فقط

                // Update stat cards
                document.getElementById('totalUsersStat').innerText = totalUsers;
                document.getElementById('bannedUsersStat').innerText = bannedUsers;

                // لا تحفظ الكاش إذا كانت القائمة فارغة لضمان المحاولة مرة أخرى من السيرفر
                if (totalUsers > 0) {
                    localStorage.setItem('admin_cache_total', totalUsers);
                    localStorage.setItem('admin_cache_banned', bannedUsers);
                    localStorage.setItem('admin_cache_grid', grid.innerHTML);
                    localStorage.setItem('admin_last_sync', Date.now());
                }

                // لا تشغل الفلتر إلا إذا كان هناك نص مكتوب فعلاً لتجنب إخفاء الطلاب الجدد
                if(document.getElementById('searchInput').value.trim() !== "") {
                    filterUsers();
                }

                if(totalUsers === 0) {
                    grid.innerHTML = '<p style="color:var(--admin-text-secondary); text-align:center; grid-column: 1 / -1;">لا يوجد طلاب مسجلين حتى الآن.</p>';
                }
            });
        }

        // دالة البحث
        window.filterUsers = function() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.admin-user-card');
            
            cards.forEach(card => {
                const name = (card.getAttribute('data-name') || '').toLowerCase();
                const phone = (card.getAttribute('data-phone') || '').toLowerCase();
                
                if (name.includes(input) || phone.includes(input)) {
                    card.style.display = "flex"; // تصحيح لضمان ظهور الكارت بشكل سليم
                } else {
                    card.style.display = "none";
                }
            });
        }

        // Lightbox Functions
        window.openLightbox = function(src) {
            const container = document.getElementById('lightbox-content');
            const overlay = document.getElementById('lightbox-overlay');
            container.innerHTML = `<img src="${src}" style="max-width:100%; max-height:90vh; border-radius:10px;">`;
            overlay.classList.add('active');
        };

        window.closeLightbox = function() {
            document.getElementById('lightbox-overlay').classList.remove('active');
            setTimeout(() => document.getElementById('lightbox-content').innerHTML = '', 400);
        };

        document.querySelector('.close-lightbox').onclick = window.closeLightbox;
        document.getElementById('lightbox-overlay').onclick = (e) => {
            if(e.target.id === 'lightbox-overlay') window.closeLightbox();
        };
    </script>

</body>
</html>
