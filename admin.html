<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الطلاب - الدكتور</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Gatekeeper Overlay -->
    <div id="loadingOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#020204; z-index:9999; display:flex; align-items:center; justify-content:center; flex-direction:column;">
        <i id="lockIcon" class="fa-solid fa-shield-halved" style="font-size:4rem; color:var(--neon-green); margin-bottom:20px; animation:heartBeat 1.5s infinite;"></i>
        <h3 id="lockText" style="color:#fff; margin-bottom: 20px;">جاري التحقق من الصلاحيات...</h3>
        <input type="password" id="secretCode" placeholder="كود التفعيل السري" style="display:none; padding:10px 20px; border-radius:30px; border:1px solid #333; background:#111; color:#fff; text-align:center; width:250px; outline:none;">
        <button id="secretBtn" onclick="activateMaster()" style="display:none; margin-top:15px; padding:10px 30px; background:var(--neon-red); color:#fff; border:none; border-radius:30px; cursor:pointer; font-weight:bold;">تفعيل وضع المستر</button>
    </div>

    <!-- Navbar (Standard) -->
    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-heart-pulse"></i>
            <div class="logo-text"><span>الدكتور</span><small>ADMIN PANEL</small></div>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="contact.html">الشات</a></li>
            <li><a href="lab.html">المعرض</a></li>
            <li><a href="admin.html" class="active">لوحة التحكم</a></li>
            <li><a href="#" onclick="logout()">خروج</a></li>
        </ul>
        <div style="display:flex; align-items:center; gap:5px;">
            <button id="themeToggle" class="theme-toggle" title="تبديل الوضع"><i class="fa-solid fa-moon"></i></button>
            <div class="menu-btn"><i class="fa-solid fa-bars"></i></div>
        </div>
    </nav>

    <!-- Lightbox -->
    <div id="lightbox-overlay" class="lightbox-overlay">
        <span class="close-lightbox">&times;</span>
        <div class="lightbox-content" id="lightbox-content"></div>
    </div>

    <div class="container" id="adminPanel" style="opacity:0; transition:1s; padding-top: 50px;">
        
        <div class="page-header">
            <p class="subtitle">STUDENTS MANAGEMENT</p>
            <h2 class="main-title">الطلاب <span style="color:var(--neon-green)">المسجلين</span></h2>
            <p style="color:#888">إجمالي الطلاب: <span id="userCount" style="color:var(--neon-green); font-weight:bold;">0</span></p>
        </div>

        <div class="admin-controls" style="display: flex; justify-content: center; margin-bottom: 40px;">
            <div class="search-box" style="width: 100%; max-width: 500px;">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" placeholder="بحث عن طالب (الاسم أو الرقم)..." onkeyup="filterUsers()">
            </div>
        </div>

        <!-- User Cards Grid -->
        <div class="admin-users-grid" id="usersGridContainer">
            <p style="color:#888; text-align:center;">جاري تحميل بيانات الطلاب...</p>
        </div>
    </div>

    <script src="main.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getDatabase, ref, onValue, get, update, remove } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyD092yeOowtCLW0fDcIzaEXrnxvrN4X5T8", authDomain: "abqarieno.firebaseapp.com", databaseURL: "https://abqarieno-default-rtdb.firebaseio.com", projectId: "abqarieno", storageBucket: "abqarieno.firebasestorage.app", messagingSenderId: "790682500839", appId: "1:790682500839:web:cd50b8e01729f821e06c42" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        let currentUserUid = null;

        // --- Admin Logic ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserUid = user.uid;
                // التحقق من الصلاحية من قاعدة البيانات
                const snapshot = await get(ref(db, 'users/' + user.uid));
                const userData = snapshot.val();
                
                if (userData && userData.role === 'admin') {
                    // المستخدم أدمن بالفعل -> افتح اللوحة
                    document.getElementById('loadingOverlay').style.display = 'none';
                    document.getElementById('adminPanel').style.opacity = '1';
                    initDashboard();
                } else {
                    // المستخدم ليس أدمن -> اطلب الكود السري
                    document.getElementById('lockIcon').className = "fa-solid fa-lock";
                    document.getElementById('lockIcon').style.color = "var(--neon-red)";
                    document.getElementById('lockIcon').style.animation = "none";
                    document.getElementById('lockText').innerText = "أدخل كود المستر للوصول";
                    document.getElementById('secretCode').style.display = "block";
                    document.getElementById('secretBtn').style.display = "block";
                }
            } else {
                window.location.href = "auth.html";
            }
        });

        // دالة تفعيل وضع المستر بالكود السري
        window.activateMaster = function() {
            const code = document.getElementById('secretCode').value;
            if (code === "2028") {
                // الترقية الفورية في قاعدة البيانات
                update(ref(db, 'users/' + currentUserUid), {
                    role: 'admin'
                }).then(() => {
                    alert("تم تفعيل وضع المستر بنجاح! أهلاً بك يا دكتور.");
                    location.reload(); // إعادة تحميل لتطبيق الصلاحيات الجديدة
                });
            } else {
                alert("الكود غير صحيح!");
            }
        }

        window.logout = function() {
            signOut(auth).then(() => window.location.href = "auth.html");
        }

        // دوال التحكم (Global Scope)
        window.toggleBan = function(uid, currentStatus) {
            const newStatus = !currentStatus;
            const action = newStatus ? "حظر" : "فك حظر";
            if(confirm(`هل أنت متأكد من ${action} هذا الطالب؟`)) {
                update(ref(db, 'users/' + uid), { banned: newStatus });
            }
        }

        window.deleteUser = function(uid) {
            if(confirm("تحذير: سيتم حذف بيانات الطالب نهائياً! هل أنت متأكد؟")) {
                remove(ref(db, 'users/' + uid));
            }
        }

        function initDashboard() {
            // جلب المستخدمين وعرضهم على شكل بطاقات
            onValue(ref(db, 'users'), (snapshot) => {
                const grid = document.getElementById('usersGridContainer');
                grid.innerHTML = '';
                let userCount = 0;
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const uid = childSnapshot.key;
                        const user = childSnapshot.val();
                        if(user.role === 'admin') return; // Don't show admin in the list
                        userCount++;

                        const genderIcon = user.gender === 'boy' 
                            ? '<i class="fa-solid fa-mars" style="color: #00d2ff;"></i>' 
                            : '<i class="fa-solid fa-venus" style="color: #ff69b4;"></i>';
                        
                        const isBanned = user.banned === true;

                        const cardHTML = `
                            <div class="admin-user-card ${isBanned ? 'banned' : ''}" data-name="${user.username}" data-phone="${user.phone}">
                                <img src="${user.photoURL || '212.png'}" class="avatar" alt="صورة الطالب" onclick="openLightbox('${user.photoURL || '212.png'}')">
                                <h3>${user.username || 'طالب جديد'}</h3>
                                <p><i class="fa-solid fa-phone"></i> ${user.phone || 'غير مسجل'}</p>
                                <p>${genderIcon} ${user.gender === 'boy' ? 'ولد' : 'بنت'}</p>
                                <div class="card-actions">
                                    <button onclick="toggleBan('${uid}', ${isBanned})" class="btn-action ${isBanned ? 'unban' : 'ban'}">${isBanned ? 'فك الحظر' : 'حظر'}</button>
                                    <button onclick="deleteUser('${uid}')" class="btn-action delete"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        `;
                        grid.innerHTML += cardHTML;
                    });
                }

                if(userCount === 0) {
                    grid.innerHTML = '<p style="color:#888; text-align:center;">لا يوجد طلاب مسجلين حتى الآن.</p>';
                }
                document.getElementById('userCount').innerText = userCount;
            });
        }

        // دالة البحث
        window.filterUsers = function() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.admin-user-card');
            
            cards.forEach(card => {
                const name = (card.getAttribute('data-name') || '').toLowerCase();
                const phone = (card.getAttribute('data-phone') || '').toLowerCase();
                
                if (name.includes(input) || phone.includes(input)) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        }

        // Lightbox Functions
        window.openLightbox = function(src) {
            const container = document.getElementById('lightbox-content');
            const overlay = document.getElementById('lightbox-overlay');
            container.innerHTML = `<img src="${src}" style="max-width:100%; max-height:90vh; border-radius:10px;">`;
            overlay.classList.add('active');
        };

        window.closeLightbox = function() {
            document.getElementById('lightbox-overlay').classList.remove('active');
            setTimeout(() => document.getElementById('lightbox-content').innerHTML = '', 400);
        };

        document.querySelector('.close-lightbox').onclick = window.closeLightbox;
        document.getElementById('lightbox-overlay').onclick = (e) => {
            if(e.target.id === 'lightbox-overlay') window.closeLightbox();
        };
    </script>
</body>
</html>
