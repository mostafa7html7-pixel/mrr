    <style>
        .container { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* تصميم الكارت الاحترافي */
        .model-card {
            background: rgba(20, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.15); /* حدود ذهبية خفيفة */
            border-radius: 24px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            backdrop-filter: blur(15px);
            aspect-ratio: 4 / 5; /* يحافظ على أبعاد الكارت ثابتة قبل تحميل المجسم */
            /* تحسين الأداء: عدم رسم العناصر خارج الشاشة */
            display: flex; flex-direction: column;
            content-visibility: auto;
            contain-intrinsic-size: 1px 500px;
        }

        .model-card:hover {
            transform: translateY(-10px);
            border-color: var(--gold-color);
            box-shadow: 0 20px 40px rgba(255, 0, 60, 0.15); /* توهج أحمر */
            will-change: transform; /* تفعيلها فقط عند التحويم لتوفير الذاكرة */
        }

        model-viewer {
            width: 100%;
            height: 100%;
            flex: 1; /* يشغل كل المساحة المتبقية في الكارت */
            min-height: 0; /* يمنع التمدد الزائد في متصفحات الموبايل */
            --poster-color: transparent;
            cursor: grab;
            display: block;
            margin: 0 auto;
            background-color: transparent;
            /* منع التمرير العشوائي */
            touch-action: pan-y;
        }

        /* تأثير التلاشي الناعم عند اختفاء الـ Poster */
        model-viewer::part(poster) {
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), transform 1s ease;
            opacity: 1;
        }

        /* عندما يتم تحميل الموديل بنجاح ويختفي البوستر */
        model-viewer[poster-dismissed]::part(poster) {
            opacity: 0;
            transform: scale(1.05); /* تكبير بسيط جداً يعطي إحساساً بالعمق أثناء التلاشي */
        }

        /* شريط تحميل داخلي (سلس وغير مزعج) */
        model-viewer::part(progress-bar) {
            background-color: var(--neon-green);
        }

        /* --- واجهة التشغيل الاحترافية --- */
        .model-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(5px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20; transition: 0.5s; pointer-events: auto;
        }
        .model-card.loaded .model-overlay { opacity: 0; pointer-events: none; }
        
        .btn-play-3d {
            background: var(--neon-green); color: #000;
            border: none; padding: 15px 30px; border-radius: 50px;
            font-weight: 900; font-size: 1rem; cursor: pointer;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.4);
            transition: 0.3s; transform: scale(1);
        }
        .btn-play-3d:hover { transform: scale(1.1); background: #fff; }
        .btn-play-3d i { font-size: 1.2rem; }

        /* شريط تحميل صغير */
        .load-bar {
            width: 150px; height: 4px; background: rgba(255,255,255,0.1);
            border-radius: 10px; margin-top: 15px; overflow: hidden; display: none;
        }
        .load-progress { width: 0%; height: 100%; background: var(--neon-green); transition: 0.3s; }

        /* تفاصيل الموديل الأسفل */
        .info-panel {
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(128, 128, 128, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .model-name {
            color: var(--text-color);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .ar-button {
            background: transparent;
            color: var(--gold-color);
            border: 1px solid var(--gold-color);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            -webkit-tap-highlight-color: transparent;
        }

        .ar-button:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-color);
        }

        /* زر ملء الشاشة */
        .fullscreen-btn {
            position: absolute;
            top: 15px;
            left: 15px; /* وضعناه يساراً ليتناسب مع العربية */
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--gold-color);
            border-radius: 50%;
            color: var(--gold-color);
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            -webkit-tap-highlight-color: transparent;
        }

        .fullscreen-btn:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
            transform: scale(1.1);
            box-shadow: 0 0 20px var(--accent-color);
        }

        .fullscreen-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* لمسة جمالية للخلفية */
        .bg-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: var(--accent-color);
            filter: blur(150px);
            opacity: 0.05;
            z-index: -1;
            border-radius: 50%;
        }

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- تفعيل أزرار الواقع المعزز (AR) ---
            document.querySelectorAll('.ar-button').forEach(button => {
                button.addEventListener('click', () => {
                    const modelViewer = button.closest('.model-card').querySelector('model-viewer');
                    if (modelViewer) {
                        modelViewer.activateAR();
                    }
                });
            });

            // --- تفعيل زر ملء الشاشة ---
            document.querySelectorAll('.fullscreen-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const modelViewer = btn.closest('.model-card').querySelector('model-viewer');
                    if (modelViewer.requestFullscreen) {
                        modelViewer.requestFullscreen();
                    } else if (modelViewer.webkitRequestFullscreen) { /* Safari support */
                        modelViewer.webkitRequestFullscreen();
                    }
                });
            });
        });
    </script>
