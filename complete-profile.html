<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل بياناتك - منصة الدكتور</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-gold: #ffd700;
            --neon-red: #ff003c;
            --glass-bg: rgba(10, 10, 15, 0.75);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shine: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
            --car-reflection: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.15) 45%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.15) 55%, transparent 70%);
            --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        body {
            margin: 0;
            padding: 0; 
            min-height: 100vh; 
            width: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Flying Colors Background */
        .flying-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            transition: transform 0.2s ease-out, background 1s ease-in-out; /* إضافة انتقال للألوان */
            will-change: transform; /* Performance optimization */
            z-index: 0;
        }
        .orb-1 { width: 300px; height: 300px; background: var(--neon-green); top: 10%; left: 20%; }
        .orb-2 { width: 250px; height: 250px; background: var(--neon-red); bottom: 10%; right: 20%; }
        .orb-3 { width: 200px; height: 200px; background: var(--neon-gold); top: 40%; left: 60%; }

        /* 1:1 Container */
        .profile-card {
            position: relative;
            width: calc(100% - 40px); /* يضمن وجود مساحة على الأطراف في الموبايل */
            max-width: 420px;
            min-height: 460px; /* زيادة بسيطة لراحة المحتوى */
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            box-shadow: var(--card-shadow), inset 0 0 20px rgba(255,255,255,0.05);
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 40px 25px;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Car Glass Light Sweep Animation */
        .profile-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 300%;
            height: 100%;
            background: var(--car-reflection);
            transition: 0s;
            pointer-events: none;
            animation: lightSweep 6s infinite ease-in-out;
            z-index: 1;
        }

        @keyframes lightSweep {
            0% { left: -150%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        .step-card {
            position: absolute;
            top: 50%; left: 50%; width: 100%; height: auto;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px;
            text-align: center;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0; pointer-events: none; transform: translate(-50%, -40%) scale(0.9);
            z-index: 5;
        }
        .step-card.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }

        h2 { color: #fff; margin: 0 0 10px; font-size: 1.5rem; font-weight: 900; }
        p { color: #aaa; font-size: 0.9rem; margin-bottom: 20px; }

        /* Avatar Step */
        .avatar-upload {
            width: 150px; height: 150px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; overflow: hidden; position: relative;
            transition: 0.3s;
            background: rgba(255,255,255,0.03);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 0 4px rgba(0, 255, 65, 0.1);
        }
        .avatar-upload:hover {
            border-color: var(--neon-green);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4), 0 0 25px rgba(0, 255, 65, 0.3);
        }
        .avatar-upload img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-upload i { font-size: 2.5rem; color: var(--neon-green); }

        /* Input Steps */
        .input-wrapper { width: 100%; position: relative; margin-bottom: 15px; }
        .input-wrapper i { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--neon-green); font-size: 1.1rem; z-index: 3; }
        .custom-input {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 16px 55px 16px 16px;
            border-radius: 15px;
            width: 100%;
            font-size: 16px; /* يمنع التكبير التلقائي في آيفون */
            text-align: right;
            outline: none;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        .custom-input:focus {
            border-color: rgba(0, 255, 65, 0.5);
            background: rgba(0,0,0,0.6);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1), inset 0 0 10px rgba(0, 255, 65, 0.05);
        }

        /* Buttons */
        .btn-action {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
        }
        .btn-next {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 10px 30px -10px rgba(0, 255, 65, 0.6);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-next:hover { transform: translateY(-3px); background: #fff; box-shadow: 0 20px 40px -10px rgba(0, 255, 65, 0.5); }
        .btn-next:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; }

        .step-indicator {
            position: absolute; bottom: 20px; width: 100%; text-align: center; color: rgba(255,255,255,0.3); font-size: 0.8rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px;
        }

        /* تحسينات الموبايل الصغير جداً */
        @media (max-height: 600px) {
            .profile-card { transform: scale(0.85); margin-top: -20px; }
            .step-indicator { bottom: 10px; }
            h2 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- Background Animation -->
    <div class="flying-orb orb-1"></div>
    <div class="flying-orb orb-2"></div>
    <div class="flying-orb orb-3"></div>

    <div class="profile-card">
        <form id="completeProfileForm" style="flex: 1; position: relative;">
            <!-- البطاقة الأولى: الصورة (تم نقلها للأول كما كانت) -->
            <div class="step-card active" id="card1">
                <h2>صورتك الشخصية</h2>
                <p>ارفع صورتك عشان تظهر في لوحة الشرف</p>
                <label for="avatarInput" class="avatar-upload" id="avatarPreview">
                    <i class="fa-solid fa-camera"></i>
                </label>
                <input type="file" id="avatarInput" accept="image/*" hidden required>
                <button type="button" class="btn-action btn-next" style="margin-top: 20px;" onclick="goToStep(2)">التالي <i class="fa-solid fa-arrow-left"></i></button>
            </div>

            <!-- البطاقة الأولى: البيانات -->
            <div class="step-card" id="card2">
                <h2>البيانات الأساسية</h2>
                <p>أدخل اسمك ورقمك لإنهاء التسجيل</p>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="nameInput" class="custom-input" placeholder="الاسم الثلاثي" required>
                </div>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="phoneInput" class="custom-input" placeholder="رقم الموبايل" required>
                </div>
                <div style="display: flex; gap: 10px; width: 100%;">
                    <button type="button" class="btn-action" style="background: #222; color: #fff; flex: 1;" onclick="goToStep(1)">رجوع</button>
                    <button type="submit" class="btn-action btn-next" id="submitBtn" style="flex: 2;">إنهاء <i class="fa-solid fa-check"></i></button>
                </div>
            </div>
        </form>

        <div class="step-indicator" id="stepIndicator">خطوة 1 من 2</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyD092yeOowtCLW0fDcIzaEXrnxvrN4X5T8", authDomain: "abqarieno.firebaseapp.com", databaseURL: "https://abqarieno-default-rtdb.firebaseio.com", projectId: "abqarieno", storageBucket: "abqarieno.firebasestorage.app", messagingSenderId: "790682500839", appId: "1:790682500839:web:cd50b8e01729f821e06c42" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // إعدادات ImgBB للرفع السريع جداً
        const IMGBB_API_KEY = "0385965848fc62374c1c82810ffa7d18";

        let currentUserUid = null;
        let selectedFile = null;

        // تغيير ألوان الخلفية ديناميكياً لزيادة الحماس
        const updateBackdropColors = (step) => {
            const orbs = [document.querySelector('.orb-1'), document.querySelector('.orb-2'), document.querySelector('.orb-3')];
            if (step === 2) {
                orbs[0].style.background = '#4285f4'; // Blue
                orbs[1].style.background = '#9b72f3'; // Purple
                orbs[2].style.background = '#34a853'; // Green
            }
        };

        window.goToStep = (step) => {
            if (step === 2 && !selectedFile) return alert("يا بطل، لازم تختار صورتك الأول عشان تظهر في لوحة الشرف!");
            document.querySelectorAll('.step-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`card${step}`).classList.add('active');
            document.getElementById('stepIndicator').innerText = `خطوة ${step} من 2`;
            updateBackdropColors(step);
        };

        // ضغط ذكي: موازنة بين السرعة والجودة للـ Admin
        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400; // حجم كافي ليكون واضح جداً في لوحة التحكم
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.7); // جودة عالية 70% للـ Admin
                    };
                };
            });
        }

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "index.html";
            else currentUserUid = user.uid;
        });

        document.getElementById('avatarInput').addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    document.getElementById('avatarPreview').innerHTML = `<img src="${event.target.result}" alt="preview" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                };
                reader.readAsDataURL(selectedFile);
            }
        });

        document.getElementById('completeProfileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> لحظة...';

            try {
                const name = document.getElementById('nameInput').value.trim();
                const phone = document.getElementById('phoneInput').value.trim();

                if (name.length < 5) throw new Error("اكتب اسمك الثلاثي بالكامل");
                if (phone.length < 11) throw new Error("رقم الهاتف غير صحيح");

                const compressedBlob = await compressImage(selectedFile);
                const formData = new FormData();
                formData.append('image', compressedBlob);

                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('فشل الرفع، تأكد من الإنترنت');
                const data = await response.json();
                const photoURL = data.data.url;

                await update(ref(db, 'users/' + currentUserUid), {
                    username: name,
                    phone: phone,
                    photoURL: photoURL,
                    role: 'student',
                    joinedAt: new Date().toISOString()
                });

                window.location.href = "index.html";
            } catch (error) {
                alert("حدث خطأ: " + error.message);
                btn.disabled = false;
                btn.innerHTML = 'إنهاء <i class="fa-solid fa-check"></i>';
            }
        });

        // --- Mouse-reactive background orbs ---
        document.body.addEventListener('mousemove', (e) => {
            // Use requestAnimationFrame for smooth, performant animations
            requestAnimationFrame(() => {
                const orbs = document.querySelectorAll('.flying-orb');
                // Calculate mouse position as a value from -1 to 1
                const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
                const mouseY = (e.clientY / window.innerHeight) * 2 - 1;

                orbs.forEach((orb, index) => {
                    // Apply different movement factors for a parallax effect
                    const moveFactor = (index + 1) * 15; // e.g., 15, 30, 45
                    const moveX = mouseX * moveFactor;
                    const moveY = mouseY * moveFactor;
                    
                    // Apply the transform. The CSS transition will smooth it out.
                    orb.style.transform = `translate(${moveX}px, ${moveY}px)`;
                });
            });
        });
    </script>

</body>
</html>
