<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الاختبارات - لوحة التحكم</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Reusing admin styles from style.css */ 
        :root {
            --admin-bg: #050508; /* خلفية الصفحة الأغمق */
            --admin-surface: #0f111a; /* خلفية الحاويات أفتح */
            --admin-surface-light: #1a1d27; /* أفتح درجة للتمييز */ 
            --admin-border: rgba(255, 255, 255, 0.1);
            --admin-text-primary: #f7fafc;
            --admin-text-secondary: #a0aec0; 
            --admin-accent: #00ff88;
            --admin-input-bg: #000000;
            --admin-card-bg: rgba(255, 255, 255, 0.03);
        } 
 
        body.light-mode {
            --admin-bg: #f8fafc;
            --admin-surface: #ffffff;
            --admin-surface-light: #edf2f7;
            --admin-border: #cbd5e0;
            --admin-text-primary: #333;
            --admin-text-secondary: #666;
            --admin-input-bg: #ffffff;
        }

        body.sepia-mode {
            --admin-bg: #f5e6d3;
            --admin-surface: #fffdf5;
            --admin-surface-light: #efe3d0;
            --admin-border: #dccfb6;
            --admin-text-primary: #433422;
            --admin-text-secondary: #7c6f5c;
            --neon-green: #2e8b57;
            --admin-input-bg: #fffdf5;
        }

        body { background-color: var(--admin-bg); color: var(--admin-text-primary); }
        .modal { 
            display: none; 
            z-index: 100001 !important; /* ضمان الظهور فوق الهيدر الرئيسي (10000) */
            align-items: center; 
            justify-content: center; 
        }
        .modal-content { animation: none; } /* Override from style.css */
        .quiz-admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .quiz-admin-card { background: var(--admin-surface); border: 1px solid var(--admin-border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; position: relative; overflow: hidden; }
        .quiz-admin-card.published { border-color: var(--neon-green); box-shadow: 0 0 15px rgba(0, 255, 65, 0.1); }
        .quiz-admin-card h3 { color: var(--neon-green, #00ff41); margin: 0; }
        .quiz-admin-card p { color: var(--admin-text-secondary); font-size: 0.9rem; margin: 0; }
        .quiz-actions { display: flex; gap: 10px; margin-top: auto; border-top: 1px solid var(--admin-border); padding-top: 15px; }
        .btn-add-quiz { background: var(--neon-green, #00ff41); color: #000; padding: 10px 20px; border-radius: 8px; font-weight: 900; cursor: pointer; border: none; transition: 0.3s; box-shadow: 0 0 15px rgba(0, 255, 65, 0.3); }
        .btn-add-quiz:hover { background: #fff; transform: scale(1.05); }
        
        /* Questions Modal Styles */
        #questionsList { padding: 10px; }
        .question-item {
            background: rgba(255, 255, 255, 0.02);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .question-item:hover { border-color: var(--neon-green); box-shadow: 0 5px 15px rgba(0, 255, 65, 0.05); }
        .question-item-actions { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        .question-item-text { color: #fff; font-weight: 700; margin: 0; line-height: 1.6; font-size: 0.95rem; word-wrap: break-word; overflow-wrap: break-word; word-break: break-word; }
        .question-item-img { max-width: 100%; max-height: 250px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); margin: 0 auto 10px; display: block; cursor: zoom-in; transition: 0.3s; object-fit: contain; }
        .question-item-img:hover { transform: scale(1.02); border-color: var(--neon-green); }
        
        .question-preview-options { display: grid; gap: 8px; }
        .q-preview-opt { 
            padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,0.02); 
            border: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; color: #aaa; text-align: right;
        }
        .q-preview-opt.correct { border-color: var(--neon-green); background: rgba(0, 255, 65, 0.05); color: var(--neon-green); font-weight: bold; }

        .option-input-group { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .option-input-group input[type="text"] { flex-grow: 1; background: var(--admin-surface); border: 1px solid var(--admin-border); color: var(--admin-text-primary); padding: 8px; border-radius: 5px; }
        .question-item .btn-delete {
            flex-shrink: 0;
            background: rgba(255, 51, 102, 0.1); color: #ff3366;
            border: 1px solid #ff3366; padding: 5px 10px; border-radius: 6px;
            cursor: pointer; font-size: 0.8rem; transition: 0.3s;
        }
        .question-item .btn-delete:hover { background: #ff3366; color: #fff; }
        .question-item .btn-edit {
            flex-shrink: 0;
            background: rgba(0, 255, 65, 0.1); color: var(--neon-green);
            border: 1px solid var(--neon-green); padding: 5px 10px; border-radius: 6px;
            cursor: pointer; font-size: 0.8rem; transition: 0.3s;
        }
        .question-item .btn-edit:hover { background: var(--neon-green); color: #000; }
        
        /* Drag & Drop Styles */
        .drag-handle {
            cursor: grab;
            color: var(--admin-text-secondary);
            padding: 5px;
            margin-left: 8px;
        }
        .drag-handle:hover { color: var(--neon-green); }
        .question-item.dragging {
            opacity: 0.5;
            border: 1px dashed var(--neon-green);
            background: rgba(0, 255, 65, 0.05);
        }

        /* Toggle Switch for Publish */
        .status-toggle {
            display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
            background: var(--admin-surface-light); 
            padding: 8px 12px; border-radius: 8px; width: fit-content; 
            border: 1px solid var(--admin-border);
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
        input:checked + .slider:before { transform: translateX(20px); }
        .status-label { font-size: 0.85rem; font-weight: bold; color: #888; }
        input:checked ~ .status-label { color: var(--neon-green); }

        /* Professional Question Form */
        .question-form-container {
            background: transparent;
            padding: 0;
            border: none;
        }
        .q-input-row { margin-bottom: 15px; }
        .q-input-row label { display: block; margin-bottom: 8px; color: var(--admin-text-secondary); font-size: 0.85rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .q-textarea { 
            width: 100%; background: var(--admin-input-bg); border: 2px solid var(--admin-border); color: var(--admin-text-primary); 
            padding: 20px; border-radius: 0 0 15px 15px; min-height: 150px; 
            outline: none; transition: 0.3s; overflow-y: auto; 
            white-space: pre-wrap; line-height: 1.8; font-size: 1.1rem;
            border-top: none;
        }
        .q-textarea:empty:before { 
            content: attr(placeholder);
            color: var(--admin-text-secondary);
            pointer-events: none;
            display: block;
        }
        .q-textarea:focus { border-color: var(--neon-green); box-shadow: 0 0 20px rgba(0, 255, 65, 0.1); background: var(--admin-input-bg); }
        
        .q-textarea-wrapper { position: relative; }
        .editor-toolbar {
            display: flex; align-items: center; gap: 8px;
            background: var(--admin-surface-light); padding: 6px 12px; 
            border-radius: 12px 12px 0 0; border: 1px solid var(--admin-border);
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .btn-toolbar {
            background: transparent; color: var(--admin-text-secondary); border: none;
            width: 32px; height: 32px; border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
            font-size: 0.9rem;
        }
        .btn-toolbar:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .btn-toolbar.active { color: var(--neon-green); background: rgba(0, 255, 136, 0.1); }
        
        /* نمط أزرار التنقل (Chrome Style) */
        .btn-nav-history {
            color: var(--admin-text-primary);
            font-size: 1.1rem;
        }
        .btn-nav-history:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-danger-toolbar {
            margin-right: auto;
            color: #ff4d4d;
        }
        .btn-danger-toolbar:hover { background: rgba(255, 77, 77, 0.1); color: #ff4d4d; }

        .toolbar-separator { width: 1px; height: 24px; background: rgba(255,255,255,0.1); margin: 0 10px; }

        .btn-clear-opt {
            background: transparent; border: none; color: #555;
            padding: 0 15px; cursor: pointer; font-size: 1rem;
            transition: 0.2s; display: flex; align-items: center;
        }
        .btn-clear-opt:hover { color: #ff3366; }

        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .option-box { 
            display: flex; align-items: stretch; 
            background: var(--admin-surface); border: 1px solid var(--admin-border); border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .option-box:focus-within, .option-box.selected { 
            border-color: var(--neon-green);  
            background: var(--admin-card-bg);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4), 0 0 15px rgba(0, 255, 65, 0.1);
        }
        
        .option-radio-wrapper {
            display: flex; align-items: center; justify-content: center;
            padding: 0 15px;
            background: rgba(255,255,255,0.02);
            border-left: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: 0.3s;
        }
        .option-box.selected .option-radio-wrapper {
            background: var(--neon-green);
            border-color: var(--neon-green);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .option-box input[type="radio"] { 
            accent-color: #000; 
            cursor: pointer; width: 20px; height: 20px; 
        }
        
        .option-box input[type="text"] { 
            flex: 1; background: transparent; border: none; 
            color: var(--admin-text-primary); padding: 15px; outline: none; font-size: 1rem; font-weight: 500;
        }

        .form-actions { 
            display: flex; gap: 10px; padding: 15px 20px; 
            background: var(--admin-surface); border-top: 1px solid var(--admin-border);
            position: sticky; bottom: 0; z-index: 10;
        }
        .btn-save-q { 
            flex: 2; background: linear-gradient(135deg, var(--neon-green), #00d2ff); 
            color: #000; border: none; padding: 12px; border-radius: 8px; 
            font-weight: 900; cursor: pointer; transition: 0.3s; 
            box-shadow: 0 8px 20px rgba(0, 255, 65, 0.2);
        }
        .btn-save-q:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 255, 65, 0.4); }
        .btn-cancel-q { flex: 1; background: #333; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; display: none; }
        .btn-cancel-q:hover { background: #555; }

        /* تحسين زر الإغلاق ليكون احترافياً وسريع الاستجابة على الموبايل */
        .close-manage-q {
            width: 44px; /* حجم قياسي لسهولة اللمس */
            height: 44px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1.3rem;
            flex-shrink: 0;
        }
        .close-manage-q:hover {
            background: rgba(255, 0, 60, 0.15);
            color: #ff3366;
            border-color: #ff3366;
            transform: rotate(90deg);
        }
        .close-manage-q:active { transform: scale(0.9) rotate(90deg); }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }
        
        /* New Split Layout Styles */
        .manage-q-modal {
            max-width: 1100px !important;
            width: 95%;
            height: 85vh;
            padding: 0 !important;
            background: var(--admin-bg) !important;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .manage-q-header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--admin-surface);
        }
        .manage-q-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .q-list-panel {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            border-left: 2px solid var(--admin-border);
            background: var(--admin-bg); /* تمييز القائمة بخلفية أغمق */
        }
        /* Custom Scrollbar for List */
        .q-list-panel::-webkit-scrollbar { width: 4px; }
        .q-list-panel::-webkit-scrollbar-thumb { background: var(--admin-accent); border-radius: 10px; }
        .q-list-panel::-webkit-scrollbar-thumb:hover { background: var(--neon-green); }

        .q-form-panel {
            width: 400px;
            padding: 0;
        }
        .q-form-panel {
            width: 400px;
            padding: 0;
            display: flex; flex-direction: column;
            background: var(--admin-surface); /* تمييز منطقة الإضافة بخلفية أفتح */
            border-right: 1px solid rgba(255,255,255,0.05);
        }
        #questionFormTitle {
            font-size: 0.75rem;
            color: var(--admin-text-secondary);
            opacity: 0.5;
            margin-bottom: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .admin-container {
            display: block;
            min-height: 100vh;
        }
        
        .admin-content {
            margin-right: 0;
            padding: 40px 5%;
        }

        @media (max-width: 768px) {
            .admin-content { padding: 15px; }
            .panel-header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .manage-q-modal { 
                height: 100% !important; 
                max-height: 100% !important; 
                width: 100% !important; 
                border-radius: 0 !important; 
                margin: 0 !important; /* إلغاء الهوامش لملء الشاشة */
            }
            .manage-q-body { 
                flex-direction: column; 
                overflow-y: auto; /* Scroll the whole body */
            }
            .q-form-panel { 
                order: -1; /* Move form to top */
                width: 100%; 
                height: auto; 
                max-height: none; 
                border-bottom: 1px solid var(--admin-border); 
                flex-shrink: 0; 
                border-right: none; 
            }
            .q-list-panel { 
                flex: none; 
                height: auto; 
                overflow: visible;
            }
            .question-form-container {
                padding: 15px !important;
                overflow-y: visible !important; /* Disable internal scroll */
                flex: none !important;
            }
            .option-input-group {
                flex-direction: column;
                align-items: flex-start;
            }
            .option-input-group input[type="text"] { width: 100%; }
        }

        @media (max-width: 480px) {
            .question-item { flex-direction: column; gap: 15px; }
            .question-item > div { width: 100%; }
            .question-item .btn-edit, .question-item .btn-delete { flex: 1; text-align: center; justify-content: center; }
            .question-item > div:last-child { display: flex; width: 100%; gap: 5px; }
        }

        /* Image Preview Styles */
        .q-img-preview {
            max-width: 100%; max-height: 200px; border-radius: 8px; 
            border: 1px solid var(--admin-border); margin-top: 10px;
        }
        .img-preview-box {
            display: none;
            align-items: center;
            gap: 10px;
            background: var(--admin-surface-light);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--admin-border);
            margin-top: 10px;
        }
        .img-preview-box img { height: 60px; border-radius: 4px; object-fit: cover; }
        .btn-remove-img { color: #ff5555; background: none; border: none; cursor: pointer; font-size: 1.2rem; }
        
        /* --- Media Hub Professional Styles --- */
        .media-upload-zone {
            border: 2px dashed rgba(0, 255, 136, 0.2);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            margin-top: 10px;
            position: relative;
        }
        .media-upload-zone:hover {
            background: rgba(0, 255, 136, 0.05);
            border-color: var(--neon-green);
            transform: scale(1.01);
        }
        .media-upload-zone i { font-size: 2.5rem; color: var(--neon-green); margin-bottom: 12px; filter: drop-shadow(0 0 10px rgba(0, 255, 65, 0.2)); }
        .media-upload-zone p { font-size: 0.9rem; color: var(--admin-text-secondary); margin: 0; font-weight: bold; }

        .search-q-input {
            background: var(--admin-surface); border: 1px solid var(--admin-border); color: var(--admin-text-primary);
            padding: 5px 10px; border-radius: 15px; font-size: 0.8rem;
            width: 120px; outline: none; transition: 0.3s;
        }
        .search-q-input:focus { border-color: var(--neon-green); width: 150px; }

        /* --- Lightbox (عارض الصور الاحترافي) --- */
        .lightbox-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); z-index: 100000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lightbox-overlay.active { opacity: 1; visibility: visible; }
        .lightbox-content { position: relative; max-width: 95%; max-height: 90%; display: flex; justify-content: center; align-items: center; transform: scale(0.9); transition: 0.4s; }
        .lightbox-overlay.active .lightbox-content { transform: scale(1); }
        .lightbox-content img { max-width: 100%; max-height: 90vh; border-radius: 10px; box-shadow: 0 0 60px rgba(0, 255, 136, 0.2); }
        .close-lightbox { position: absolute; top: 30px; right: 30px; font-size: 3rem; color: #fff; cursor: pointer; transition: 0.3s; z-index: 100001; }
        .close-lightbox:hover { color: var(--neon-red); transform: rotate(90deg); }

        @media (max-width: 768px) {
            .question-item { padding: 15px !important; flex-direction: column !important; align-items: stretch !important; gap: 15px !important; }
            .question-item-text { font-size: 0.9rem !important; line-height: 1.6 !important; width: 100% !important; max-width: 100% !important; margin: 10px 0 !important; order: 2; }
            .question-item-img { width: 100% !important; max-width: 350px !important; max-height: 220px !important; margin: 0 auto 15px !important; order: 1; }
            .q-preview-opt { font-size: 0.8rem; padding: 8px 12px; }
            .question-preview-options { order: 3; }
            .q-textarea { font-size: 16px !important; } /* يمنع الـ Zoom التلقائي في الموبايل */
            .options-grid { grid-template-columns: 1fr !important; gap: 10px !important; }
        }

        /* --- تحسينات الهيدر الخاص بالأدمن (Admin Header Professionalism) --- */
        .navbar.admin-nav {
            border-bottom: 1px solid rgba(0, 255, 136, 0.15);
            background: rgba(15, 17, 21, 0.98);
            backdrop-filter: blur(15px);
            padding: 10px 5%;
        }
        .admin-nav .logo-text span {
            color: var(--admin-accent);
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
            font-family: 'Reem Kufi', sans-serif;
        }
        .admin-nav .nav-links a {
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.3s;
        }
        .admin-nav .nav-links a.logout-link {
            color: var(--neon-red) !important;
            border: 1px solid rgba(255, 0, 60, 0.3);
            padding: 6px 15px !important;
            border-radius: 10px;
            margin-right: 10px;
        }
        .admin-nav .nav-links a.logout-link:hover {
            background: rgba(255, 0, 60, 0.1);
            border-color: var(--neon-red);
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.3);
        }
    </style>
</head>
<body>
    <!-- Template لبطاقة السؤال (لتحسين الأداء والنظام) -->
    <template id="question-item-template">
        <div class="question-item" draggable="true">
            <div class="question-item-actions">
                <div style="display:flex; align-items:center;">
                    <span class="drag-handle"><i class="fa-solid fa-grip-vertical"></i></span>
                    <span class="q-index-badge"></span>
                </div>
                <div style="display:flex; gap:5px;">
                    <button class="btn-duplicate btn-edit" title="تكرار"><i class="fa-solid fa-copy"></i></button>
                    <button class="btn-edit-q btn-edit" title="تعديل"><i class="fa-solid fa-pen"></i></button>
                    <button class="btn-delete-q btn-delete"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            </div>
            <div class="question-item-content">
                <img class="question-item-img" src="" style="display:none;">
                <div class="question-item-text"></div>
                <div class="question-preview-options">

                <div class="q-input-row">

                            <button type="button" onclick="event.stopPropagation(); removeQuestionImage()" class="btn-remove-img" style="margin-top:10px; background:rgba(255,0,0,0.1); padding:5px 15px; border-radius:8px; font-size:0.8rem; display:flex; align-items:center; gap:5px;"><i class="fa-solid fa-trash-can"></i> حذف الصورة</button>

                        <button type="button" class="btn-toolbar btn-nav-history" onmousedown="event.preventDefault();" onclick="document.execCommand('redo')" title="إعادة (Ctrl+Y)"><i class="fa-solid fa-arrow-left"></i></button>

                        <button type="button" class="btn-toolbar" data-cmd="superscript" onmousedown="event.preventDefault();" onclick="formatDoc('superscript')" title="أعلى (X²)"><i class="fa-solid fa-superscript"></i></button>
                        <!-- زر الحذف الذكي -->
                        <button type="button" class="btn-toolbar btn-danger-toolbar" onmousedown="event.preventDefault();" onclick="smartClearContent()" title="مسح كل المحتوى"><i class="fa-solid fa-trash-can"></i></button>

    <script src="main.js"></script>
    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, push, remove, update, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
        import { firebaseConfig } from "./firebase-config.js"; // استيراد إعدادات Firebase

        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
        const db = getDatabase(app);
        const auth = getAuth(app);
        
        const IMGBB_API_KEY = "0385965848fc62374c1c82810ffa7d18"; // مفتاح الرفع الخاص بك

        // Auth Check (Security)
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Check if admin
                const snap = await get(ref(db, `users/${user.uid}`));
                if (snap.exists() && snap.val().role === 'admin') {
                } else {
                    alert("غير مصرح لك بالدخول!");
                    window.location.href = "index.html";
                }
            } else {
                window.location.href = "auth.html";
            }
        });

        window.logout = () => {
            if (confirm("هل أنت متأكد من تسجيل الخروج؟")) {
                signOut(auth).then(() => window.location.href = "auth.html");
            }
        };

        let currentEditingQuizId = null;
        let questionsData = {};
        let selectedQuestions = new Set();
        let lastQuestionText = ''; // Define lastQuestionText here

        window.openAddQuizModal = (quizId = null, quizData = {}) => {
            const modal = document.getElementById('addQuizModal');
            document.getElementById('quizIdInput').value = quizId;
            document.getElementById('modalTitle').innerText = quizId ? 'تعديل الاختبار' : 'إضافة اختبار جديد';
            document.getElementById('quizTitleInput').value = quizData.title || '';
            document.getElementById('quizTimeInput').value = quizData.timeLimit || '';
            document.getElementById('quizAttemptsInput').value = quizData.attemptsLimit || 1;
            modal.style.display = 'flex';
        };

        window.closeModal = (modalId) => { 
            document.getElementById(modalId).style.display = 'none';
            if (modalId === 'manageQuestionsModal') exitSelectionMode();
        };

        // --- Text Formatting ---
        window.formatDoc = (cmd, value = null) => {
            // التأكد من أن التنسيقات العلمية (أسفل/أعلى) لا تتداخل
            if (cmd === 'subscript') {
                if (document.queryCommandState('superscript')) {
                    document.execCommand('superscript', false, null);
                }
            } else if (cmd === 'superscript') {
                if (document.queryCommandState('subscript')) {
                    document.execCommand('subscript', false, null);
                }
            }

            // تنفيذ الأمر المطلوب
            document.execCommand(cmd, false, value);
            
            document.getElementById('questionTextInput').focus();
            updateToolbarState();
        };

        window.updateToolbarState = () => {
            const buttons = document.querySelectorAll('.btn-toolbar[data-cmd]');
            buttons.forEach(btn => {
                const cmd = btn.getAttribute('data-cmd');
                if (document.queryCommandState(cmd)) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        };

        // --- Smart Content Control ---
        window.smartClearContent = () => {
            const editor = document.getElementById('questionTextInput');
            editor.focus();
            // استخدام أوامر المتصفح للمسح لضمان عمل زر "التراجع" (Undo)
            document.execCommand('selectAll', false, null);
            document.execCommand('delete', false, null);
        };

        window.filterQuestions = (query) => {
            const items = document.querySelectorAll('.question-item');
            query = query.toLowerCase();
            items.forEach(item => {
                const text = item.querySelector('.question-item-text').innerText.toLowerCase();
                item.style.display = text.includes(query) ? 'flex' : 'none';
            });
        };

        // --- UI Helper for Options ---
        window.selectOption = (index) => {
            document.querySelectorAll('.option-box').forEach(box => box.classList.remove('selected'));
            const radios = document.getElementsByName('correctAnswer');
            if(radios[index]) {
                radios[index].checked = true;
                radios[index].closest('.option-box').classList.add('selected');
            }
        };

        // --- Image Handling Functions ---
        window.previewQuestionImage = (input) => {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('questionImagePreview').src = e.target.result;
                    document.getElementById('imagePreviewContainer').style.display = 'flex';
                    document.getElementById('uploadPrompt').style.display = 'none';
                }
                reader.readAsDataURL(input.files[0]);
            }
        };

        window.removeQuestionImage = () => {
            document.getElementById('questionImageInput').value = '';
            document.getElementById('questionImagePreview').src = '';
            document.getElementById('imagePreviewContainer').style.display = 'none';
            document.getElementById('uploadPrompt').style.display = 'block';
        };

        window.saveQuiz = () => {
            const quizId = document.getElementById('quizIdInput').value;
            const title = document.getElementById('quizTitleInput').value;
            const timeLimit = document.getElementById('quizTimeInput').value;
            const attemptsLimit = document.getElementById('quizAttemptsInput').value;
            
            if (!title.trim()) return alert('يرجى كتابة عنوان للاختبار أولاً.');
            if (!timeLimit || isNaN(timeLimit) || parseInt(timeLimit) <= 0) return alert('يرجى تحديد مدة زمنية صحيحة للاختبار (بالدقائق).');

            const updates = {};
            const path = `quizzes/${quizId || push(ref(db, 'quizzes')).key}`;
            updates[`${path}/title`] = title;
            updates[`${path}/timeLimit`] = parseInt(timeLimit);
            updates[`${path}/attemptsLimit`] = parseInt(attemptsLimit || 1);
            
            // تعيين قيم افتراضية للاختبار الجديد فقط
            if (!quizId) {
                updates[`${path}/createdAt`] = serverTimestamp();
                updates[`${path}/published`] = false;
            }

            update(ref(db), updates).then(() => {
                closeModal('addQuizModal');
                alert('تم حفظ الاختبار بنجاح!');
            }).catch(error => alert('حدث خطأ: ' + error.message));
        };

        window.deleteQuiz = (quizId) => {
            if (confirm('هل أنت متأكد من حذف هذا الاختبار وكل أسئلته؟')) {
                remove(ref(db, `quizzes/${quizId}`)).then(() => alert('تم حذف الاختبار.'));
            }
        };

        const quizzesList = document.getElementById('quizzesList');

        // --- Rocket Speed: تحميل الاختبارات من الكاش فوراً قبل الاتصال بالسيرفر ---
        const cachedAdminQuizzes = localStorage.getItem('admin_quizzes_cache');
        if (cachedAdminQuizzes) {
            quizzesList.innerHTML = cachedAdminQuizzes;
        }

        onValue(ref(db, 'quizzes'), (snapshot) => {
            if (snapshot.exists()) {
                let htmlContent = '';
                snapshot.forEach(child => {
                    const id = child.key;
                    const quiz = child.val();
                    const isPublished = quiz.published === true;
                    const qCount = quiz.questions ? Object.keys(quiz.questions).length : 0;
                    const quizDataStr = JSON.stringify(quiz).replace(/'/g, "&apos;");
                    
                    htmlContent += `
                        <div class="quiz-admin-card ${isPublished ? 'published' : ''}">
                            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                <div style="display:flex; flex-direction:column; gap:5px;">
                                    <h3>${quiz.title}</h3>
                                    <small style="color:var(--neon-gold); font-size:0.75rem;"><i class="fa-solid fa-rotate-right"></i> المحاولات: ${quiz.attemptsLimit || 1}</small>
                                </div>
                                <div class="status-toggle">
                                    <label class="switch"><input type="checkbox" ${isPublished ? 'checked' : ''} onchange="togglePublish('${id}', this.checked)"><span class="slider"></span></label>
                                    <span class="status-label">${isPublished ? 'منشور' : 'مسودة'}</span>
                                </div>
                            </div>
                            <div style="color: var(--admin-text-secondary, #888); font-size: 0.9rem;">
                                <span><i class="fa-solid fa-list-ol"></i> ${qCount} سؤال</span> | 
                                <span><i class="fa-regular fa-clock"></i> ${quiz.timeLimit} دقيقة</span>
                            </div>
                            <div class="quiz-actions">
                                <button class="btn-action btn-info" onclick='openManageQuestionsModal("${id}", "${quiz.title}")'>إدارة الأسئلة</button>
                                <button class="btn-action" onclick='openAddQuizModal("${id}", ${quizDataStr})'>تعديل</button>
                                <button class="btn-action btn-delete" onclick='deleteQuiz("${id}")'>حذف</button>
                            </div>
                        </div>`;
                });
                
                quizzesList.innerHTML = htmlContent;
                // تحديث الكاش للزيارة القادمة
                localStorage.setItem('admin_quizzes_cache', htmlContent);
            } else {
                quizzesList.innerHTML = '<p>لا توجد اختبارات. قم بإضافة واحد جديد.</p>';
                localStorage.removeItem('admin_quizzes_cache');
            }
        });

        window.togglePublish = (quizId, status) => {
            update(ref(db, `quizzes/${quizId}`), { published: status });
        };

        window.openManageQuestionsModal = (quizId, quizTitle) => {
            currentEditingQuizId = quizId;
            document.getElementById('questionsModalTitle').innerText = `أسئلة: ${quizTitle}`;
            onValue(ref(db, `quizzes/${quizId}/questions`), (snap) => {
                const qList = document.getElementById('questionsList');
                questionsData = {};
                qList.innerHTML = '';
                let count = 0;
                if (snap.exists()) {
                    const questionsArray = [];
                    snap.forEach(qSnap => {
                        questionsArray.push({ key: qSnap.key, ...qSnap.val() });
                    });

                    // Sort by order if exists
                    questionsArray.sort((a, b) => (a.order || 0) - (b.order || 0));

                    const template = document.getElementById('question-item-template');

                    questionsArray.forEach(q => {
                        questionsData[q.key] = q;
                        count++;
                        
                        const clone = template.content.cloneNode(true);
                        const item = clone.querySelector('.question-item');
                        
                        item.setAttribute('data-id', q.key);
                        if (selectedQuestions.has(q.key)) item.classList.add('selected');

                        clone.querySelector('.q-index-badge').innerText = `سؤال ${count}`;
                        clone.querySelector('.question-item-text').innerHTML = q.text;

                        // منطق الضغط المطول (WhatsApp Style)
                        let pressTimer;
                        item.onmousedown = item.ontouchstart = () => {
                            pressTimer = setTimeout(() => toggleSelection(q.key), 600);
                        };
                        item.onmouseup = item.ontouchend = item.onmouseleave = () => clearTimeout(pressTimer);

                        item.onclick = (e) => {
                            if (selectedQuestions.size > 0) {
                                toggleSelection(q.key);
                            } else {
                                if (!e.target.closest('button')) editQuestion(q.key);
                            }
                        };

                        if (q.imageURL) {
                            const img = clone.querySelector('.question-item-img');
                            img.src = q.imageURL;
                            img.style.display = 'block';
                            img.onclick = () => openLightbox(q.imageURL);
                        }

                        const optionsContainer = clone.querySelector('.question-preview-options');
                        q.options.forEach((opt, idx) => {
                            const isCorrect = idx === q.correctAnswer;
                            const optDiv = document.createElement('div');
                            optDiv.className = `q-preview-opt ${isCorrect ? 'correct' : ''}`;
                            optDiv.innerHTML = `${isCorrect ? '<i class="fa-solid fa-circle-check" style="margin-left:8px;"></i>' : ''}${opt}`;
                            optionsContainer.appendChild(optDiv);
                        });

                        // ربط الأزرار
                        clone.querySelector('.btn-duplicate').onclick = () => duplicateQuestion(q.key);
                        clone.querySelector('.btn-edit-q').onclick = () => editQuestion(q.key);
                        clone.querySelector('.btn-delete-q').onclick = () => deleteQuestion(q.key);

                        qList.appendChild(clone);
                    });
                    
                    setupDragAndDrop();
                } else {
                    qList.innerHTML = '<p>لا توجد أسئلة بعد.</p>';
                }
                document.getElementById('qCountDisplay').innerText = count;
            });
            document.getElementById('manageQuestionsModal').style.display = 'flex';
            resetQuestionForm();
        };

        window.editQuestion = (qId) => {
            const q = questionsData[qId];
            if (!q) return;
            document.getElementById('editingQuestionId').value = qId;
            document.getElementById('questionTextInput').innerHTML = q.text;
            
            if (q.imageURL) {
                document.getElementById('questionImagePreview').src = q.imageURL;
                document.getElementById('imagePreviewContainer').style.display = 'flex';
                document.getElementById('uploadPrompt').style.display = 'none';
            } else {
                document.getElementById('uploadPrompt').style.display = 'block';
                document.getElementById('imagePreviewContainer').style.display = 'none';
            }

            const optionInputs = document.querySelectorAll('.option-input');
            q.options.forEach((opt, index) => {
                if (optionInputs[index]) optionInputs[index].value = opt;
            });
            const radios = document.getElementsByName('correctAnswer');
            if (radios[q.correctAnswer]) radios[q.correctAnswer].checked = true;
            window.selectOption(q.correctAnswer); // Update UI

            document.getElementById('questionFormTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> تعديل السؤال الحالي';
            document.getElementById('saveQuestionBtn').innerHTML = '<i class="fa-solid fa-save"></i> حفظ التعديلات';
            document.getElementById('cancelEditBtn').style.display = 'block';
            
            document.querySelector('.question-form-container').scrollIntoView({ behavior: 'smooth' });
        };

        window.resetQuestionForm = () => {
            document.getElementById('editingQuestionId').value = '';
            document.getElementById('questionTextInput').innerHTML = '';
            
            window.removeQuestionImage();

            document.querySelectorAll('.option-input').forEach(i => i.value = '');
            document.querySelector('input[name="correctAnswer"][value="0"]').checked = true;
            window.selectOption(0); // Reset UI
            document.getElementById('questionFormTitle').innerHTML = '<i class="fa-solid fa-circle-plus"></i> إضافة سؤال جديد';
            document.getElementById('saveQuestionBtn').innerHTML = '<i class="fa-solid fa-plus"></i> إضافة السؤال';
            document.getElementById('cancelEditBtn').style.display = 'none';
        };

        window.saveQuestion = async () => {
            if (!currentEditingQuizId) return;
            
            const saveBtn = document.getElementById('saveQuestionBtn');
            const originalBtnText = saveBtn.innerHTML;
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...';

            const qId = document.getElementById('editingQuestionId').value;
            const text = document.getElementById('questionTextInput').innerHTML;
            const options = Array.from(document.querySelectorAll('.option-input')).map(i => i.value);
            const correctAnswer = document.querySelector('input[name="correctAnswer"]:checked').value;
            
            // Check if text is empty (handling empty HTML tags)
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = text;
            const plainText = tempDiv.textContent || tempDiv.innerText || "";
            const hasImagePreview = document.getElementById('imagePreviewContainer').style.display !== 'none';

            if (!plainText.trim() && !document.getElementById('questionImageInput').files[0] && !hasImagePreview) {
                alert('يرجى إضافة نص للسؤال أو صورة على الأقل.');
                saveBtn.disabled = false;
                saveBtn.innerHTML = originalBtnText;
                return;
            }
            
            if (options.some(o => !o)) {
                 alert('يرجى ملء جميع الاختيارات.');
                 saveBtn.disabled = false;
                 saveBtn.innerHTML = originalBtnText;
                 return;
            }

            let imageURL = null;

            // Keep existing image if editing and not removed
            if (qId && questionsData[qId] && questionsData[qId].imageURL && hasImagePreview) {
                imageURL = questionsData[qId].imageURL;
            }

            // Upload new image if selected
            const fileInput = document.getElementById('questionImageInput');
            if (fileInput.files[0]) {
                try {
                    const formData = new FormData();
                    formData.append('image', fileInput.files[0]);
                    
                    const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: 'POST',
                        body: formData
                    });
                    const resData = await response.json();
                    imageURL = resData.data.url;
                } catch (e) {
                    alert('حدث خطأ أثناء رفع الصورة لـ ImgBB.');
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = originalBtnText;
                    return;
                }
            } else if (!hasImagePreview) {
                imageURL = null;
            }

            const questionData = { text, options, correctAnswer: parseInt(correctAnswer), imageURL };
            const promise = qId 
                ? update(ref(db, `quizzes/${currentEditingQuizId}/questions/${qId}`), questionData)
                : push(ref(db, `quizzes/${currentEditingQuizId}/questions`), {
                    ...questionData,
                    order: Object.keys(questionsData).length // Add at the end
                });

            // --- تأثير المكافأة البصرية (Visual Reward) ---
            if (!qId) {
                const saveAudio = new Audio('https://www.soundjay.com/buttons/sounds/button-37a.mp3');
                saveAudio.volume = 0.2;
                saveAudio.play().catch(() => {});
            }
            // ------------------------------------------

            promise.then(() => {
                resetQuestionForm();
                saveBtn.disabled = false;
                saveBtn.innerHTML = originalBtnText;
                
                // Scroll list to bottom if adding new question
                if (!qId) {
                    setTimeout(() => {
                        const panel = document.querySelector('.q-list-panel');
                        if(panel) panel.scrollTop = panel.scrollHeight;
                    }, 300);
                }
            }).catch(err => {
                alert("حدث خطأ: " + err.message);
                saveBtn.disabled = false;
                saveBtn.innerHTML = originalBtnText;
            });
        };

        window.duplicateQuestion = (qId) => {
            const q = questionsData[qId];
            if (!q) return;
            const newQ = { ...q };
            delete newQ.key; // Remove key to push as new
            newQ.order = Object.keys(questionsData).length;
            
            push(ref(db, `quizzes/${currentEditingQuizId}/questions`), newQ);
        };

        window.deleteQuestion = async (qId) => {
            if (confirm('هل أنت متأكد من حذف هذا السؤال؟')) {
                const q = questionsData[qId];
                remove(ref(db, `quizzes/${currentEditingQuizId}/questions/${qId}`));
            }
        };

        // --- Drag and Drop Logic ---
        function setupDragAndDrop() {
            const draggables = document.querySelectorAll('.question-item');
            const container = document.getElementById('questionsList');

            draggables.forEach(draggable => {
                draggable.addEventListener('dragstart', () => {
                    draggable.classList.add('dragging');
                });

                draggable.addEventListener('dragend', () => {
                    draggable.classList.remove('dragging');
                    saveNewOrder();
                });
            });

            container.addEventListener('dragover', e => {
                e.preventDefault();
                const afterElement = getDragAfterElement(container, e.clientY);
                const draggable = document.querySelector('.dragging');
                if (afterElement == null) {
                    container.appendChild(draggable);
                } else {
                    container.insertBefore(draggable, afterElement);
                }
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.question-item:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
                else return closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function saveNewOrder() {
            if (!currentEditingQuizId) return;
            const items = document.querySelectorAll('.question-item');
            const updates = {};
            items.forEach((item, index) => {
                const qId = item.getAttribute('data-id');
                updates[`quizzes/${currentEditingQuizId}/questions/${qId}/order`] = index;
            });
            update(ref(db), updates);
        }

        // الدوال المتعلقة بالتحديد الجماعي والحذف (تم نقلها للنطاق العام)
        window.toggleSelection = (id) => {
            if (selectedQuestions.has(id)) {
                selectedQuestions.delete(id);
            } else {
                selectedQuestions.add(id);
                if (navigator.vibrate) navigator.vibrate(50);
            }
            updateBulkUI();
        };

        window.updateBulkUI = () => {
            const bar = document.getElementById('bulkActionBar');
            const countLabel = document.getElementById('selectedCount');
            const title = document.getElementById('questionsModalTitle');

            if (selectedQuestions.size > 0) {
                bar.style.display = 'flex';
                title.style.display = 'none';
                countLabel.innerText = `${selectedQuestions.size} سؤال مختار`;
            } else {
                bar.style.display = 'none';
                title.style.display = 'block';
            }
            
            document.querySelectorAll('.question-item').forEach(item => {
                if (selectedQuestions.has(item.getAttribute('data-id'))) item.classList.add('selected');
                else item.classList.remove('selected');
            });
        };

        window.bulkDelete = async () => {
            if (selectedQuestions.size === 0) return;
            if (confirm(`هل أنت متأكد من حذف ${selectedQuestions.size} أسئلة نهائياً؟`)) {
                const updates = {};
                selectedQuestions.forEach(qId => { updates[`quizzes/${currentEditingQuizId}/questions/${qId}`] = null; });
                await update(ref(db), updates);
                exitSelectionMode();
            }
        };

        window.exitSelectionMode = () => {
            selectedQuestions.clear();
            updateBulkUI();
        };

        // --- دوال عارض الصور (Lightbox) ---
        window.openLightbox = function(src) {
            const container = document.getElementById('lightbox-content');
            const overlay = document.getElementById('lightbox-overlay');
            container.innerHTML = `<img src="${src}" style="max-width:100%; max-height:90vh; border-radius:10px; box-shadow: 0 0 30px rgba(0,255,65,0.2);">`;
            overlay.classList.add('active');
        };

        window.closeLightbox = function() {
            document.getElementById('lightbox-overlay').classList.remove('active');
            setTimeout(() => { document.getElementById('lightbox-content').innerHTML = ''; }, 400);
        };

        // إصلاح خطأ document.querySelector(...) is null
        const closeBtn = document.querySelector('.close-lightbox');
        if(closeBtn) closeBtn.onclick = window.closeLightbox;
        
        document.getElementById('lightbox-overlay').onclick = (e) => {
            if(e.target.id === 'lightbox-overlay') window.closeLightbox();
        };

        // تم حذف دالة الطباعة printQuiz بناءً على طلبك.
        // إذا أردت استعادتها أو استبدالها بوظيفة أخرى، يرجى إبلاغي.

    </script>
</body>
