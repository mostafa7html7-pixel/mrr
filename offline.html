<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لا يوجد اتصال - الدكتور</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; background: #020202; color: #fff;">
    <div style="position: relative; display: inline-block; margin-bottom: 20px;">
        <i class="fa-solid fa-wifi" style="font-size: 4rem; color: #333;"></i>
        <i class="fa-solid fa-slash" style="position: absolute; font-size: 4rem; color: var(--neon-red); left: 0; top: 0; opacity: 0.8;"></i>
    </div>
    <h1 style="font-size: 2rem; margin-bottom: 10px; color: var(--text-white);">أنت غير متصل بالإنترنت</h1>
    <p style="color: #888; margin-bottom: 30px; max-width: 300px; line-height: 1.6;">يبدو أنك فقدت الاتصال بالشبكة. يرجى التحقق من اتصالك والمحاولة مرة أخرى للوصول إلى المحتوى.</p>
    <button onclick="window.location.reload()" class="btn-green" style="cursor: pointer; border: none; padding: 12px 30px;">إعادة المحاولة <i class="fa-solid fa-rotate-right"></i></button>
</body>
</html>
