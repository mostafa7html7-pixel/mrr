    <style> 
        :root { 
            --master-neon: #00f2ff;
            --dark-surface: #070a0f; 
            --glass-bg: rgba(15, 22, 36, 0.9);
            --message-bg: rgba(255, 255, 255, 0.03);
            --accent-glow: rgba(0, 242, 255, 0.2);
            --audio-neon: #a29bfe; /* بنفسجي نيون هادئ للتسجيلات */
            --img-border: #00f2ff; /* أزرق سماوي نيون حاد للصور */
            --video-neon: #ff6600; /* برتقالي نيون قوي للفيديوهات */
        }

        body {
            background: radial-gradient(circle at center, #101a2d 0%, #070a0f 100%);
            background-attachment: fixed;
            color: #e0e6ed;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Light Mode Overrides */
        body.light-mode {
            background: #f0f2f5;
            color: #333;
        }
        body.light-mode .chat-container {
            background: #fff;
            border-color: #ddd;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        body.light-mode .msg-block {
            background: #f8f9fa;
            color: #333;
            border-right: 4px solid var(--master-neon);
        }
        body.light-mode .msg-content { color: #333; }
        body.light-mode .master-input { background: #fff; color: #333; border: 1px solid #ddd; }
        body.light-mode #master-panel { background: rgba(0, 242, 255, 0.1); }
        body.light-mode footer { background: #e9ecef; border-top: 1px solid #ddd; color: #333; }
        body.light-mode .f-card { background: #fff; color: #333; border-color: #ddd; }

        /* --- واجهة الشات المصغرة والأنيقة --- */
        .chat-wrapper { max-width: 1000px; margin: 20px auto; padding: 0 15px; }

        .live-status {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: rgba(0, 242, 255, 0.05); padding: 8px; border-radius: 50px;
            margin-bottom: 15px; border: 1px solid var(--accent-glow); font-size: 0.85rem;
        }
        .pulse { width: 8px; height: 8px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 10px #00ff88; animation: pulse-anim 1.5s infinite; }
        @keyframes pulse-anim { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .chat-container {
            background: var(--glass-bg); border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05); min-height: 500px;
            display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        #master-panel {
            display: none; background: rgba(0, 242, 255, 0.07);
            padding: 15px; border-bottom: 1px solid var(--accent-glow);
        }

        .master-input {
            width: 100%; background: #000; border: 1px solid #222;
            color: #fff; padding: 10px; border-radius: 8px; outline: none; margin-bottom: 10px; resize: none;
        }

        .upload-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .file-btn { background: #1a2332; color: var(--master-neon); padding: 8px 15px; border-radius: 6px; cursor: pointer; border: 1px solid var(--master-neon); font-size: 0.8rem; transition: 0.3s; }
        .file-btn:hover { background: var(--master-neon); color: #000; }

        #messages-flow { 
            flex: 1; padding: 20px; overflow-y: auto; 
            display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px;
            align-content: start;
            scroll-behavior: smooth;
        }
        
        .msg-block {
            background: var(--message-bg); padding: 12px; border-radius: 15px;
            border-right: 4px solid var(--master-neon); animation: fadeIn 0.3s ease; margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            grid-column: span 12; /* الافتراضي للرسائل النصية */
            height: fit-content; position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* تحسين مظهر الرسائل النصية */
        .msg-block.text-only {
            padding: 20px; /* زيادة الحشو للنصوص فقط */
            border-radius: 18px;
            background: linear-gradient(145deg, rgba(15, 22, 36, 0.95), rgba(10, 15, 25, 0.98));
            border: 1px solid rgba(0, 242, 255, 0.1);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .msg-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: #888; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }
        .msg-content { font-size: 1.1rem; line-height: 1.7; color: #fff; font-weight: 500; white-space: pre-wrap; }
        
        /* --- تنسيق الميديا (صور/فيديو/صوت) --- */
        .media-wrapper {
            position: relative; width: 100%; border-radius: 12px; overflow: hidden;
            line-height: 0; margin-top: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); background: #000; z-index: 1;
        }
        
        /* الصور والفيديوهات تكون مربعة */
        .media-wrapper.square-media {
            padding-bottom: 100%; background: #000;
        }
        
        .media-wrapper.square-media img, 
        .media-wrapper.square-media .msg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; display: block;
            border: none;
        }

        /* تحسين للفيديو لضمان ظهور الكونترولز */
        .msg-video {
            z-index: 1; 
            background: #000;
            border: 2px solid var(--video-neon) !important;
            object-fit: contain !important; /* لضمان ظهور الفيديو كاملاً دون قص */
        }
        
        .msg-media-img { 
            border: 2px solid var(--img-border); cursor: pointer; transition: 0.3s;
        }
        .msg-video { border: 2px solid var(--video-neon); } /* الآن سيتبع object-fit: cover من square-media */
        
        /* منطق الميديا المتجاورة (صور وفيديوهات بدون نص) */
        .msg-block.image-only, .msg-block.video-only { 
            grid-column: span 3; 
            padding: 0; background: transparent; box-shadow: none; border: none;
        }

        @media (max-width: 1100px) { .msg-block.image-only, .msg-block.video-only { grid-column: span 4; } } 
        @media (max-width: 768px) { .msg-block.image-only, .msg-block.video-only { grid-column: span 6; } }  
        @media (max-width: 480px) { .msg-block.image-only, .msg-block.video-only { grid-column: span 12; } } 

        /* --- تنسيق التسجيل الصوتي الاحترافي --- */
        .msg-block.audio-type { 
            grid-column: span 12; /* دائماً على خط واحد */
            border-right-color: var(--audio-neon); 
            background: rgba(162, 155, 254, 0.05); border-radius: 12px;
            padding: 12px;
        }
        .msg-audio {
            width: 100%; max-width: none !important; height: 40px; margin-top: 10px;
            filter: hue-rotate(240deg) brightness(1.2);
            display: block;
        }
        
        /* أزرار التحكم داخل هيدر التسجيل الصوتي لضمان عدم التداخل */
        .audio-header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        /* --- شريط الإجراءات الموحد (اليسار العلوي) --- */
        .msg-actions-bar {
            position: absolute; top: 8px; left: 8px;
            display: flex; flex-direction: row; gap: 6px; z-index: 100;
            opacity: 0; transition: 0.3s;
            pointer-events: none;
        }
        .msg-block:hover .msg-actions-bar { opacity: 1; }
        /* في حالة وجود ميديا، نريد الأزرار فوق الميديا مباشرة */
        .media-wrapper .msg-actions-bar { opacity: 0; top: 10px; left: 10px; }
        .media-wrapper:hover .msg-actions-bar { opacity: 1; }
        .msg-actions-bar > * { pointer-events: auto; } 

        .media-actions-overlay {
            display: none; /* تم الاستغناء عنها لصالح شريط موحد */
        }
        
        /* دعم اللمس في الموبايل والتابلت حتى حجم كبير */
        @media (max-width: 1200px) {
            .msg-actions-bar, .media-date-overlay { opacity: 1 !important; }
            .msg-block { border-top: 1px solid rgba(255,255,255,0.05); }
        }

        .btn-mini-action {
            width: 30px; height: 30px; border-radius: 6px;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1); color: #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; font-size: 0.85rem;
        }
        .btn-mini-action.download { background: rgba(0, 242, 255, 0.2); border-color: var(--master-neon); }
        .btn-mini-action.download:hover { background: var(--master-neon); color: #000; }
        .btn-mini-action.zoom { background: rgba(255, 255, 255, 0.15); border-color: #fff; color: #fff; }
        .btn-mini-action.zoom:hover { background: #fff; color: #000; }
        .btn-mini-action.delete { background: rgba(255, 51, 102, 0.2); border-color: #ff3366; }
        .btn-mini-action.delete:hover { background: #ff3366; color: #fff; }

        /* تحسينات المودال للموبايل */
        .schedule-modal-content {
            max-width: 800px;
            margin: 5vh auto;
            background: #0f131a;
            border: 1px solid var(--master-neon);
            padding: 30px;
            border-radius: 20px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            width: 95%;
            animation: fadeInUp 0.4s ease;
        }

        .group-edit-row {
            display: grid;
            grid-template-columns: 1.5fr 1.2fr 100px;
            gap: 10px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #222;
        }

        .sch-in {
            background: #000;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            outline: none;
            font-size: 0.9rem;
            font-family: inherit;
        }
        .sch-in:focus { border-color: var(--master-neon); }

        @media (max-width: 768px) {
            .schedule-modal-content { padding: 25px 15px; }
            .group-edit-row { grid-template-columns: 1fr; gap: 8px; }
            .modal-footer-btns { flex-direction: column; }
        }

        /* التاريخ على الصور */
        .media-date-overlay {
            position: absolute; bottom: 8px; right: 8px;
            background: rgba(0,0,0,0.7); color: #fff; padding: 5px 10px;
            border-radius: 8px; font-size: 0.7rem; z-index: 11;
            opacity: 0; transition: 0.3s;
        }
        .media-wrapper:hover .media-date-overlay { opacity: 1; }

        .preview-img { max-width: 150px; max-height: 150px; width: auto; height: auto; object-fit: contain; border-radius: 8px; border: 1px solid var(--master-neon); display: none; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: rgba(0,0,0,0.3); margin: 0 10px; }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }

        /* ستايل زر الإلغاء الجديد */
        .btn-cancel-upload {
            background: rgba(255, 51, 102, 0.1); color: #ff3366; border: 1px solid #ff3366;
            padding: 8px 15px; border-radius: 6px; cursor: pointer; transition: 0.3s; display: none;
        }
        .btn-cancel-upload:hover { background: #ff3366; color: #fff; }

        /* --- الفوتر الجديد --- */
        footer {
            margin-top: 40px; padding: 30px 5%; background: #030508;
            border-top: 1px solid #111; text-align: center;
        }
        .footer-links { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
        .f-card {
            padding: 10px 20px; background: #0a0e14; border-radius: 10px;
            color: #fff; text-decoration: none; border: 1px solid #1a1a1a; transition: 0.3s;
        }
        .f-card:hover { border-color: var(--master-neon); transform: translateY(-3px); }

        #gate-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 8, 15, 0.98); z-index: 10000; 
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(15px);
        }
    </style>
</head>

    <!-- سكربت التحكم في الواجهة (يعمل بدون سيرفر) -->
    <script>
        // --- نظام حفظ الهوية (Persistence System) ---
        const sessionRole = sessionStorage.getItem('biology_user_role');
        const localRole = localStorage.getItem('biology_user_role');
        
        let isMaster = sessionRole === 'master';

        if (isMaster) {
            const panel = document.getElementById('master-panel');
            if(panel) panel.style.display = 'block';
        }

        window.checkMaster = function() { // يمكن استدعاؤه من الكونسول أو أي مكان
            if(prompt("كود المستر:") === "222") {
                sessionStorage.setItem('biology_user_role', 'master'); 
                location.reload(); 
            } else alert("خطأ!");
        }

        window.enterAs = function(role) {
            if(role === 'student') localStorage.setItem('biology_user_role', 'student');
            document.getElementById('gate-overlay').style.display = 'none';
        }

        window.switchRole = function() {
            const code = prompt("أدخل كود المستر للتبديل:");
            if(code === "222") {
                localStorage.removeItem('biology_user_role'); 
                sessionStorage.setItem('biology_user_role', 'master'); 
                location.reload();
            } else if(code !== null) alert("الكود غير صحيح");
        }

        if(!localRole && !isMaster) localStorage.setItem('biology_user_role', 'student');

        window.closeModal = function(id) {
            document.getElementById(id).style.display = 'none';
        };
    </script>

            z-index: 5; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .remove-preview-btn:hover {
            background: #ff0000;
            transform: scale(1.1);
        }
    </style>

    <!-- التحكم في تشغيل الفيديو التلقائي عند التحويم -->
    <script>
        let videoHoverTimeout;
        window.handleVideoHover = (video, isEntering) => {
            if (!video) return;
            clearTimeout(videoHoverTimeout);
            
            if (isEntering) {
                videoHoverTimeout = setTimeout(() => {
                    if (video.paused) {
                        video.muted = true;
                        video.play().catch(() => {});
                    }
                }, 2000); 
            } else {
                // لا نقوم بإيقافه فوراً إذا كان المستخدم يشاهده بالفعل، 
                // ولكن نتركه يعمل إذا أراد ذلك أو نوقفه حسب رغبتك.
                // لإيقافه عند الخروج تماماً:
                // video.pause(); 
            }
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, onChildRemoved, serverTimestamp, remove, onValue, set, onDisconnect, get } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD092yeOowtCLW0fDcIzaEXrnxvrN4X5T8",
            authDomain: "abqarieno.firebaseapp.com",
            databaseURL: "https://abqarieno-default-rtdb.firebaseio.com",
            projectId: "abqarieno",
            storageBucket: "abqarieno.firebasestorage.app",
            messagingSenderId: "790682500839",
            appId: "1:790682500839:web:cd50b8e01729f821e06c42"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'broadcasts');

        // مصفوفة لتخزين الملفات المختارة فعلياً
        let selectedFilesArray = [];
        let isUploading = false;
        let uploadAborted = false;
        let currentXhr = null;

        window.handleFileSelect = () => {
            const newFiles = Array.from(document.getElementById('fileInput').files);
            selectedFilesArray = [...selectedFilesArray, ...newFiles];
            renderPreviews();
            // تفريغ المدخل للسماح باختيار نفس الملف مرة أخرى إذا حذف
            document.getElementById('fileInput').value = ''; 
        }

        window.removeFile = (index) => {
            selectedFilesArray.splice(index, 1);
            renderPreviews();
        }

        window.renderPreviews = () => {
            const container = document.getElementById('previewsContainer');
            const nameSpan = document.getElementById('fileName');
            const cancelBtn = document.getElementById('cancelUploadBtn');

            container.innerHTML = '';
            
            selectedFilesArray.forEach((file, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'preview-wrapper';
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'remove-preview-btn';
                deleteBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                deleteBtn.onclick = () => removeFile(index);
                
                if (file.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.className = 'preview-img';
                    const reader = new FileReader();
                    reader.onload = (e) => img.src = e.target.result;
                    reader.readAsDataURL(file);
                    wrapper.appendChild(img);
                } else {
                    const iconBox = document.createElement('div');
                    iconBox.className = 'preview-img';
                    iconBox.style.display = 'flex';
                    iconBox.style.alignItems = 'center';
                    iconBox.style.justifyContent = 'center';
                    iconBox.style.background = 'rgba(0,242,255,0.1)';
                    iconBox.innerHTML = '<i class="fa-solid fa-file" style="font-size: 1rem; color: var(--master-neon);"></i>';
                    wrapper.appendChild(iconBox);
                }
                
                wrapper.appendChild(deleteBtn);
                container.appendChild(wrapper);
            });

            if (selectedFilesArray.length > 0) {
                nameSpan.innerText = `(${selectedFilesArray.length} ملفات جاهزة)`;
                nameSpan.style.display = 'inline';
                cancelBtn.style.display = 'inline-block';
            } else {
                nameSpan.style.display = 'none';
                cancelBtn.style.display = 'none';
            }
        }

        window.cancelCurrentAction = () => {
            if (isUploading) {
                if (confirm("يا دكتور، هل تريد إلغاء عملية الرفع الحالية؟")) {
                    uploadAborted = true;
                    if (currentXhr) currentXhr.abort();
                }
            } else {
                selectedFilesArray = [];
                renderPreviews();
            }
        }

        // --- المنطق الجديد لرفع الملفات باستخدام Cloudinary ---
        
        // إعدادات الرفع (النظام المزدوج)
        const IMGBB_API_KEY = "0385965848fc62374c1c82810ffa7d18"; // للصور فقط
        const CLOUD_NAME = "dzwrz9qzb"; // للفيديوهات والملفات
        const UPLOAD_PRESET = "my_chat_preset";

        // --- دالة مساعدة لرفع جزء واحد (Chunk) أو ملف كامل ---

         window.pushMessage = function() { // لم تعد async
            const text = document.getElementById('msgInput').value;
            const pushBtn = document.querySelector('#master-panel button[onclick="pushMessage()"]');
            const progressContainer = document.getElementById('uploadProgressContainer');
            const progressBar = document.getElementById('uploadProgressBar');
            const cancelBtn = document.getElementById('cancelUploadBtn');
            
            if (!text && selectedFilesArray.length === 0) return;

            // 1. تحديث الواجهة فوراً لمنع الإحساس بالتجميد
            pushBtn.disabled = true;
            isUploading = true;
            uploadAborted = false;

            if (selectedFilesArray.length > 0) {
                progressContainer.style.display = 'block';
                progressBar.style.width = '0%';
                cancelBtn.innerText = 'إلغاء الرفع';
            }

            // 2. بدء عملية الرفع بعد لحظة للسماح للواجهة بالتحديث
            setTimeout(async () => {
                 try {
                    if (text && selectedFilesArray.length === 0) {
                        await push(messagesRef, { text: text, timestamp: serverTimestamp() });
                    } else {
                        for (let i = 0; i < selectedFilesArray.length; i++) {
                            if (uploadAborted) break;

                            const file = selectedFilesArray[i];
                            const isFirst = (i === 0);
                            pushBtn.innerHTML = `<i class="fa-solid fa-upload"></i> ${i+1}/${selectedFilesArray.length}`;
                            
                            const formData = new FormData();
                            let uploadURL, mediaType;
                            const isImage = file.type.startsWith('image/');
                            const isVideo = file.type.startsWith('video/');
                            const isAudio = file.type.startsWith('audio/');

                            if (isImage) {
                                formData.append('image', file);
                                uploadURL = `https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`;
                                mediaType = 'image';
                            } else {
                                formData.append('file', file);
                                formData.append('upload_preset', UPLOAD_PRESET);
                                uploadURL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${isVideo || isAudio ? 'video' : 'auto'}/upload`;
                                mediaType = isVideo ? 'video' : (isAudio ? 'audio' : 'file');
                            }

                            const responseData = await new Promise((resolve, reject) => {
                                currentXhr = new XMLHttpRequest();
                                currentXhr.open('POST', uploadURL, true);
                                currentXhr.upload.onprogress = (e) => { if(e.lengthComputable) progressBar.style.width = (e.loaded / e.total) * 100 + '%'; };
                                currentXhr.onload = () => resolve(JSON.parse(currentXhr.responseText));
                                currentXhr.onerror = () => reject();
                                currentXhr.onabort = () => reject(new Error('aborted'));
                                currentXhr.send(formData);
                            });

                            const mediaURL = mediaType === 'image' ? responseData.data.url : responseData.secure_url;
                            await push(messagesRef, { text: isFirst ? text : "", mediaURL, mediaType, fileName: file.name, timestamp: serverTimestamp() });
                        }
                    }
                    
                    if (!uploadAborted) {
                        pushBtn.innerHTML = '<i class="fa-solid fa-check"></i> تم النشر';
                        setTimeout(() => { pushBtn.innerText = 'نشر'; }, 2000);
                    } else {
                        pushBtn.innerHTML = '<i class="fa-solid fa-ban"></i> تم الإلغاء';
                        setTimeout(() => { pushBtn.innerText = 'نشر'; }, 2000);
                    }

                 } catch (error) {
                     if (error.message !== 'aborted') {
                        console.error("خطأ في الرفع:", error);
                        alert("فشل الرفع. الخطأ: " + error.message);
                     }
                 } finally {
                pushBtn.disabled = false;
                isUploading = false;
                cancelBtn.innerText = 'إلغاء';
                if(pushBtn.innerText !== 'نشر') setTimeout(() => pushBtn.innerText = 'نشر', 2000); // Reset if not already reset
                document.getElementById('msgInput').value = '';
                selectedFilesArray = [];
                renderPreviews();
                
                // إخفاء وإعادة تعيين شريط التقدم
                progressContainer.style.display = 'none';
                progressBar.style.width = '0%';
             }
            }, 50); // تأخير بسيط للسماح للواجهة بالتحديث
         }

        // --- Schedule Management Logic ---
        window.openScheduleEditorShortcut = async function() {
            document.getElementById('scheduleModal').style.display = 'flex';
            const content = document.getElementById('scheduleEditorContent');
            
            const snapshot = await get(ref(db, 'schedule'));
            let data = snapshot.exists() ? snapshot.val() : {
                card1: { days: "الأحد والأربعاء", grade: "أولى ثانوي", groups: { g1: { name: "المجموعة الأولى (أ)", time: "02:00 PM", status: "متاح" }, g2: { name: "المجموعة الثانية (ب)", time: "03:30 PM", status: "متاح" }, g3: { name: "المجموعة الثالثة (ج)", time: "06:30 PM", status: "متاح" } } },
                card2: { days: "الاثنين والخميس", grade: "أولى ثانوي", groups: { g4: { name: "المجموعة الرابعة (د)", time: "02:00 PM", status: "متاح" }, g5: { name: "المجموعة الخامسة (هـ)", time: "03:30 PM", status: "متاح" }, g6: { name: "المجموعة السادسة (و)", time: "06:30 PM", status: "متاح" } } }
            };

            content.innerHTML = '';
            Object.keys(data).forEach(cardKey => {
                const card = data[cardKey];
                let groupsInputs = '';
                
                Object.keys(card.groups).forEach(gKey => {
                    const group = card.groups[gKey];
                    groupsInputs += `
                        <div class="group-edit-row">
                            <input type="text" class="sch-in" data-card="${cardKey}" data-group="${gKey}" data-field="name" value="${group.name}" placeholder="اسم المجموعة">
                            <input type="text" class="sch-in" data-card="${cardKey}" data-group="${gKey}" data-field="time" value="${group.time}" placeholder="الوقت">
                            <select class="sch-in" data-card="${cardKey}" data-group="${gKey}" data-field="status">
                                <option value="متاح" ${group.status === 'متاح' ? 'selected' : ''}>متاح</option>
                                <option value="مكتمل" ${group.status === 'مكتمل' ? 'selected' : ''}>مكتمل</option>
                            </select>
                        </div>
                    `;
                });

                content.innerHTML += `
                    <div style="margin-bottom: 30px; border: 1px solid #333; padding: 15px; border-radius: 12px;">
                        <h4 style="margin-bottom: 15px; color: var(--master-neon);">${card.days}</h4>
                        ${groupsInputs}
                    </div>
                `;
            });
        };

        window.saveScheduleChanges = async function() {
            const inputs = document.querySelectorAll('.sch-in');
            const snapshot = await get(ref(db, 'schedule'));
            let scheduleData = snapshot.val() || {};

            inputs.forEach(input => {
                const card = input.getAttribute('data-card');
                const group = input.getAttribute('data-group');
                const field = input.getAttribute('data-field');
                
                if (!scheduleData[card]) scheduleData[card] = { days: card === 'card1' ? "الأحد والأربعاء" : "الاثنين والخميس", groups: {} };
                if (!scheduleData[card].groups[group]) scheduleData[card].groups[group] = {};
                
                scheduleData[card].groups[group][field] = input.value;
            });

            await set(ref(db, 'schedule'), scheduleData);
            
            await push(ref(db, 'broadcasts'), {
                text: "📢 تنبيه: تم تحديث جدول المواعيد والمجموعات المتاحة. يرجى مراجعة صفحة الجدول الآن.",
                timestamp: serverTimestamp()
            });

            alert("تم حفظ التعديلات ونشر الخبر للطلاب بنجاح!");
            closeModal('scheduleModal');
        };

        // عرض الرسائل (نظام سريع جداً)
        const flow = document.getElementById('messages-flow');
        // إزالة رسالة التحميل عند وصول أول رسالة
        let firstLoad = true;

        onChildAdded(messagesRef, (snapshot) => {
            if(firstLoad) {
                flow.innerHTML = '';
                firstLoad = false;
            }

            const m = snapshot.val();
            const id = snapshot.key;
            const date = m.timestamp ? new Date(m.timestamp).toLocaleString('ar-EG', { weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: true }) : 'الآن';
            
            // تحديث حالة القراءة (آخر ظهور) تلقائياً عند رؤية الرسائل
            const currentLastSeen = parseInt(localStorage.getItem('biology_last_seen_news') || '0');
            if (m.timestamp && m.timestamp > currentLastSeen) {
                localStorage.setItem('biology_last_seen_news', m.timestamp);
            }
            
            const isImageOnly = !m.text && m.mediaType === 'image';
            const isAudio = m.mediaType === 'audio';
            const isVideo = m.mediaType === 'video';
            const isVideoOnly = (!m.text || m.text.trim() === '') && isVideo;

            let mediaHtml = ''; // سيتم بناء محتوى الميديا هنا
            if(m.mediaURL) {
                let content = '';
                let typeClass = '';
                
                if (m.mediaType === 'image') {
                    content = `<img src="${m.mediaURL}" class="msg-media-img" onclick="openLightbox('${m.mediaURL}', 'image')"><div class="media-date-overlay">${date}</div>`;
                    typeClass = 'square-media';
                } else if (m.mediaType === 'video') {
                    // الفيديوهات تظهر مربعة - تمت إزالة التاريخ من فوق الفيديو كما طلبت
                    content = `<video src="${m.mediaURL}" controls class="msg-video" onmouseenter="handleVideoHover(this, true)" onmouseleave="handleVideoHover(this, false)"></video>`;
                    typeClass = 'square-media';
                } else if (isAudio) {
                    content = `<audio src="${m.mediaURL}" controls class="msg-audio"></audio>`;
                    typeClass = 'audio-wrapper';
                } else {
                    content = `<div style="background:rgba(255,255,255,0.05); padding:15px; border:1px dashed #444; border-radius:8px; display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-file-lines"></i> ${m.fileName || 'ملف مرفق'}</div>`;
                }

                mediaHtml = `
                    <div class="media-wrapper ${typeClass}">
                        ${!isAudio ? `
                        <div class="msg-actions-bar">
                            ${m.mediaType === 'video' ? `<button onclick="openLightbox('${m.mediaURL}', 'video')" class="btn-mini-action zoom" title="تكبير وعرض كامل"><i class="fa-solid fa-expand"></i></button>` : ''}
                            <a href="${m.mediaURL}" download="${m.fileName || 'file'}" target="_blank" class="btn-mini-action download" title="تحميل"><i class="fa-solid fa-download"></i></a>
                            ${isMaster ? `<div onclick="deleteMsg('${id}')" class="btn-mini-action delete" title="حذف الميديا"><i class="fa-solid fa-trash-can"></i></div>` : ''}
                        </div>` : ''}
                        ${content}
                    </div>`;
            }

            // بناء الهيدر مخصص للتسجيل الصوتي لوضع الأزرار في المنتصف
            let headerContent;
            if (isAudio) {
                headerContent = `
                    <span><i class="fa-solid fa-microphone" style="color:var(--audio-neon)"></i> تسجيل صوتي</span>
                    <div class="audio-header-actions">
                        <a href="${m.mediaURL}" download="${m.fileName || 'audio'}" target="_blank" class="btn-mini-action download" title="تحميل"><i class="fa-solid fa-download"></i></a>
                        ${isMaster ? `<div onclick="deleteMsg('${id}')" class="btn-mini-action delete" title="حذف"><i class="fa-solid fa-trash-can"></i></div>` : ''}
                    </div>
                    <span>${date}</span>
                `;
            } else {
                headerContent = `<span><i class="fa-solid fa-bullhorn" style="color:var(--master-neon)"></i> توجيه رسمي</span><span>${date}</span>`;
            }

            const html = `
                <div class="msg-block ${isImageOnly ? 'image-only' : ''} ${isAudio ? 'audio-type' : ''} ${isVideoOnly ? 'video-only' : ''}" id="msg-${id}">
                    ${isMaster && !m.mediaURL ? `
                    <div class="msg-actions-bar">
                        <div onclick="deleteMsg('${id}')" class="btn-mini-action delete" title="حذف الرسالة"><i class="fa-solid fa-trash-can"></i></div>
                    </div>` : ''}
                    ${!isImageOnly && !isVideoOnly ? `<div class="msg-header" style="${isAudio ? 'display:flex; justify-content:space-between; width:100%; border-bottom:none;' : ''}">${headerContent}</div>` : ''}
                    ${m.text ? `<div class="msg-content">${m.text}</div>` : ''}
                    ${mediaHtml}
                </div>
            `;
            flow.insertAdjacentHTML('afterbegin', html); // إضافة الرسالة الجديدة في الأعلى
        });

        onChildRemoved(messagesRef, (snapshot) => {
            const el = document.getElementById(`msg-${snapshot.key}`);
            if(el) el.remove();
        });

        window.deleteMsg = (id) => { 
            if(confirm("هل أنت متأكد يا دكتور من حذف هذه الرسالة؟ لا يمكن التراجع عن هذا الإجراء.")) {
                remove(ref(db, `broadcasts/${id}`)); 
            }
        }

        // --- دوال عارض الصور (Lightbox) ---
        window.openLightbox = function(src, type) {
            const container = document.getElementById('lightbox-content');
            const overlay = document.getElementById('lightbox-overlay');
            
            container.innerHTML = ''; // تنظيف المحتوى السابق
            
            if (type === 'video') {
                container.innerHTML = `<video src="${src}" controls autoplay style="max-width:100%; max-height:90vh; border-radius:10px; box-shadow:0 0 50px rgba(0,255,65,0.2);"></video>`;
            } else { // image
                const img = document.createElement('img');
                img.src = src;
                img.style.maxWidth = '100%';
                img.style.maxHeight = '90vh';
                img.style.borderRadius = '10px';
                container.appendChild(img);
            }
            
            overlay.classList.add('active');
        };

        window.closeLightbox = function() {
            const overlay = document.getElementById('lightbox-overlay');
            overlay.classList.remove('active');
            // إيقاف الفيديو عند الإغلاق
            setTimeout(() => {
                document.getElementById('lightbox-content').innerHTML = '';
            }, 400);
        };
        
        // إغلاق عند الضغط على الخلفية أو زر الإغلاق
        document.querySelector('.close-lightbox').onclick = window.closeLightbox;
        document.getElementById('lightbox-overlay').onclick = (e) => {
            if(e.target.id === 'lightbox-overlay') window.closeLightbox();
        };

        // --- Realtime Presence Counter ---
        const userCountEl = document.getElementById('userCount');
        const presenceRef = ref(db, 'presence');

        // Create a reference for my connection
        const myConnectionRef = push(presenceRef);

        // Add ourselves to presence list when online.
        const connectedRef = ref(db, '.info/connected');
        onValue(connectedRef, (snap) => {
          if (snap.val() === true) {
            set(myConnectionRef, true);
            // When I disconnect, remove this device
            onDisconnect(myConnectionRef).remove();
          }
        });

        // Count online users
        onValue(presenceRef, (snap) => {
            const onlineCount = snap.exists() ? snap.size : 0;
            const baseCount = 150; // رقم أساسي لضمان عدم ظهور أرقام صغيرة
            const randomFuzz = Math.floor(Math.random() * 20); // رقم عشوائي بسيط
            userCountEl.innerText = onlineCount + baseCount + randomFuzz;
        });
    </script>

    <script>
        // تسجيل Service Worker
        if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
        }
    </script>
