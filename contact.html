<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تواصل مباشرة مع الدكتور وفريق الدعم الفني. مركز الرسائل والتنبيهات لطلاب الأحياء لمتابعة كل جديد.">
    <meta name="keywords" content="تواصل معنا، دعم فني منصة الدكتور، رقم دكتور عبدالله أحياء، جروب تليجرام أحياء، سكرتارية دكتور عبدالله، حجز دروس أحياء، شكاوى واقتراحات الطلاب">
    <title>مركز رسائل الدكتور - 2028 Edition</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="manifest" href="manifest.json">
    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ContactPage",
      "name": "تواصل مع الدكتور",  
      "description": "مركز الرسائل والدعم الفني لطلاب الدكتور في مادة الأحياء.", 
      "url": "https://abqarieno.firebaseapp.com/contact.html"  
    }
    </script>
    <style> 
        :root { 
            --master-neon: #00f2ff;
            --dark-surface: #070a0f; 
            --glass-bg: rgba(15, 22, 36, 0.9);
            --message-bg: rgba(255, 255, 255, 0.03);
            --accent-glow: rgba(0, 242, 255, 0.2);
            --audio-neon: #a29bfe; /* بنفسجي نيون هادئ للتسجيلات */
            --img-border: #00f2ff; /* أزرق سماوي نيون حاد للصور */
            --video-neon: #ff6600; /* برتقالي نيون قوي للفيديوهات */
        }

        body {
            background: radial-gradient(circle at center, #101a2d 0%, #070a0f 100%);
            background-attachment: fixed;
            color: #e0e6ed;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Light Mode Overrides */
        body.light-mode {
            background: #f0f2f5;
            color: #333;
        }
        body.light-mode .chat-container {
            background: #fff;
            border-color: #ddd;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        body.light-mode .msg-block {
            background: #f8f9fa;
            color: #333;
            border-right: 4px solid var(--master-neon);
        }
        body.light-mode .msg-content { color: #333; }
        body.light-mode .master-input { background: #fff; color: #333; border: 1px solid #ddd; }
        body.light-mode #master-panel { background: rgba(0, 242, 255, 0.1); }
        body.light-mode footer { background: #e9ecef; border-top: 1px solid #ddd; color: #333; }
        body.light-mode .f-card { background: #fff; color: #333; border-color: #ddd; }

        /* --- واجهة الشات المصغرة والأنيقة --- */
        .chat-wrapper { max-width: 1000px; margin: 20px auto; padding: 0 15px; }

        .live-status {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: rgba(0, 242, 255, 0.05); padding: 8px; border-radius: 50px;
            margin-bottom: 15px; border: 1px solid var(--accent-glow); font-size: 0.85rem;
        }
        .pulse { width: 8px; height: 8px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 10px #00ff88; animation: pulse-anim 1.5s infinite; }
        @keyframes pulse-anim { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .chat-container {
            background: var(--glass-bg); border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.1); min-height: 600px;
            display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            overflow: hidden;
            backdrop-filter: blur(25px);
        }

        #master-panel {
            display: none;
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            background: transparent;
            z-index: 1000;
        }

        /* حاوية الإدخال الاحترافية (Gemini Style) */
        .gemini-input-wrapper {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 20px;
            padding: 8px 12px;
            display: flex;
            align-items: center; /* التوسيط الرأسي يضمن توازن الشكل مع النصوص الطويلة */
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px); /* تقليل القيمة لزيادة السرعة في الموبايل */
            -webkit-backdrop-filter: blur(10px);
        }
        .gemini-input-wrapper:focus-within {
            border-color: var(--master-neon);
            background: rgba(15, 23, 42, 0.9);
        }

        .master-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 8px 5px;
            outline: none;
            resize: none;
            font-size: 0.95rem;
            max-height: 120px; 
            line-height: 1.5;
            font-family: inherit;
            min-width: 0; /* ضروري جداً لمنع النص من دفع الأزرار خارج الشاشة */
        }

        .input-tools {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0; /* يمنع انضغاط الأزرار مهما كان حجم النص */
        }

        .tool-btn {
            padding: 0 10px; height: 38px;
            border-radius: 10px;
            border: 1px solid rgba(0, 242, 255, 0.1); 
            background: rgba(0, 242, 255, 0.03);
            color: #888; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s; font-size: 0.9rem; font-weight: bold; gap: 8px;
        }
        .tool-btn:hover { background: rgba(0, 242, 255, 0.1); color: var(--master-neon); border-color: var(--master-neon); }
        
        /* إخفاء النص في الشاشات الصغيرة جداً لترك مساحة */
        @media (max-width: 400px) {
            .tool-btn span { display: none; }
            .tool-btn { width: 38px; padding: 0; }
        }

        .send-btn-pro {
            height: 38px;
            padding: 0 15px;
            border-radius: 12px;
            border: none;
            background: var(--master-neon);
            color: #000;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.3);
            gap: 6px;
        }
        .send-btn-pro:hover:not(:disabled) { background: #fff; transform: translateY(-2px); }
        .send-btn-pro:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }

        .upload-row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px 15px; background: rgba(255, 69, 0, 0.05); 
            border-radius: 12px; border: 1px solid rgba(255, 69, 0, 0.1);
            margin: 10px 0; animation: fadeIn 0.3s ease;
        }
        .btn-cancel-upload { 
            background: var(--neon-red); color: #fff; border: none;
            padding: 6px 15px; border-radius: 50px; font-weight: 900;
            cursor: pointer; font-size: 0.75rem; transition: 0.3s;
            display: flex; align-items: center; gap: 6px;
        }
        .btn-cancel-upload:hover { background: #fff; color: #ff0000; transform: scale(1.05); }

        #messages-flow { 
            flex: 1; padding: 20px; overflow-y: auto; 
            display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px;
            align-content: start;
            scroll-behavior: smooth;
        }
        
        .msg-block {
            background: var(--message-bg); padding: 12px; border-radius: 15px;
            border-right: 4px solid var(--master-neon); animation: fadeIn 0.3s ease; margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            grid-column: span 12; /* الافتراضي للرسائل النصية */
            height: fit-content; position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* تحسين مظهر الرسائل النصية */
        .msg-block.text-only {
            padding: 20px; /* زيادة الحشو للنصوص فقط */
            border-radius: 18px;
            background: linear-gradient(145deg, rgba(15, 22, 36, 0.95), rgba(10, 15, 25, 0.98));
            border: 1px solid rgba(0, 242, 255, 0.1);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .msg-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: #888; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }
        .msg-content { font-size: 1.1rem; line-height: 1.7; color: #fff; font-weight: 500; white-space: pre-wrap; }
        
        /* --- تنسيق الميديا (صور/فيديو/صوت) --- */
        .media-wrapper {
            position: relative; width: 100%; border-radius: 12px; overflow: hidden;
            line-height: 0; margin-top: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); background: #000; z-index: 1;
        }
        
        /* تحسين عرض الصور بنظام Pinterest (بدون قص) */
        .media-wrapper.square-media { 
            padding-bottom: 0; 
            background: transparent; 
            min-height: auto; 
            overflow: visible; /* للسماح للبوردر العائم بالظهور */
        }
        .media-wrapper.square-media img { 
            position: static; 
            width: 100%; 
            height: auto; 
            object-fit: contain; 
            display: block; 
            border-radius: 10px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
            /* حل مشكلة الجودة: منع التغبيش عند التحريك */
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            will-change: transform;
            image-rendering: -webkit-optimize-contrast;
        }

        /* حاوية الفيديو المرنة (تأخذ حجم الفيديو الحقيقي) */
        .media-wrapper.video-context { background: #000; border: 2px solid var(--video-neon); border-radius: 12px; overflow: hidden; box-shadow: 0 0 20px rgba(0, 242, 255, 0.15); }
        .msg-video { width: 100%; height: auto; max-height: 400px; display: block; outline: none; background: #000; }
        
        /* --- نظام مكعبات البناء (Pinterest Masonry) --- */
        #messages-flow { 
            display: block; /* إلغاء الجريد القديم */
            column-count: 3; /* 3 أعمدة في الشاشات الكبيرة */
            column-gap: 20px;
            padding: 20px;
            overflow-y: auto;
        }

        .msg-block {
            display: inline-block; /* ضروري لعمل الـ columns */
            width: 100%;
            break-inside: avoid; /* يمنع انقسام المكعب بين عمودين */
            background: #0a0e17;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 20px;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.4); /* ظل صلب لإيحاء المكعبات */
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            content-visibility: auto; /* تحسين الأداء الفائق: معالجة الرسائل الظاهرة فقط */
            contain-intrinsic-size: 1px 300px; /* حجم تقديري للمساعدة في سرعة السكرول */
            /* ضمان عدم تداخل الطبقات في الموبايل */
            transform: translateZ(0);
        }
        .msg-block:hover {
            transform: translateY(-5px);
            box-shadow: 12px 12px 0px rgba(0, 242, 255, 0.1);
        }

        /* تأثير البوردر العائم عند تحريك الماوس (لبني نيون) */
        .msg-media-img:hover {
            /* استخدام scale خفيف جداً مع translateZ لضمان الثبات */
            transform: scale(0.98) translateZ(0); 
            outline: 2px solid var(--master-neon);
            outline-offset: 10px; /* البوردر بعيد عن الصورة (غير لاصق) */
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.2);
        }

        @media (max-width: 1024px) { #messages-flow { column-count: 2; } }
        @media (max-width: 600px) { #messages-flow { column-count: 1; } }

        /* تعديل الحاوية لتسمح بظهور التوهج الخارجي */
        .msg-block.image-only, .msg-block.video-only { 
            padding: 15px; /* ترك مساحة للبوردر العائم */
            overflow: visible; 
            background: #0a0e17; 
        }

        /* --- تنسيق التسجيل الصوتي الاحترافي --- */
        .msg-block.audio-type { 
            grid-column: span 12; /* دائماً على خط واحد */
            border-right-color: var(--audio-neon); 
            background: rgba(162, 155, 254, 0.05); border-radius: 12px;
            padding: 12px;
        }
        
        /* تحسينات الميديا لتعمل فوراً على الموبايل */
        .msg-video, .msg-audio {
            width: 100%; 
            display: block;
            position: relative;
            z-index: 5; /* لضمان ظهور أزرار التحكم فوق أي حاوية */
            pointer-events: auto !important; /* التأكد من استقبال النقرات */
        }
        .msg-audio { height: 40px; margin-top: 10px; filter: hue-rotate(240deg) brightness(1.2); }
        .msg-video { max-height: 400px; outline: none; background: #000; border-radius: 8px; }
        
        /* أزرار التحكم داخل هيدر التسجيل الصوتي لضمان عدم التداخل */
        .audio-header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        /* --- شريط الإجراءات السفلي الجديد --- */
        .msg-footer-actions {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: flex-start;
            gap: 10px;
            opacity: 0.6;
            transition: 0.3s;
        }
        .msg-block:hover .msg-footer-actions { opacity: 1; }

        .msg-top-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
        
        /* دعم اللمس في الموبايل والتابلت حتى حجم كبير */
        @media (max-width: 1200px) {
            .msg-actions-bar, .media-date-overlay { opacity: 1 !important; }
            .msg-block { border-top: 1px solid rgba(255,255,255,0.05); }
        }

        .btn-mini-action {
            width: 30px; height: 30px; border-radius: 6px;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1); color: #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; font-size: 0.85rem;
        }
        .btn-mini-action.download { background: rgba(0, 242, 255, 0.2); border-color: var(--master-neon); }
        .btn-mini-action.download:hover { background: var(--master-neon); color: #000; }
        .btn-mini-action.zoom { background: rgba(255, 255, 255, 0.15); border-color: #fff; color: #fff; }
        .btn-mini-action.zoom:hover { background: #fff; color: #000; }
        .btn-mini-action.delete { background: rgba(255, 51, 102, 0.2); border-color: #ff3366; }
        .btn-mini-action.delete:hover { background: #ff3366; color: #fff; }

        /* تحسينات المودال للموبايل */
        .schedule-modal-content {
            max-width: 800px;
            margin: 5vh auto;
            background: #0f131a;
            border: 1px solid var(--master-neon);
            padding: 0;
            border-radius: 20px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            width: 95%;
            animation: fadeInUp 0.4s ease;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .modal-header-pro {
            padding: 20px 25px;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body-pro {
            padding: 25px;
        }

        .group-edit-row {
            display: grid;
            grid-template-columns: 1fr 1fr 120px;
            gap: 10px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .group-edit-row:hover { border-color: var(--master-neon); background: rgba(0,242,255,0.03); }

        .sch-in {
            background: #000;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            outline: none;
            font-size: 0.9rem;
            font-family: inherit;
        }
        .sch-in:focus { border-color: var(--master-neon); }

        @media (max-width: 768px) {
            .schedule-modal-content { padding: 25px 15px; }
            .group-edit-row { grid-template-columns: 1fr; gap: 8px; }
            .modal-footer-btns { flex-direction: column; }
        }

        /* التاريخ على الصور */
        .media-date-overlay {
            position: absolute; bottom: 8px; right: 8px;
            background: rgba(0,0,0,0.7); color: #fff; padding: 5px 10px;
            border-radius: 8px; font-size: 0.7rem; z-index: 11;
            opacity: 0; transition: 0.3s;
        }
        .media-wrapper:hover .media-date-overlay { opacity: 1; }

        /* تحسين مظهر المعاينة المتعددة قبل الرفع */
        .preview-wrapper { position: relative; display: inline-block; margin: 10px 5px; vertical-align: top; }
        .preview-img { 
            display: block; /* تم تغييرها من none لضمان الظهور */
            max-width: 80px; 
            max-height: 80px; 
            width: auto; 
            height: auto; 
            object-fit: cover; 
            border-radius: 10px; 
            border: 2px solid var(--master-neon); 
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            background: rgba(0,0,0,0.3); 
            box-shadow: 0 5px 15px rgba(0, 242, 255, 0.2);
        }
        .remove-preview-btn {
            position: absolute; top: -10px; right: -10px;
            background: #ff3366; color: #fff; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%; width: 24px; height: 24px;
            font-size: 12px; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            z-index: 5; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        .remove-preview-btn:hover { background: #ff0000; transform: scale(1.15) rotate(90deg); }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }

        /* --- الفوتر الجديد --- */
        footer {
            margin-top: 40px; padding: 30px 5%; background: #030508;
            border-top: 1px solid #111; text-align: center;
        }
        .footer-links { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
        .f-card {
            padding: 10px 20px; background: #0a0e14; border-radius: 10px;
            color: #fff; text-decoration: none; border: 1px solid #1a1a1a; transition: 0.3s;
        }
        .f-card:hover { border-color: var(--master-neon); transform: translateY(-3px); }

        #gate-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 8, 15, 0.98); z-index: 10000; 
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(15px);
        }
    </style>
</head>
<body>
    
    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-heart-pulse"></i>
            <div class="logo-text"><span>الدكتور</span><small>BIOLOGY MASTER</small></div>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="library.html">الكتب</a></li>
            <li><a href="videos.html">الفيديوهات</a></li>
            <li><a href="quizzes.html">الاختبارات</a></li>
            <li><a href="schedule.html">الجدول</a></li>
            <li><a href="reviews.html">ورق الشرح</a></li>
            <li><a href="contact.html" class="active">تواصل معنا</a></li>
        </ul>
        <div style="display:flex; align-items:center; gap:5px;">
            <button id="themeToggle" class="theme-toggle" title="تبديل الوضع"><i class="fa-solid fa-moon"></i></button>
            <!-- زر التثبيت يظهر فقط في الصفحة الرئيسية لتجنب التكرار، أو يمكن تركه مخفياً -->
            <button id="installAppBtn" class="btn-nav-install" style="display: none;" title="تثبيت التطبيق"><i class="fa-solid fa-download"></i></button>
            <div class="menu-btn"><i class="fa-solid fa-bars"></i></div>
        </div>
    </nav>

    <!-- عارض الصور الاحترافي (Lightbox) -->
    <div id="lightbox-overlay" class="lightbox-overlay">
        <span class="close-lightbox">&times;</span>
        <div class="lightbox-content" id="lightbox-content"></div>
    </div>

    <div class="chat-wrapper">
        <div class="live-status">

    <script src="main.js"></script>

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, onChildRemoved, serverTimestamp, remove, onValue, set, onDisconnect, get } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
        const db = getDatabase(app);
        const auth = getAuth(app);
        const messagesRef = ref(db, 'broadcasts');
        const flow = document.getElementById('messages-flow');
        const CACHE_KEY = 'biology_contact_messages_v3';

        // --- إظهار فوري للوحة التحكم إذا كان مسجلاً مسبقاً ---
        const sessionRole = sessionStorage.getItem('biology_user_role');
        if (sessionRole === 'master') {
            window.isMaster = true;
            document.getElementById('master-panel').style.display = 'block';
        }

        window.isMaster = window.isMaster || false;

        // 2. التحقق من صلاحيات الأدمن لإظهار لوحة التحكم
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await get(ref(db, `users/${user.uid}`));
                if (snap.exists() && snap.val().role === 'admin') {
                    window.isMaster = true;
                    sessionStorage.setItem('biology_user_role', 'master');
                    document.getElementById('master-panel').style.display = 'block';
                    // إعادة رندر الكاش لإظهار أزرار الحذف للأدمن
                    renderFromCache();
                } else {
                    window.isMaster = false;
                    document.getElementById('master-panel').style.display = 'none';
                }
            }
        });

        // جلب الرسائل المخزنة مسبقاً
        let messageCache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');

        // مصفوفة لتخزين الملفات المختارة فعلياً
        let selectedFilesArray = [];
        let isUploading = false;
        let uploadAborted = false;
        let activeXhrs = []; // مصفوفة لتتبع الطلبات النشطة للإلغاء

        // --- دالة ذكية لتوليد صورة مصغرة للفيديو قبل الرفع ---
        async function generateVideoThumbnail(file) {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                video.preload = 'metadata';
                video.src = URL.createObjectURL(file);
                video.muted = true;
                video.onloadeddata = () => {
                    video.currentTime = 0.5; // التقاط كادر بعد نصف ثانية
                };
                video.onseeked = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    URL.revokeObjectURL(video.src);
                    resolve(dataUrl);
                };
                video.onerror = () => resolve('');
            });
        }

        window.handleFileSelect = async () => {
            const newFiles = Array.from(document.getElementById('fileInput').files);
            selectedFilesArray = [...selectedFilesArray, ...newFiles];
            await renderPreviews();
            // تفريغ المدخل للسماح باختيار نفس الملف مرة أخرى إذا حذف
            document.getElementById('fileInput').value = ''; 
        }

        window.removeFile = (index) => {
            selectedFilesArray.splice(index, 1);
            renderPreviews();
        }

        window.renderPreviews = async () => {
            const container = document.getElementById('previewsContainer');
            const nameSpan = document.getElementById('fileName');
            container.innerHTML = '';
            
            for (let i = 0; i < selectedFilesArray.length; i++) {
                const file = selectedFilesArray[i];
                const wrapper = document.createElement('div');
                wrapper.className = 'preview-wrapper';
                wrapper.style.cursor = 'pointer';
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'remove-preview-btn';
                deleteBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                deleteBtn.onclick = (e) => { e.stopPropagation(); removeFile(i); };
                
                const fileURL = URL.createObjectURL(file);

                if (file.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.className = 'preview-img';
                    img.src = fileURL;
                    img.onclick = () => openLightbox(fileURL, 'image');
                    wrapper.appendChild(img);
                } else if (file.type.startsWith('video/')) {
                    const thumbUrl = await generateVideoThumbnail(file);
                    const img = document.createElement('img');
                    img.className = 'preview-img';
                    img.src = thumbUrl || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZmlsbD0iI2FhYSIgZD0iTTggNXYxNGwxMS03eiIvPjwvc3ZnPg=='; 
                    img.onclick = () => openLightbox(fileURL, 'video');
                    const playOverlay = document.createElement('div');
                    playOverlay.innerHTML = '<i class="fa-solid fa-circle-play"></i>';
                    playOverlay.style.cssText = "position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; pointer-events:none; font-size:1.5rem; text-shadow:0 0 15px rgba(0,0,0,0.8);";
                    wrapper.appendChild(img);
                    wrapper.appendChild(playOverlay);
                } else if (file.type.startsWith('audio/')) {
                    const iconBox = document.createElement('div');
                    iconBox.className = 'preview-img';
                    iconBox.style.cssText = 'display:flex; align-items:center; justify-content:center; background:rgba(162,155,254,0.1); border:1px solid var(--audio-neon);';
                    iconBox.innerHTML = '<i class="fa-solid fa-microphone-lines" style="color:var(--audio-neon); font-size:1.5rem;"></i>';
                    iconBox.onclick = () => openLightbox(fileURL, 'audio');
                    wrapper.appendChild(iconBox);
                } else {
                    const iconBox = document.createElement('div');
                    iconBox.className = 'preview-img';
                    iconBox.style.cssText = 'display:flex; align-items:center; justify-content:center; background:rgba(0,242,255,0.1);';
                    iconBox.innerHTML = '<i class="fa-solid fa-file" style="font-size: 1rem; color: var(--master-neon);"></i>';
                    wrapper.appendChild(iconBox);
                }
                wrapper.appendChild(deleteBtn);
                container.appendChild(wrapper);
            }

            if (selectedFilesArray.length > 0) {
                nameSpan.innerHTML = `<i class="fa-solid fa-paperclip"></i> تم اختيار (${selectedFilesArray.length}) ملفات`;
                document.getElementById('cancelBar').style.display = 'flex';
            } else {
                document.getElementById('cancelBar').style.display = 'none';
            }
        }

        window.cancelCurrentAction = () => {
            if (isUploading) {
                if (confirm("يا دكتور، هل تريد إلغاء عملية الرفع الحالية؟")) {
                    uploadAborted = true;
                    activeXhrs.forEach(xhr => xhr.abort());
                    activeXhrs = [];
                    resetPanelState();
                }
            } else {
                selectedFilesArray = [];
                renderPreviews();
            }
        }

        // --- المنطق الجديد لرفع الملفات باستخدام Cloudinary ---
        
        const IMGBB_API_KEY = "0385965848fc62374c1c82810ffa7d18"; // للصور فقط
        const CLOUD_NAME = "dzwrz9qzb"; // للفيديوهات والملفات
        const UPLOAD_PRESET = "my_chat_preset";

        // --- دالة ضغط الصور الصاروخية ---
        async function compressImage(file) {
            if (!file.type.startsWith('image/')) return file;
            return new Promise((resolve) => {
                const img = new Image();
                img.src = URL.createObjectURL(file);
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const scale = Math.min(1600 / img.width, 1);
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.9);
                };
            });
        }

         window.pushMessage = async function() {
            const textInput = document.getElementById('msgInput');
            const text = textInput.value;
            const pushBtn = document.getElementById('publishBtn');

            if (!text.trim() && selectedFilesArray.length === 0) return;
            if (!auth.currentUser) return alert("يجب تسجيل الدخول أولاً.");

            pushBtn.disabled = true;
            isUploading = true;
            uploadAborted = false;
            activeXhrs = [];

            try {
                if (selectedFilesArray.length > 0) {
                    document.getElementById('uploadProgressContainer').style.display = 'block';
                    document.getElementById('cancelBar').style.display = 'flex';
                    pushBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span style="font-size:0.8rem;">رفع...</span>`;

                    // إنشاء وعود الرفع لتعمل بالتوازي (Parallel Execution)
                    const uploadPromises = selectedFilesArray.map(async (file, i) => {
                        if (uploadAborted) return;

                        const formData = new FormData();
                        let uploadURL, mediaType;
                        const isImage = file.type.startsWith('image/');
                        const isVideo = file.type.startsWith('video/');
                        const isAudio = file.type.startsWith('audio/');

                        let processedFile = file;
                        if (isImage) {
                            processedFile = await compressImage(file);
                            formData.append('image', processedFile);
                            uploadURL = `https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`;
                            mediaType = 'image';
                        } else {
                            formData.append('file', processedFile);
                            formData.append('upload_preset', UPLOAD_PRESET);
                            uploadURL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${isVideo || isAudio ? 'video' : 'auto'}/upload`;
                            mediaType = isVideo ? 'video' : (isAudio ? 'audio' : 'file');
                        }

                        const responseData = await new Promise((resolve, reject) => {
                            const xhr = new XMLHttpRequest();
                            activeXhrs.push(xhr);
                            xhr.open('POST', uploadURL, true);
                            xhr.upload.onprogress = (e) => { 
                                if(e.lengthComputable) document.getElementById('uploadProgressBar').style.width = (e.loaded / e.total) * 100 + '%'; 
                            };
                            xhr.onload = () => {
                                if (xhr.status === 200) resolve(JSON.parse(xhr.responseText));
                                else reject(new Error('فشل الرفع'));
                            };
                            xhr.onerror = () => reject(new Error('خطأ اتصال'));
                            xhr.onabort = () => reject(new Error('aborted'));
                            xhr.send(formData);
                        });

                        const mediaURL = mediaType === 'image' ? responseData.data.url : responseData.secure_url;
                        return push(messagesRef, {
                            text: (i === 0) ? text : "",
                            mediaURL,
                            mediaType,
                            fileName: file.name,
                            timestamp: serverTimestamp()
                        });
                    });

                    await Promise.all(uploadPromises);
                } else if (text.trim()) {
                    await push(messagesRef, { text: text, timestamp: serverTimestamp() });
                }

                if (!uploadAborted) {
                    pushBtn.innerHTML = '<i class="fa-solid fa-check-double"></i> <span>تم!</span>';
                    setTimeout(() => { pushBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> <span>نشر</span>'; }, 3000);
                }
            } catch (error) {
                if (error.message !== 'aborted') alert("حدث خطأ: " + error.message);
            } finally {
                resetPanelState();
            }
        };

        window.resetPanelState = () => {
            const pushBtn = document.getElementById('publishBtn');
            pushBtn.disabled = false;
            isUploading = false;
            document.getElementById('uploadProgressContainer').style.display = 'none';
            document.getElementById('uploadProgressBar').style.width = '0%';
            document.getElementById('cancelBar').style.display = 'none';
            document.getElementById('msgInput').value = '';
            document.getElementById('msgInput').style.height = '';
            document.getElementById('publishBtn').innerHTML = '<i class="fa-solid fa-paper-plane"></i>';
            selectedFilesArray = [];
            renderPreviews();
        };

        // --- Schedule Management Logic ---
        window.openScheduleEditorShortcut = async function() {
            document.getElementById('scheduleModal').style.display = 'flex';
            const content = document.getElementById('scheduleEditorContent');
            
            const snapshot = await get(ref(db, 'schedule'));
            let data = snapshot.exists() ? snapshot.val() : {
                card1: { days: "الأحد والأربعاء", grade: "أولى ثانوي", groups: { g1: { name: "المجموعة الأولى (أ)", time: "02:00 PM", status: "متاح" }, g2: { name: "المجموعة الثانية (ب)", time: "03:30 PM", status: "متاح" }, g3: { name: "المجموعة الثالثة (ج)", time: "06:30 PM", status: "متاح" } } },
                card2: { days: "الاثنين والخميس", grade: "أولى ثانوي", groups: { g4: { name: "المجموعة الرابعة (د)", time: "02:00 PM", status: "متاح" }, g5: { name: "المجموعة الخامسة (هـ)", time: "03:30 PM", status: "متاح" }, g6: { name: "المجموعة السادسة (و)", time: "06:30 PM", status: "متاح" } } }
            };

            content.innerHTML = '';
            Object.keys(data).forEach(cardKey => {
                const card = data[cardKey];
                let groupsInputs = '';
                
                Object.keys(card.groups).forEach(gKey => {
                    const group = card.groups[gKey];
                    groupsInputs += `
                        <div class="group-edit-row">
                            <div style="position:relative;">
                                <i class="fa-solid fa-users" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); color:rgba(255,255,255,0.2); font-size:0.8rem;"></i>
                                <input type="text" class="sch-in" style="padding-right:30px;" data-card="${cardKey}" data-group="${gKey}" data-field="name" value="${group.name}" placeholder="اسم المجموعة">
                            </div>
                            <div style="position:relative;">
                                <i class="fa-solid fa-clock" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); color:rgba(255,255,255,0.2); font-size:0.8rem;"></i>
                                <input type="text" class="sch-in" style="padding-right:30px;" data-card="${cardKey}" data-group="${gKey}" data-field="time" value="${group.time}" placeholder="الوقت">
                            </div>
                            <div>
                                <select class="sch-in" data-card="${cardKey}" data-group="${gKey}" data-field="status">
                                    <option value="متاح" ${group.status === 'متاح' ? 'selected' : ''}>✅ متاح</option>
                                    <option value="مكتمل" ${group.status === 'مكتمل' ? 'selected' : ''}>❌ مكتمل</option>
                                </select>
                            </div>
                        </div>
                    `;
                });

                content.innerHTML += `
                    <div style="margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; background: rgba(255,255,255,0.01);">
                        <label style="display:block; margin-bottom:10px; font-size:0.8rem; color:#888;">أيام المجموعات:</label>
                        <input type="text" class="sch-days-in" data-card="${cardKey}" value="${card.days}" style="width:100%; background:#000; border:1px solid var(--master-neon); color:var(--master-neon); padding:10px; border-radius:10px; margin-bottom:20px; font-weight:bold; font-family:inherit;">
                        ${groupsInputs}
                    </div>
                `;
            });
        };

        window.saveScheduleChanges = async function() {
            const inputs = document.querySelectorAll('.sch-in');
            const snapshot = await get(ref(db, 'schedule'));
            let scheduleData = snapshot.val() || {};

            // تحديث نص الأيام أولاً
            document.querySelectorAll('.sch-days-in').forEach(dayIn => {
                const c = dayIn.dataset.card;
                if(!scheduleData[c]) scheduleData[c] = { groups: {} };
                scheduleData[c].days = dayIn.value;
            });

            inputs.forEach(input => {
                const card = input.getAttribute('data-card');
                const group = input.getAttribute('data-group');
                const field = input.getAttribute('data-field');
                
                if (!scheduleData[card]) {
                    let defaultDays = "السبت والثلاثاء";
                    if (card === 'card2') defaultDays = "الأحد والأربعاء";
                    if (card === 'card3') defaultDays = "الاثنين والخميس";
                    
                    scheduleData[card] = { days: defaultDays, groups: {} };
                }
                
                if (!scheduleData[card].groups[group]) scheduleData[card].groups[group] = {};
                
                scheduleData[card].groups[group][field] = input.value;
            });

            await set(ref(db, 'schedule'), scheduleData);
            
            await push(ref(db, 'broadcasts'), {
                text: "📢 تنبيه: تم تحديث جدول المواعيد والمجموعات المتاحة. يرجى مراجعة صفحة الجدول الآن.",
                timestamp: serverTimestamp()
            });

            alert("تم حفظ التعديلات ونشر الخبر للطلاب بنجاح!");
            closeModal('scheduleModal');
        };

        function getMessageHTML(id, m) {
            const date = m.timestamp ? new Date(m.timestamp).toLocaleString('ar-EG', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'الآن';
            
            const isImageOnly = !m.text && m.mediaType === 'image';
            const isAudio = m.mediaType === 'audio';
            const isVideo = m.mediaType === 'video';
            const isVideoOnly = (!m.text || m.text.trim() === '') && isVideo;

            let mediaHtml = '';
            if(m.mediaURL) {
                let content = '', typeClass = '';
                
                if (m.mediaType === 'image') {
                    content = `<img src="${m.mediaURL}" class="msg-media-img" style="display:block; opacity:1;" onclick="openLightbox('${m.mediaURL}', 'image')">`;
                    typeClass = 'square-media';
                } else if (m.mediaType === 'video') {
                    content = `<video src="${m.mediaURL}" controls class="msg-video"></video>`;
                    typeClass = 'video-context';
                } else if (isAudio) {
                    content = `<audio src="${m.mediaURL}" controls class="msg-audio"></audio>`;
                    typeClass = 'audio-wrapper';
                } else {
                    content = `<div style="background:rgba(255,255,255,0.05); padding:15px; border:1px dashed #444; border-radius:8px; display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-file-lines"></i> ${m.fileName || 'ملف مرفق'}</div>`;
                }
                mediaHtml = `
                    <div class="media-wrapper ${typeClass}">
                        ${content}
                    </div>`;
            }

            const actionsHtml = `
                <div class="msg-footer-actions">
                    ${m.mediaURL ? `<a href="${m.mediaURL}" download="${m.fileName || 'file'}" target="_blank" class="btn-mini-action download" title="تحميل الملف"><i class="fa-solid fa-download"></i></a>` : ''}
                    ${m.mediaType === 'video' ? `<button onclick="openLightbox('${m.mediaURL}', 'video')" class="btn-mini-action zoom" title="تكبير"><i class="fa-solid fa-expand"></i></button>` : ''}
                    ${window.isMaster ? `<button onclick="deleteMsg('${id}')" class="btn-mini-action delete" title="حذف الرسالة"><i class="fa-solid fa-trash-can"></i></button>` : ''}
                </div>`;

            return `
                <div class="msg-block ${isImageOnly ? 'image-only' : ''} ${isAudio ? 'audio-type' : ''} ${isVideoOnly ? 'video-only' : ''}" id="msg-${id}">
                    <div class="msg-top-bar">
                        <span class="msg-date">${date}</span>
                    </div>
                    ${!isImageOnly && !isVideoOnly ? `
                        <div class="msg-header">
                            <span><i class="fa-solid ${isAudio ? 'fa-microphone' : 'fa-bullhorn'}" style="color:${isAudio ? 'var(--audio-neon)' : 'var(--master-neon)'}"></i> ${isAudio ? 'تسجيل صوتي' : 'توجيه رسمي'}</span>
                        </div>` : ''}
                    ${m.text ? `<div class="msg-content">${m.text}</div>` : ''}
                    ${mediaHtml}
                    ${actionsHtml}
                </div>`;
        }

        function renderFromCache() {
            const sortedIds = Object.keys(messageCache).sort((a, b) => (messageCache[a].timestamp || 0) - (messageCache[b].timestamp || 0));
            flow.innerHTML = '';
            if (sortedIds.length > 0) {
                sortedIds.forEach(id => flow.insertAdjacentHTML('afterbegin', getMessageHTML(id, messageCache[id])));
            }
        }

        // تحميل أولي للكاش
        renderFromCache();

        function updateLocalCache(id, m) {
            messageCache[id] = m;
            const keys = Object.keys(messageCache);
            if (keys.length > 60) { // الاحتفاظ بآخر 60 رسالة فقط للسرعة
                const oldestKey = keys.sort((a,b) => messageCache[a].timestamp - messageCache[b].timestamp)[0];
                delete messageCache[oldestKey];
            }
            localStorage.setItem(CACHE_KEY, JSON.stringify(messageCache));
        }

        onChildAdded(messagesRef, (snapshot) => {
            const m = snapshot.val();
            const id = snapshot.key;
            if (document.getElementById(`msg-${id}`)) return;
            
            if (flow.innerHTML.includes('جاري')) flow.innerHTML = '';
            updateLocalCache(id, m);
            
            // تحديث حالة القراءة (آخر ظهور) تلقائياً عند رؤية الرسائل
            const currentLastSeen = parseInt(localStorage.getItem('biology_last_seen_news') || '0');
            if (m.timestamp && m.timestamp > currentLastSeen) {
                localStorage.setItem('biology_last_seen_news', m.timestamp);
            }

            flow.insertAdjacentHTML('afterbegin', getMessageHTML(id, m));
        });

        onChildRemoved(messagesRef, (snapshot) => {
            const el = document.getElementById(`msg-${snapshot.key}`);
            if(el) el.remove();
            // إزالة من الكاش أيضاً
            delete messageCache[snapshot.key];
            localStorage.setItem(CACHE_KEY, JSON.stringify(messageCache));
        });

        // --- دالة مسح الكاش الاحترافية ---
        window.clearSiteCache = async function() {
            const msg = "يا بطل، هل تريد تنظيف ذاكرة الموقع؟\n\nسيؤدي هذا لحل أي تعارض في الصور أو الرسائل وإعادة تحميل أحدث نسخة من المنصة.";
            if(confirm(msg)) {
                // التنظيف الشامل
                localStorage.clear();
                sessionStorage.clear();
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    await Promise.all(cacheNames.map(name => caches.delete(name)));
                }
                // فرض التحديث من السيرفر وليس من الكاش
                window.location.replace(window.location.origin + window.location.pathname + '?v=' + Date.now());
            }
        };

        window.deleteMsg = (id) => { 
            if(confirm("هل أنت متأكد يا دكتور من حذف هذه الرسالة؟ لا يمكن التراجع عن هذا الإجراء.")) {
                remove(ref(db, `broadcasts/${id}`)); 
            }
        }

        // --- دوال عارض الصور (Lightbox) ---
        window.openLightbox = function(src, type) {
            const container = document.getElementById('lightbox-content');
            const overlay = document.getElementById('lightbox-overlay');
            
            container.innerHTML = ''; // تنظيف المحتوى السابق
            
            if (type === 'video') {
                container.innerHTML = `<video src="${src}" controls autoplay style="max-width:100%; max-height:90vh; border-radius:10px; box-shadow:0 0 50px rgba(0,255,65,0.2);"></video>`;
            } else if (type === 'audio') {
                container.innerHTML = `<audio src="${src}" controls autoplay style="width:300px; filter: drop-shadow(0 0 20px var(--audio-neon));"></audio>`;
            } else { // image
                const img = document.createElement('img');
                img.src = src;
                img.style.maxWidth = '100%';
                img.style.maxHeight = '90vh';
                img.style.borderRadius = '10px';
                container.appendChild(img);
            }
            
            overlay.classList.add('active');
        };

        window.closeLightbox = function() {
            const overlay = document.getElementById('lightbox-overlay');
            overlay.classList.remove('active');
            // إيقاف الفيديو عند الإغلاق
            setTimeout(() => {
                document.getElementById('lightbox-content').innerHTML = '';
            }, 400);
        };
        
        // إغلاق عند الضغط على الخلفية أو زر الإغلاق
        document.querySelector('.close-lightbox').onclick = window.closeLightbox;
        document.getElementById('lightbox-overlay').onclick = (e) => {
            if(e.target.id === 'lightbox-overlay') window.closeLightbox();
        };

        // --- Realtime Presence Counter ---
        const userCountEl = document.getElementById('userCount');
        const presenceRef = ref(db, 'presence');

        // Create a reference for my connection
        const myConnectionRef = push(presenceRef);

        // Add ourselves to presence list when online.
        const connectedRef = ref(db, '.info/connected');
        onValue(connectedRef, (snap) => {
          if (snap.val() === true) {
            set(myConnectionRef, true);
            // When I disconnect, remove this device
            onDisconnect(myConnectionRef).remove();
          }
        });

        // Count online users
        onValue(presenceRef, (snap) => {
            const onlineCount = snap.exists() ? snap.size : 0;
            userCountEl.innerText = onlineCount;
        });
    </script>

    <script>
        // تسجيل Service Worker
        if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
        }
    </script>
</body>
