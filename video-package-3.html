<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فيديوهات المحطة الأخيرة - الدكتور</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* تحسينات السرعة والنصوص الرفيعة */
        #app-content { font-weight: 300; }
        .main-title { font-weight: 400; font-size: 1.5rem; letter-spacing: 0; }
        .subtitle { font-size: 0.7rem; opacity: 0.8; color: var(--neon-gold); }
        .video-card h3 { font-size: 0.95rem; font-weight: 400; color: #fff; }
        .video-card p { font-size: 0.7rem; font-weight: 300; line-height: 1.4; color: #888; }
        .vid-cat { font-size: 0.6rem; text-transform: uppercase; font-weight: 400; opacity: 0.7; }
        
        /* زر العودة الاحترافي */
        .btn-return-home {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 15px; border-radius: 50px;
            background: rgba(255, 215, 0, 0.03); border: 1px solid rgba(255, 215, 0, 0.1);
            color: var(--neon-gold); font-size: 0.75rem; font-weight: 400;
            transition: 0.3s; margin-bottom: 20px; text-decoration: none;
        }
        .btn-return-home:hover { background: var(--neon-gold); color: #000; transform: translateX(5px); }
    </style>
</head>
<body>
    <div id="app-content">
        <div class="page-header">
            <a href="index.html" class="btn-return-home"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>
            <p class="subtitle">THE FINAL DESTINATION</p>
            <h2 class="main-title">محاضرات الصف الثالث الثانوي</h2>
            <p style="color:#555; margin-top: 5px; font-size: 0.8rem;">محتوى تعليمي خفيف مخصص لأبطال الثانوية العامة.</p>
        </div>

        <section class="container" style="padding-top: 10px;">
            <div class="grid-container grid-3">
                
                <div class="video-card scroll-animate">
                    <div class="vid-thumb" style="aspect-ratio: 16/9; overflow: hidden; position: relative; border-radius: 12px;">
                        <img src="photvid3.png" alt="المحاضرة الأولى" loading="lazy" style="width: 100%; height: 100%; object-fit: cover;">
                        <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center;">
                            <button class="play-btn" style="width: 35px; height: 35px; font-size: 0.8rem; background: var(--neon-gold); color:#000; box-shadow: 0 0 15px var(--neon-gold);" onclick="window.openLightbox('رابط_الفيديو_هنا', 'video')">
                                <i class="fa-solid fa-play"></i>
                            </button>
                        </div>
                    </div>
                    <div class="vid-info">
                        <span class="vid-cat">الفصل الأول</span>
                        <h3 style="margin: 5px 0;">الدعامة في الكائنات الحية</h3>
                        <p>نظرة شاملة ورفيعة المستوى على أجهزة الدعامة.</p>
                    </div>
                </div>

            </div>
        </section>
    </div>
    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            
            const userSnap = await get(ref(db, `users/${user.uid}`));
            const userData = userSnap.val() || {};
            const unlocked = userData.unlocked_packages && userData.unlocked_packages['3'];
            const activeDeviceId = userData.active_device_id;
            const currentDeviceId = localStorage.getItem('biology_device_id');

            if (!unlocked) {
                alert("هذا الباكيدج غير مفعل لحسابك.");
                window.location.href = 'index.html';
                return;
            }

            if (activeDeviceId && activeDeviceId !== currentDeviceId) {
                alert("تنبيه أمني: لا يمكنك فتح الباكيدج إلا من جهاز التفعيل الأساسي.");
                signOut(auth);
                window.location.href = 'auth.html';
            }
        });
    </script>
</body>
</html>
