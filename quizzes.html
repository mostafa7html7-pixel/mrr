<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="بنك الأسئلة والاختبارات التفاعلية في الأحياء. قيم مستواك الآن مع اختبارات دكتور عبدالله لكل أبواب المنهج (أولى، تانية، تالتة ثانوي).">
    <meta name="keywords" content="امتحانات أحياء إلكترونية, بنك أسئلة أحياء ثانوية عامة, اختبارات تفاعلية أحياء, تقييم مستوى أحياء">
    <title>بنك الاختبارات الإلكترونية | منصة الدكتور</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --accent-primary: #00ff88;
            --accent-secondary: #00d2ff;
            --accent-hot: #ff0055;
            --bg-deep: #02040a;
            --card-surface: rgba(13, 17, 23, 0.7);
            --gemini-purple: #9b72f3;
            --gemini-pink: #d96570;
            --gemini-gradient: linear-gradient(135deg, #4285f4, #9b72f3, #d96570);
            --card-bg-dark: rgba(15, 23, 42, 0.6);
        }

        .quiz-grid { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); 
            gap: 25px;
            margin-top: 40px;
        }
 
        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(0, 255, 136, 0.08) 0%, transparent 50%);
            transition: background 0.1s ease;
        }

        .quiz-card {
            background: var(--card-surface);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .quiz-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 100%);
            pointer-events: none;
        }

        .quiz-card:hover {
            transform: translateY(-12px) scale(1.03);
            border-color: var(--accent-primary);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 255, 136, 0.15);
        }

        .quiz-card::after {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.1) 0%, transparent 70%);
            opacity: 0; transition: 0.5s; pointer-events: none;
        }
        .quiz-card:hover::after { opacity: 1; }

        .quiz-icon {
            font-size: 2.5rem;
            color: #fff;
            margin-bottom: 15px;
            width: 60px;
            height: 60px;
            background: var(--gemini-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            box-shadow: 0 10px 20px rgba(66, 133, 244, 0.3);
        }

        .quiz-card h3 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: var(--text-white);
            font-weight: 800;
        }

        .quiz-details {
            display: flex;
            gap: 20px;
            color: var(--text-gray);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .quiz-details span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-start-quiz {
            margin-top: auto; /* يدفع الزر لأسفل الكارت */
            background: var(--gemini-gradient);
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1rem;
            transition: 0.3s;
            border: none;
            box-shadow: 0 4px 15px rgba(155, 114, 243, 0.3);
        }

        .btn-start-quiz:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(155, 114, 243, 0.5);
            filter: brightness(1.1);
        }

        .btn-start-quiz.locked {
            background: var(--card-bg);
            color: var(--text-gray);
            border-color: var(--border-color);
            cursor: not-allowed;
        }
        .btn-start-quiz.locked:hover {
            background: var(--card-bg);
            box-shadow: none;
        }

        /* Light Mode */
        body.light-mode .quiz-card {
            background: #fff;
            border-color: #e2e8f0;
        }
        body.light-mode .quiz-card h3 { color: #1a202c; }
        body.light-mode .quiz-details { color: #718096; }
        body.light-mode .btn-start-quiz.locked { background: #f1f5f9; border-color: #e2e8f0; color: #94a3b8; }

        @media (max-width: 768px) {
            .page-header { margin: 30px 0 15px; }
            .page-header .subtitle { font-size: 0.7rem; letter-spacing: 1px; }
            .page-header .main-title { font-size: 1.6rem; margin-bottom: 5px; }
            .page-header p:not(.subtitle) { font-size: 0.85rem; padding: 0 20px; }

            .quiz-date-info {
                font-size: 0.75rem !important;
                margin-bottom: 15px;
                opacity: 0.8;
            }

            .quiz-grid {
                grid-template-columns: 1fr;
                gap: 15px;
                margin-top: 20px;
            }
            .quiz-card {
                padding: 15px;
            }
            .quiz-details {
                flex-wrap: wrap;
                gap: 10px;
            }
            .quiz-icon {
                width: 50px;
                height: 50px;
                font-size: 2rem;
                margin-bottom: 10px;
            }
            .quiz-card h3 {
                font-size: 1.1rem;
                margin-bottom: 8px;
            }
        }

        .quiz-date-info {
            font-size: 0.8rem;
            color: var(--gemini-pink);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
        }
        .quiz-date-info.is-today { color: var(--accent-primary); font-weight: bold; text-shadow: 0 0 15px rgba(0, 255, 136, 0.4); }
        .quiz-date-info.is-today i { animation: heartBeat 1.5s infinite; }

        /* --- ستايلات سجل المحاولات والنتائج --- */
        .attempts-history {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .attempts-list {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 5px 0 10px;
            scrollbar-width: none;
        }
        .attempts-list::-webkit-scrollbar { display: none; }
        .attempt-chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 12px;
            border-radius: 12px;
            min-width: 80px;
            text-align: center;
            flex-shrink: 0;
        }
        .attempt-chip .score { display: block; font-weight: 900; color: var(--accent-primary); font-size: 0.9rem; }
        .attempt-chip .label { display: block; font-size: 0.6rem; color: #666; margin-top: 2px; }
        
        .retry-notice {
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent-primary);
            padding: 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-bottom: 15px;
            text-align: center;
            border: 1px solid rgba(0, 255, 136, 0.2);
            font-weight: bold;
        }

        /* --- تحسينات الدخول الفوري والاحترافي --- */
        .quiz-card {
            opacity: 0;
            transform: translateY(30px);
            animation: cardEntrance 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.8), rgba(10, 15, 25, 0.9));
        }

        @keyframes cardEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .quiz-card:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 20px 40px rgba(0, 255, 136, 0.2);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-heart-pulse"></i>
            <div class="logo-text"><span>الدكتور</span><small>BIOLOGY MASTER</small></div>
        </div>
        <ul class="nav-links">

            <li><a href="reviews.html">ورق الشرح</a></li>
            <li><a href="contact.html">تواصل معنا</a></li>
        </ul>
        <div style="display:flex; align-items:center; gap:5px;">
            <button id="themeToggle" class="theme-toggle" title="تبديل الوضع"><i class="fa-solid fa-moon"></i></button>
            <button id="installAppBtn" class="btn-nav-install" style="display: none;" title="تثبيت التطبيق"><i class="fa-solid fa-download"></i></button>
            <div class="menu-btn"><i class="fa-solid fa-bars"></i></div>
        </div>
    </nav>

    <div id="app-content">
    <div class="page-header" style="animation: fadeInUp 0.8s ease; position: relative; z-index: 2;">
        <p class="subtitle">BIOLOGY QUIZ BANK</p>
        <h2 class="main-title">بنك <span style="color: var(--accent-primary); text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);">الاختبارات</span></h2>
        <p style="color:#888">اختبر فهمك، تحدى نفسك، وتفوق في المادة.</p>
    </div>

    <section class="container">
        <div class="quiz-grid" id="quizGrid">
            <p style="text-align: center; color: var(--text-gray);">جاري تحميل الاختبارات المتاحة...</p>
        </div>
    </section>
    </div>

    <footer>
        <div style="text-align: center; padding: 20px;">
            <p style="margin-bottom: 10px; color: #888;">جميع الحقوق محفوظة © 2026 | منصة الدكتور</p>
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                <span style="color: #555; font-size: 0.9rem;">برمجة: <strong style="color: var(--quiz-accent);">مصطفى ابوطالب</strong></span>
                <a href="admin.html" style="color: #444; font-size: 0.8rem; text-decoration: none; border: 1px solid #333; padding: 4px 10px; border-radius: 15px; transition: 0.3s;">
                    <i class="fa-solid fa-user-shield"></i>
                </a>
            </div>
        </div>
    </footer>

    <script type="module" src="main.js"></script>
    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
        import { firebaseConfig } from "./firebase-config.js"; // استيراد إعدادات Firebase

        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0]; // استخدام getApps() لتجنب إعادة التهيئة
        const db = getDatabase(app);
        const auth = getAuth(app);

        const quizGrid = document.getElementById('quizGrid');
        const icons = ['fa-dna', 'fa-microscope', 'fa-puzzle-piece', 'fa-flask-vial', 'fa-seedling'];

        // --- نظام الإضاءة الديناميكي (Dynamic Spotlight) ---
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            document.body.style.setProperty('--mouse-x', x + '%');
            document.body.style.setProperty('--mouse-y', y + '%');
        });

        // --- Rocket Speed: تحميل الكاش فوراً قبل الاتصال بالسيرفر ---
        const cachedHTML = localStorage.getItem('quizzes_cache_v2');
        if (cachedHTML) { quizGrid.innerHTML = cachedHTML; }

        onAuthStateChanged(auth, (user) => {
            if (!user) return;

            onValue(ref(db, 'quizzes'), async (snapshot) => {
            if (snapshot.exists()) {
                let htmlContent = '';
                const quizzesData = snapshot.val();
                let displayIndex = 0;

                for (const quizId in quizzesData) {
                    const quiz = quizzesData[quizId];
                    
                    // إخفاء الاختبار إذا لم يكن منشوراً
                    if (quiz.published !== true) continue;

                    const questionCount = quiz.questions ? Object.keys(quiz.questions).length : 0;
                    const attemptsLimit = quiz.attemptsLimit || 1;

                    // جلب نتيجة الطالب لهذا الاختبار تحديداً
                    const resultSnap = await get(ref(db, `quiz_results/${quizId}/${user.uid}`));
                    const userResult = resultSnap.val();
                    const attemptsMade = userResult ? (userResult.attemptsMade || 0) : 0;
                    const isLocked = attemptsMade >= attemptsLimit;
                    
                    // بناء قائمة النتائج السابقة
                    let historyHtml = '';
                    if (userResult) {
                        // إذا كانت هناك مصفوفة تاريخ، نعرضها، وإلا نعرض النتيجة الأساسية كأول محاولة
                        const history = userResult.history ? Object.values(userResult.history) : (userResult.percentage !== undefined ? [{ percentage: userResult.percentage }] : []);
                        historyHtml = `
                            <div class="attempts-history">
                                <span style="font-size:0.7rem; color:#555; display:block; margin-bottom:8px;">نتائج محاولاتك السابقة:</span>
                                <div class="attempts-list">
                                    ${history.map((h, i) => `
                                        <div class="attempt-chip">
                                            <span class="score">${h.percentage}%</span>
                                            <span class="label">محاولة ${i+1}</span>
                                        </div>`).join('')}
                                </div>
                            </div>`;
                    }
                    
                    // تنسيق التاريخ والوقت والفترة
                    const quizDate = quiz.createdAt ? new Date(quiz.createdAt) : null;
                    const today = new Date();
                    const isToday = quizDate && quizDate.toDateString() === today.toDateString();

                    const dateFormatted = quizDate ? quizDate.toLocaleString('ar-EG', {
                        weekday: 'short',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: true
                    }) : 'تاريخ الإصدار غير متوفر';

                    const iconClass = icons[displayIndex % icons.length];

                    const statusText = isLocked ? 'استنفدت المحاولات' : (attemptsMade > 0 ? `محاولة ${attemptsMade + 1} من ${attemptsLimit}` : 'ابدأ الاختبار الآن');
                    const btnClass = isLocked ? 'btn-start-quiz locked' : 'btn-start-quiz';
                    const showRetryNotice = !isLocked && attemptsMade > 0;

                    htmlContent += `
                        <div class="quiz-card" style="animation-delay: ${displayIndex * 0.1}s;">
                            <div class="quiz-icon"><i class="fa-solid ${iconClass}"></i></div>
                            <h3>${quiz.title}</h3>
                            ${showRetryNotice ? `<div class="retry-notice"><i class="fa-solid fa-bolt"></i> مسموح لك بمحاولة أخرى لتحسين درجتك!</div>` : ''}
                            <div class="quiz-details">
                                <span><i class="fa-solid fa-repeat"></i> ${attemptsMade} / ${attemptsLimit} محاولات</span>
                                <span><i class="fa-solid fa-list-ol"></i> ${questionCount} سؤال</span>
                                <span><i class="fa-regular fa-clock"></i> ${quiz.timeLimit} دقيقة</span>
                            </div>
                            <a href="${isLocked ? '#' : `quiz-player.html?id=${quizId}&title=${encodeURIComponent(quiz.title)}&time=${quiz.timeLimit}&q=${questionCount}&made=${attemptsMade}&limit=${attemptsLimit}`}" class="${btnClass}">${statusText} <i class="fa-solid ${isLocked ? 'fa-lock' : 'fa-arrow-left'}"></i></a>
                            ${attemptsMade > 0 ? `<a href="quiz-player.html?id=${quizId}&review=true" target="_top" class="btn-start-quiz" style="background:rgba(255,255,255,0.05); color:#fff; border:1px solid #333; margin-top:10px; box-shadow:none;"><i class="fa-solid fa-magnifying-glass-chart"></i> مراجعة الإجابات السابقة</a>` : ''}
                            ${historyHtml}
                        </div>`;
                    
                    displayIndex++;
                }
                
                quizGrid.innerHTML = htmlContent;
                // تحديث الكاش للزيارة القادمة
                localStorage.setItem('quizzes_cache_v2', htmlContent);
            } else {
                quizGrid.innerHTML = '<p style="text-align: center; color: var(--text-gray); grid-column: 1 / -1;">لا توجد اختبارات متاحة حالياً. ترقبوا الجديد!</p>';
                localStorage.removeItem('quizzes_cache_v2');
            }
        });
        });
    </script>
</body>
