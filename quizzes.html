    <meta name="keywords" content="اختبارات أحياء, كويزات, امتحانات إلكترونية, بنك أسئلة, تقييم الطلاب, أحياء ثانوية عامة">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --gemini-blue: #4285f4;
            --gemini-purple: #9b72f3;
            --gemini-pink: #d96570;
            --gemini-gradient: linear-gradient(135deg, #4285f4, #9b72f3, #d96570);
            --card-bg-dark: rgba(15, 23, 42, 0.6);
        }

        .quiz-grid { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }
 
        .quiz-card {
            background: var(--card-bg-dark);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(138, 180, 248, 0.2); 
            border-radius: 24px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .quiz-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(155, 114, 243, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(66, 133, 244, 0.15);
        }

        .quiz-icon {
            font-size: 2.5rem;
            color: #fff;
            margin-bottom: 15px;
            width: 60px;
            height: 60px;
            background: var(--gemini-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            box-shadow: 0 10px 20px rgba(66, 133, 244, 0.3);
        }

        .quiz-card h3 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: var(--text-white);
            font-weight: 800;
        }

        .quiz-details {
            display: flex;
            gap: 20px;
            color: var(--text-gray);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .quiz-details span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-start-quiz {
            margin-top: auto; /* يدفع الزر لأسفل الكارت */
            background: var(--gemini-gradient);
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1rem;
            transition: 0.3s;
            border: none;
            box-shadow: 0 4px 15px rgba(155, 114, 243, 0.3);
        }

        .btn-start-quiz:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(155, 114, 243, 0.5);
            filter: brightness(1.1);
        }

        .btn-start-quiz.locked {
            background: var(--card-bg);
            color: var(--text-gray);
            border-color: var(--border-color);
            cursor: not-allowed;
        }
        .btn-start-quiz.locked:hover {
            background: var(--card-bg);
            box-shadow: none;
        }

        /* Light Mode */
        body.light-mode .quiz-card {
            background: #fff;
            border-color: #e2e8f0;
        }
        body.light-mode .quiz-card h3 { color: #1a202c; }
        body.light-mode .quiz-details { color: #718096; }
        body.light-mode .btn-start-quiz.locked { background: #f1f5f9; border-color: #e2e8f0; color: #94a3b8; }

        @media (max-width: 768px) {
            .page-header { margin: 30px 0 15px; }
            .page-header .subtitle { font-size: 0.7rem; letter-spacing: 1px; }
            .page-header .main-title { font-size: 1.6rem; margin-bottom: 5px; }
            .page-header p:not(.subtitle) { font-size: 0.85rem; padding: 0 20px; }

            .quiz-date-info {
                font-size: 0.75rem !important;
                margin-bottom: 15px;
                opacity: 0.8;
            }

            .quiz-grid {
                grid-template-columns: 1fr;
                gap: 15px;
                margin-top: 20px;
            }
            .quiz-card {
                padding: 15px;
            }
            .quiz-details {
                flex-wrap: wrap;
                gap: 10px;
            }
            .quiz-icon {
                width: 50px;
                height: 50px;
                font-size: 2rem;
                margin-bottom: 10px;
            }
            .quiz-card h3 {
                font-size: 1.1rem;
                margin-bottom: 8px;
            }
        }

        .quiz-date-info {
            font-size: 0.8rem;
            color: var(--gemini-pink);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
        }
        .quiz-date-info.is-today { color: var(--neon-gold); font-weight: bold; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        .quiz-date-info.is-today i { animation: heartBeat 1.5s infinite; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-heart-pulse"></i>
            <div class="logo-text"><span>الدكتور</span><small>BIOLOGY MASTER</small></div>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="library.html">الكتب</a></li>
            <li><a href="videos.html">الفيديوهات</a></li>
            <li><a href="quizzes.html" class="active">الاختبارات</a></li>
            <li><a href="schedule.html">الجدول</a></li>
            <li><a href="reviews.html">ورق الشرح</a></li>
            <li><a href="lab.html">المعرض</a></li>
            <li><a href="contact.html">تواصل معنا</a></li>
        </ul>
        <div style="display:flex; align-items:center; gap:5px;">
            <button id="themeToggle" class="theme-toggle" title="تبديل الوضع"><i class="fa-solid fa-moon"></i></button>
            <button id="installAppBtn" class="btn-nav-install" style="display: none;" title="تثبيت التطبيق"><i class="fa-solid fa-download"></i></button>
            <div class="menu-btn"><i class="fa-solid fa-bars"></i></div>
        </div>
    </nav>

    <div id="app-content">
    <div class="page-header">
        <p class="subtitle">BIOLOGY QUIZ BANK</p>
        <h2 class="main-title">بنك <span style="background: var(--gemini-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">الاختبارات</span></h2>
        <p style="color:#888">اختبر فهمك، تحدى نفسك، وتفوق في المادة.</p>
    </div>

    <section class="container">
        <div class="quiz-grid">
            <p style="text-align: center; color: var(--text-gray);">جاري تحميل الاختبارات المتاحة...</p>
        </div>
    </section>
    </div>

    <footer>
        <div style="text-align: center; padding: 20px;">
            <p style="margin-bottom: 10px; color: #888;">جميع الحقوق محفوظة © 2026 | منصة الدكتور</p>
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                <span style="color: #555; font-size: 0.9rem;">برمجة: <strong style="color: var(--quiz-accent);">مصطفى ابوطالب</strong></span>
                <a href="admin.html" style="color: #444; font-size: 0.8rem; text-decoration: none; border: 1px solid #333; padding: 4px 10px; border-radius: 15px; transition: 0.3s;">
                    <i class="fa-solid fa-user-shield"></i>
                </a>
            </div>
        </div>
    </footer>

    <script type="module" src="main.js"></script>
    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyD092yeOowtCLW0fDcIzaEXrnxvrN4X5T8", authDomain: "abqarieno.firebaseapp.com", databaseURL: "https://abqarieno-default-rtdb.firebaseio.com", projectId: "abqarieno", storageBucket: "abqarieno.firebasestorage.app", messagingSenderId: "790682500839", appId: "1:790682500839:web:cd50b8e01729f821e06c42" };
        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
        const db = getDatabase(app);

        const quizGrid = document.querySelector('.quiz-grid');
        const icons = ['fa-dna', 'fa-microscope', 'fa-puzzle-piece', 'fa-flask-vial', 'fa-seedling'];

        onValue(ref(db, 'quizzes'), (snapshot) => {
            quizGrid.innerHTML = '';
            if (snapshot.exists()) {
                let iconIndex = 0;
                snapshot.forEach(childSnapshot => {
                    const quizId = childSnapshot.key;
                    const quiz = childSnapshot.val();
                    
                    // إخفاء الاختبار إذا لم يكن منشوراً
                    if (quiz.published !== true) return;

                    const questionCount = quiz.questions ? Object.keys(quiz.questions).length : 0;
                    
                    // تنسيق التاريخ والوقت والفترة
                    const quizDate = quiz.createdAt ? new Date(quiz.createdAt) : null;
                    const today = new Date();
                    const isToday = quizDate && quizDate.toDateString() === today.toDateString();

                    const dateFormatted = quizDate ? quizDate.toLocaleString('ar-EG', {
                        weekday: 'short',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: true
                    }) : 'تاريخ الإصدار غير متوفر';

                    const iconClass = icons[iconIndex % icons.length];
                    iconIndex++;

                    const card = document.createElement('div');
                    card.className = 'quiz-card';
                    card.innerHTML = `
                        <div class="quiz-icon"><i class="fa-solid ${iconClass}"></i></div>
                        <h3>${quiz.title}</h3>
                        <div class="quiz-date-info ${isToday ? 'is-today' : ''}">
                            <i class="${isToday ? 'fa-solid fa-star' : 'fa-regular fa-calendar-check'}"></i>
                            <span>${isToday ? 'صدر اليوم: ' : 'صدر في: '} ${dateFormatted}</span>
                        </div>
                        <div class="quiz-details">
                            <span><i class="fa-solid fa-list-ol"></i> ${questionCount} سؤال</span>
                            <span><i class="fa-regular fa-clock"></i> ${quiz.timeLimit} دقيقة</span>
                        </div>
                        <a href="quiz-player.html?id=${quizId}" class="btn-start-quiz">ابدأ الاختبار <i class="fa-solid fa-arrow-left"></i></a>
                    `;
                    quizGrid.appendChild(card);
                });
            } else {
                quizGrid.innerHTML = '<p style="text-align: center; color: var(--text-gray); grid-column: 1 / -1;">لا توجد اختبارات متاحة حالياً. ترقبوا الجديد!</p>';
            }
        });
    </script>
</body>
</html>
