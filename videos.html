<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفيديوهات - الدكتور</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <!-- التحميل المسبق الذكي لصور الباكيدجات -->
    <link rel="preload" as="image" href="photvid1.png">
    <link rel="preload" as="image" href="photvid2.png">
    <link rel="preload" as="image" href="photvid3.png">

    <style>
        .video-hub-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            padding: 100px 5% 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .package-glass-card {
            background: rgba(255, 255, 255, 0.03); /* شفافية أكثر للزجاج */
            backdrop-filter: blur(40px) saturate(200%); /* ضبابية فائقة */
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.3); /* حافة علوية مضيئة */
            border-radius: 35px;
            padding: 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255,255,255,0.02);
        }
 
        .package-glass-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: var(--neon-green);
            box-shadow: 0 35px 70px rgba(0, 255, 65, 0.15);
        }

        .free-ribbon-top {
            position: absolute;
            top: 0; 
            right: 0;
            background: var(--neon-green);
            color: #000;
            padding: 8px 30px;
            font-size: 0.85rem;
            font-weight: 900;
            border-radius: 0 0 0 25px;
            box-shadow: -5px 5px 15px rgba(0, 255, 65, 0.3);
            z-index: 5;
        }

        .btn-package-pro {
            position: relative;
            width: 100%;
            height: 65px;
            border-radius: 22px;
            cursor: pointer;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
            margin-top: 15px;
            color: #000;
            top: 0;
        }

        /* تأثير المسح الضوئي (Speed Shine) */
        .btn-package-pro::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transition: all 0.6s;
        }
        .btn-package-pro:hover::before { left: 100%; }

        .btn-package-pro:hover {
            transform: translateY(-6px);
            filter: brightness(1.1);
        }

        .btn-package-pro:active {
            transform: translateY(2px);
            transition: 0.1s;
        }

        /* تنوع الألوان الاحترافي (3D Gradients) */
        .btn-grade-1 {
            background: linear-gradient(180deg, #00ff88 0%, #00bd68 100%);
            box-shadow: 0 10px 25px rgba(0, 255, 136, 0.3), 
                        inset 0 -5px 0 rgba(0, 0, 0, 0.2), 
                        inset 0 4px 0 rgba(255, 255, 255, 0.3);
        }
        .btn-grade-1:active { box-shadow: 0 4px 10px rgba(0, 255, 136, 0.2), inset 0 2px 0 rgba(0, 0, 0, 0.2); }

        .btn-grade-2 {
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e0 100%);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.15), 
                        inset 0 -5px 0 rgba(0, 0, 0, 0.1), 
                        inset 0 4px 0 rgba(255, 255, 255, 0.8);
        }
        .btn-grade-2:active { box-shadow: 0 4px 10px rgba(255, 255, 255, 0.1), inset 0 2px 0 rgba(0, 0, 0, 0.2); }

        .btn-grade-3 {
            background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3), 
                        inset 0 -5px 0 rgba(0, 0, 0, 0.2), 
                        inset 0 4px 0 rgba(255, 255, 255, 0.4);
        }
        .btn-grade-3:active { box-shadow: 0 4px 10px rgba(255, 215, 0, 0.2), inset 0 2px 0 rgba(0, 0, 0, 0.2); }

        .special-gold { border-color: rgba(255, 215, 0, 0.3) !important; }
        .special-gold:hover { border-color: var(--neon-gold); box-shadow: 0 35px 70px rgba(255, 215, 0, 0.15); }

        .package-banner {
            width: 100%;
            border-radius: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-heart-pulse"></i>
            <div class="logo-text"><span>الدكتور</span><small>BIOLOGY MASTER</small></div>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="library.html">الكتب</a></li>
            <li><a href="videos.html" class="active">الفيديوهات</a></li>
            <li><a href="quizzes.html">الاختبارات</a></li>
            <li><a href="schedule.html">الجدول</a></li>
            <li><a href="reviews.html">ورق الشرح</a></li>
            <li><a href="contact.html">تواصل معنا</a></li>
        </ul>
        <div style="display:flex; align-items:center; gap:5px;">
            <button id="themeToggle" class="theme-toggle" title="تبديل الوضع"><i class="fa-solid fa-moon"></i></button>
            <button id="installAppBtn" class="btn-nav-install" style="display: none;" title="تثبيت التطبيق"><i class="fa-solid fa-download"></i></button>
            <div class="menu-btn"><i class="fa-solid fa-bars"></i></div>
        </div>
    </nav>

    <div id="app-content">
    <div class="video-hub-container">
        
        <!-- الصف الأول الثانوي -->
        <div class="package-glass-card" style="animation: fadeInUp 0.6s ease;">
            <div class="free-ribbon-top">مجانى لطلاب المستر</div>
            <img src="photvid1.png" alt="باكيدج أولى ثانوي" class="package-banner" fetchpriority="high" decoding="async">
            <button class="btn-package-pro btn-grade-1" onclick="openPackage(1)"><i class="fa-solid fa-bolt"></i> دخول الباكيدج المجاني</button>
        </div>

        <!-- الصف الثاني الثانوي -->
        <div class="package-glass-card" style="animation: fadeInUp 0.8s ease;">
            <img src="photvid2.png" alt="باكيدج تانية ثانوي" class="package-banner" fetchpriority="high" decoding="async">
            <button class="btn-package-pro btn-grade-2" onclick="openPackage(2)"><i class="fa-solid fa-unlock-keyhole"></i> فتح باكيدج تانية ثانوي</button>
        </div>

        <!-- الصف الثالث الثانوي -->
        <div class="package-glass-card special-gold" style="animation: fadeInUp 1s ease;">
            <img src="photvid3.png" alt="باكيدج تالتة ثانوي" class="package-banner" fetchpriority="high" decoding="async">
            <button class="btn-package-pro btn-grade-3" onclick="openPackage(3)"><i class="fa-solid fa-crown"></i> محتوى أبطال تالتة ثانوي</button>
        </div>

    </div>
    </div>

    <footer>
        <!-- (الفوتر كما هو في السياق الأصلي) -->
    </footer>

    <script src="main.js"></script>
    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
        import { firebaseConfig } from "./firebase-config.js"; // استيراد إعدادات Firebase

        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
        const auth = getAuth(app);

        window.openPackage = (num) => {
            window.location.href = `video-package-${num}.html`;
        };
    </script>
</body>
</html>
