<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فيديوهات ثانية ثانوي - الدكتور</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        .empty-package-container { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .glass-info-box {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 50px 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .glass-info-box i { font-size: 4rem; color: #4285f4; margin-bottom: 25px; opacity: 0.8; }
        .glass-info-box h2 { font-size: 2rem; margin-bottom: 15px; color: #fff; }
        .glass-info-box p { color: #888; line-height: 1.8; margin-bottom: 30px; }
        .btn-back-visible {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; padding: 8px 15px; border-radius: 12px; font-weight: bold; font-size: 0.85rem;
            display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .btn-back-visible:hover { background: #4285f4; color: #fff; border-color: #4285f4; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"> 
            <i class="fa-solid fa-heart-pulse"></i>
            <div class="logo-text"><span>الدكتور</span><small>BIOLOGY MASTER</small></div>
        </div>
        <div style="display:flex; align-items:center; gap:5px;">
            <a href="videos.html" class="btn-back-visible"><i class="fa-solid fa-arrow-right"></i> العودة</a>
            <button id="themeToggle" class="theme-toggle" title="تبديل الوضع"><i class="fa-solid fa-moon"></i></button>
            <button id="installAppBtn" class="btn-nav-install" style="display: none;" title="تثبيت التطبيق"><i class="fa-solid fa-download"></i></button>
        </div>
    </nav>

    <div id="app-content">
        <div class="empty-package-container">
            <div class="glass-info-box">
                <i class="fa-solid fa-dna fa-bounce"></i>
                <h2>باكيدج الصف الثاني الثانوي</h2>
                <p>يا بطل، نحن نجهز لك حالياً شروحات تفصيلية لأجهزة الجسم والتركيبات الحيوية المعقدة بأسلوب بصري فريد. <br> المحتوى قيد المراجعة النهائية ليظهر لك بأفضل صورة.</p>
                <div style="background: rgba(66, 133, 244, 0.1); padding: 15px; border-radius: 15px; color: #4285f4; font-weight: bold; border: 1px dashed #4285f4;">
                    <i class="fa-solid fa-hourglass-half"></i> جاري العمل على رفع الفيديوهات.. انتظرونا!
                </div>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
